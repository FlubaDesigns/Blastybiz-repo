<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>BlastyBiz owner sign-in</title>
<style>body{font:18px/1.5 system-ui;margin:0;background:#101810;color:#f5fff5}main{max-width:34rem;margin:8vh auto;padding:24px}button,a{font:inherit}button{padding:14px 20px;background:#a4ed58;color:#102010;border:0;border-radius:8px;cursor:pointer}button:disabled{opacity:.6}code{overflow-wrap:anywhere}a{color:#b9ef85}</style></head>
<body><main><h1>BlastyBiz owner sign-in</h1><p>Open your existing workspace through the Authorization Engine.</p><button id="request">Request authorized sign-in</button><div id="status" role="status" aria-live="polite"></div><p><a href="BlastyBiz-Login.html?intent=signin">Use regular sign-in</a></p></main>
<script type="module">
import {auth} from './firebase-init-v2.js';
import {signInWithCustomToken} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
const button=document.getElementById('request'),status=document.getElementById('status');
const pause=ms=>new Promise(resolve=>setTimeout(resolve,ms));
button.addEventListener('click',async()=>{
 button.disabled=true;status.textContent='Starting sign-in…';
 try {
  const started=await fetch('/api/auth/engine/session',{method:'POST',credentials:'same-origin'});
  if(!started.ok)throw Error();
  const request=await started.json();
  if(!/^[a-f0-9-]{36}$/.test(request.requestId)||!Number.isFinite(request.expiresAtMs))throw Error();
  status.replaceChildren();
  const instruction=document.createElement('p');instruction.textContent='Waiting for Authorization Engine approval. Keep this tab open; the request expires in 10 minutes.';
  const id=document.createElement('code');id.textContent=request.requestId;id.dataset.testid='engine-request-id';status.append(instruction,id);
  while(Date.now()<request.expiresAtMs){
   await pause(3000);
   const response=await fetch('/api/auth/engine/session/'+request.requestId,{method:'POST',credentials:'same-origin'});
   if(response.status===202)continue;
   if(!response.ok)throw Error();
   const result=await response.json();
   if(typeof result.customToken!=='string')throw Error();
   await signInWithCustomToken(auth,result.customToken);
   // This flow cannot create an account, profile, campaign, or checkout.
   location.replace('BlastyBiz.html');return;
  }
  throw Error();
 }catch{status.textContent='Sign-in could not complete. Start a new request or use regular sign-in.';button.disabled=false;}
});
</script></body></html>
