<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
<meta charset="UTF-8"/>
  <meta name="theme-color" content="#000000"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link rel="stylesheet" href="global-style.css?v=1786304797822" />
<title>BlastyBiz — Connected!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>body{visibility:hidden}</style>
<script type="importmap">
{
  "integrity": {
    "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js":       "sha384-wY0ZJNz4V101UNldqXjHz0zuQq2LFWQg9C6MejyUaw58KxejR+Fq3MinHCx/5y77",
    "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js":      "sha384-zgcbfcVBtrcOc7CwpMfyGnYBfuol1tUBzdw+qfnzk43mD50+D2shQKuddFaWQfsc",
    "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js": "sha384-wrbWJmwwo/g58yNujR9u0v2HlcTvuGH1Pb8q0J3RR0EyaqypirmzeoG8+qkopilb",
    "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js":   "sha384-MiuhCiy/+BHXhKiAgD/lPmYfVJHJMXdXL6BVfwPkfeg7UCfcjV6EMGCWk+LqguU1"
  }
}
</script>
  <script type="module" src="./auth-guard.js"></script>
<script src="blastybiz-menu.js?v=7"></script>
<script src="escape-utils.js"></script>
<script src="blasty-registry.js"></script>
<script src="blasty-events.js"></script>
<script src="blasty-guidance.js"></script>
<script src="business-form.js"></script>
<script type="module" src="blasty-runtime.js"></script>
</head>
<body class="app-page connected-page has-site-header">

<div id="header__inject"></div>
<script src="header-loader.js?v=1"></script>

<main class="main w-narrow">
<div class="main-inner">
  <div id="page-content">
    <div class="page-loading">
      <div class="spinner-lg"></div>
      Loading your connection…
    </div>
  </div>
</div><!-- /.main-inner -->
</main>

<script type="module">
import { auth, db } from './firebase-init-v2.js';
import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getDoc, doc } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const params = new URLSearchParams(window.location.search);
const platform = params.get('connected');  // 'google' or 'facebook'
const errorPlatform = params.get('error'); // 'google' or 'facebook'
const returnTo = params.get('returnTo');   // 'onboarding' when coming from the onboarding wizard

const PLATFORM_META = {
  google: {
    label: 'Google Business Profile',
    icon: 'G',
    iconBg: 'rgba(66,133,244,0.12)',
    iconColor: '#4285F4',
    docId: suffix => suffix + '_google',
    nameField: 'locationName',
    steps: [
      { title: 'You create a listing', desc: 'Fill in your business info — BlastyBiz uses it across every platform.' },
      { title: 'AI writes your post', desc: 'BlastyBiz adapts your listing into a Google-optimised update automatically.' },
      { title: 'You review and approve', desc: 'See exactly what will post before anything goes live. One click to approve.' },
      { title: 'BlastyBiz posts it', desc: 'Your Google Business Profile is updated — no copy-paste, no login required.' }
    ]
  },
  facebook: {
    label: 'Facebook Pages',
    icon: 'f',
    iconBg: 'rgba(24,119,242,0.12)',
    iconColor: '#1877F2',
    docId: suffix => suffix + '_facebook',
    nameField: 'pageName',
    steps: [
      { title: 'You create a listing', desc: 'Fill in your business info once — BlastyBiz handles the rest.' },
      { title: 'AI writes your Facebook post', desc: 'A casual, engaging post written for your Facebook audience — not a dry directory listing.' },
      { title: 'You review and approve', desc: 'See the exact post text before anything is published. Edit if you want.' },
      { title: 'BlastyBiz posts to your Page', desc: 'Goes live on your Facebook Business Page. Instagram too, if it was linked.' }
    ]
  }
};

auth.authStateReady().then(() => {
  onAuthStateChanged(auth, async (user) => {
    if (!user) return; // auth-guard.js handles redirect after 3s grace period

    const content = document.getElementById('page-content');

    // ── ERROR STATE ──
    if (errorPlatform) {
      const meta = Object.hasOwn(PLATFORM_META, errorPlatform) ? PLATFORM_META[errorPlatform] : { label: 'this platform' };
      content.innerHTML = `
        <div class="hero">
          <div class="hero-icon icon-danger">⚠️</div>
          <div class="hero-badge badge-danger-soft">Connection Failed</div>
          <h1 class="hero-title">Couldn't connect <span class="text-danger">${meta.label}</span></h1>
          <p class="hero-sub">Something went wrong during the connection. This is usually a temporary issue — try again and it should work.</p>
        </div>
        <div class="error-card">
          <div class="error-title">What might have happened</div>
          <div class="error-desc">
            ${errorPlatform === 'facebook'
              ? 'The most common reason is cancelling the Facebook permission screen, or not selecting a Business Page during the sign-in. Make sure you select the right Page when Facebook asks.'
              : 'The most common reason is cancelling the Google permission screen. Make sure to click "Allow" when Google asks for permission to manage your Business Profile.'}
          </div>
          <a href="BlastyBiz-Connect.html" class="btn-retry">← Try Again</a>
        </div>
        <a href="BlastyBiz-Dashboard.html" class="btn-secondary">Go to Dashboard</a>
      `;
      return}

    if (!platform || !Object.hasOwn(PLATFORM_META, platform)) {
      window.location.href = 'BlastyBiz-Connect.html';
      return}

    const meta = PLATFORM_META[platform];

    const bizId = params.get('bizId');
    const ownerUid = params.get('ownerUid');
    const fail = message => {
      content.replaceChildren();
      const heading=document.createElement('h1'); heading.textContent='Connection not confirmed';
      const text=document.createElement('p'); text.textContent=message;
      const retry=document.createElement('a'); retry.className='btn-primary'; retry.textContent='Return to connections';
      retry.href='BlastyBiz-Connect.html'+(bizId&&/^[A-Za-z0-9_-]{1,128}$/.test(bizId)?'?bizId='+encodeURIComponent(bizId):'');
      content.append(heading,text,retry);
    };
    if (!bizId || !/^[A-Za-z0-9_-]{1,128}$/.test(bizId) || (ownerUid && ownerUid!==user.uid)) {
      fail('Open this connection with the account and business that started it.'); return;
    }
    const selectionId=params.get('selection');
    if(selectionId) {
      try {
        const token=await user.getIdToken();
        const endpoint='https://us-central1-blastybiz-9523e.cloudfunctions.net/oauthDestination';
        const response=await fetch(endpoint+'?selection='+encodeURIComponent(selectionId),{headers:{Authorization:'Bearer '+token}});
        const data=await response.json(); if(!response.ok)throw Error(data.error||'Could not load your destinations.');
        if(data.businessId!==bizId || data.platform!==platform)throw Error('This connection belongs to a different business.');
        content.replaceChildren();
        const h=document.createElement('h1');h.textContent='Choose where BlastyBiz will post';
        const label=document.createElement('label');label.htmlFor='destination-choice';label.textContent=platform==='google'?'Google Business Profile':'Facebook Page';
        const select=document.createElement('select');select.id='destination-choice';select.style.cssText='display:block;width:100%;padding:12px;margin:16px 0';
        const placeholder=document.createElement('option');placeholder.value='';placeholder.textContent='Choose a destination';select.append(placeholder);
        for(const choice of data.choices){const option=document.createElement('option');option.value=choice.id;option.textContent=choice.label;select.append(option);}
        const button=document.createElement('button');button.type='button';button.className='btn-primary';button.textContent='Connect this destination';button.disabled=true;
        const feedback=document.createElement('p');feedback.setAttribute('role','status');
        select.addEventListener('change',()=>{button.disabled=!select.value;});
        button.addEventListener('click',async()=>{
          button.disabled=true;select.disabled=true;feedback.textContent='Saving your choice…';
          try {
            const r=await fetch(endpoint,{method:'POST',headers:{Authorization:'Bearer '+await user.getIdToken(),'Content-Type':'application/json'},body:JSON.stringify({selection:selectionId,choiceId:select.value})});
            const result=await r.json();if(!r.ok)throw Error(result.error||'Your choice was not saved.');
            const next=new URLSearchParams({connected:result.platform,bizId:result.businessId,ownerUid:user.uid});
            if(result.returnTo==='onboarding')next.set('returnTo','onboarding');
            window.location.replace('BlastyBiz-Connected.html?'+next);
          }catch(e){feedback.textContent=e.message;button.disabled=false;select.disabled=false;}
        });
        const cancel=document.createElement('a');cancel.href='BlastyBiz-Connect.html?bizId='+encodeURIComponent(bizId);cancel.className='btn-secondary';cancel.textContent='Cancel';
        content.append(h,label,select,button,feedback,cancel);
      }catch(e){fail(e.message);}
      return;
    }
    let connData = null;
    let igData = null;
    try {
      const bizSnap=await getDoc(doc(db,'users',user.uid,'businesses',bizId));
      if(!bizSnap.exists())throw Error('This business is no longer available.');
      const connSnap = await getDoc(doc(db, 'users', user.uid, 'businesses', bizId, 'platformConnections', platform));
      if (connSnap.exists()) connData = connSnap.data();
      const expires=connData?.expiresAt?.toMillis?.() || Date.parse(connData?.expiresAt);
      if (!connData || connData.status!=='connected' || !Number.isFinite(expires) || expires<=Date.now() ||
          (platform==='google' ? !(connData.accountId && connData.locationId) : !connData.pageId)) {
        throw Error('No usable destination was saved. Check your provider permissions, then reconnect and choose your business.');
      }
      if (platform === 'facebook') {
        const igSnap = await getDoc(doc(db, 'users', user.uid, 'businesses', bizId, 'platformConnections', 'instagram'));
        if (igSnap.exists() && igSnap.data().status === 'connected' && igSnap.data().pageId===connData.pageId && igSnap.data().igUserId) igData = igSnap.data();
      }
    } catch(e) { fail(e.message || 'Could not verify your saved connection. Please try again.'); return; }
    BBBlasty.fire('platform.connection_success');

    const accountName = connData?.[meta.nameField] || connData?.pageName || connData?.accountId || 'Your account';

    // ── SUCCESS STATE ──
    const stepsHTML = meta.steps.map((s,i) => `
      <div class="step-row">
        <div class="step-num">${i+1}</div>
        <div class="step-body">
          <div class="step-title">${s.title}</div>
          <div class="step-desc">${s.desc}</div>
        </div>
      </div>
    `).join('');

    const igPillHTML = (platform === 'facebook' && igData) ? `
      <div class="ig-pill">
        <div class="ig-pill-icon">📸</div>
        <div class="ig-pill-text"><strong>Instagram</strong> was automatically linked through your Facebook Page.</div>
        <div class="ig-pill-badge">Also connected</div>
      </div>
    ` : (platform === 'facebook' && !igData) ? `
      <div class="ig-pill ig-pill-warn">
        <div class="ig-pill-icon">📸</div>
        <div class="ig-pill-text">No Instagram Business account was found linked to this Page. To connect Instagram, link it to your Facebook Page in Meta Business Suite first.</div>
        <div class="ig-pill-badge ig-badge-warn">Not linked</div>
      </div>
    ` : '';

    content.innerHTML = `
      <div class="hero mb-28">
        <div class="hero-icon" style="background:${meta.iconBg}">${meta.icon}</div>
        <div class="hero-badge">Successfully connected</div>
        <h1 class="hero-title">${meta.label} <span>is live.</span></h1>
        <p class="hero-sub">BlastyBiz can now post directly to your ${platform === 'google' ? 'Google Business Profile' : 'Facebook Page'} whenever you approve a listing.</p>
      </div>

      <div class="account-card">
        <div class="account-icon" style="background:${meta.iconBg};color:${meta.iconColor}">${meta.icon}</div>
        <div class="account-info">
          <div class="account-platform">${meta.label}</div>
          <div class="account-name">${window.escHtml(accountName)}</div>
          <div class="account-detail">Connected · Posts will go here when you approve</div>
        </div>
        <div class="account-check">✓</div>
      </div>

      ${igPillHTML}

      <div class="next-section">
        <div class="section-label">What happens when you post</div>
        <div class="step-list">${stepsHTML}</div>
      </div>

      <div class="cta-group">
        ${returnTo === 'onboarding'
          ? `<a href="BlastyBiz-Onboard2.html" class="btn-primary">← Back to Setup</a>
             <a href="BlastyBiz-Connect.html" class="btn-secondary">Connect another platform</a>`
          : `<a href="BlastyBiz.html" class="btn-primary">⚡ Create Your First Listing</a>
             <a href="BlastyBiz-Connect.html" class="btn-secondary">Connect another platform</a>
             <a href="BlastyBiz-Dashboard.html" class="btn-secondary">Go to Dashboard</a>`
        }
      </div>
    `;
    for(const link of content.querySelectorAll('a[href]')) {
      const url=new URL(link.href,window.location.href);url.searchParams.set('bizId',bizId);link.href=url.href;
    }
  });
});
</script>
<div id="site-footer-inject"></div>
<script>fetch('blastybiz-footer.html').then(r=>r.text()).then(function(html){document.getElementById('site-footer-inject').innerHTML=html});</script>
</body>
</html>
