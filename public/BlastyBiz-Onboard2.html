<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex"/>
  <title>BlastyBiz — Setting things up…</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    html,body{margin:0;height:100%;background:#0d1a0d;color:#7aab82;
      font-family:'DM Sans',system-ui,sans-serif;display:flex;align-items:center;
      justify-content:center;text-align:center;font-size:14px;padding:20px;}
    a{color:#00C853}
  </style>
  <script type="importmap">
{
  "integrity": {
    "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js":       "sha384-wY0ZJNz4V101UNldqXjHz0zuQq2LFWQg9C6MejyUaw58KxejR+Fq3MinHCx/5y77",
    "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js":      "sha384-zgcbfcVBtrcOc7CwpMfyGnYBfuol1tUBzdw+qfnzk43mD50+D2shQKuddFaWQfsc",
    "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js": "sha384-wrbWJmwwo/g58yNujR9u0v2HlcTvuGH1Pb8q0J3RR0EyaqypirmzeoG8+qkopilb"
  }
}
</script>
</head>
<body>
  <p id="msg">Taking you to setup… <a href="BlastyBiz-CreateBiz.html?guide=1">continue</a></p>

<script type="module">
/* Setup now lives on ONE page: the real form, with Blasty layered over it as a
   guide. This file kept its filename because trial magic-link emails, saved
   bookmarks and several in-app links still point at it.

   It is not just a redirect: sign-in links from BlastyBiz-Trial.html are
   delivered to this URL, so the email-link sign-in must be COMPLETED here.
   CreateBiz sits behind auth-guard.js and would bounce an as-yet-unsigned-in
   visitor to the login page, losing the link. */
import { auth } from './firebase-init-v2.js';
import { getApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { isSignInWithEmailLink, signInWithEmailLink }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, doc, setDoc, serverTimestamp }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

function go() {
  const p = new URLSearchParams(window.location.search);
  ['oobCode', 'apiKey', 'mode', 'lang', 'continueUrl'].forEach(k => p.delete(k));
  p.set('guide', '1');
  window.location.replace('BlastyBiz-CreateBiz.html?' + p.toString());
}

if (isSignInWithEmailLink(auth, window.location.href)) {
  document.getElementById('msg').textContent = 'Signing you in…';
  const email = localStorage.getItem('bb_trial_email') ||
                prompt('Please confirm your email address:') || '';
  const name  = localStorage.getItem('bb_trial_name') || '';
  localStorage.removeItem('bb_trial_email');
  localStorage.removeItem('bb_trial_name');
  if (!email) {
    window.location.replace('BlastyBiz-Trial.html');
  } else {
    signInWithEmailLink(auth, email, window.location.href)
      .then(async result => {
        const db = getFirestore(getApp());
        await setDoc(doc(db, 'users', result.user.uid), {
          plan: 'trial', displayName: name, email, createdAt: serverTimestamp()
        }, { merge: true });
      })
      .then(go)
      .catch(err => {
        console.error('[onboard2 magic link]', err);
        window.location.replace('BlastyBiz-Trial.html');
      });
  }
} else {
  go();
}
</script>
</body>
</html>
