<!-- ── Conversation engine ────────────────────────────────────────── -->
<script>
(function() {
  // ── Use the existing Blasty column as the fixed float ──────────────────────
  // (mascot.js already bound to the SVG inside it — don't inject a duplicate)
  var floatEl = document.getElementById('pb-mascot-zone');

  function positionBlasty(anchorEl) {
    if (!anchorEl) return;
    var rect = anchorEl.getBoundingClientRect();
    if (window.innerWidth < 700) {
      var top  = Math.max(60, Math.min(rect.top + Math.min(rect.height / 2, 50) - 20, window.innerHeight - 160));
      var left = window.innerWidth - 118;
      floatEl.style.top  = top  + 'px';
      floatEl.style.left = left + 'px';
      floatEl.classList.add('visible');
      return;
    }
    var gap     = 12;
    var fW      = 80;
    var elemMid = rect.top + rect.height / 2;
    var top     = Math.max(60, Math.min(elemMid - 35, window.innerHeight - 220));
    var left    = Math.min(rect.right + gap, window.innerWidth - fW - 210);
    floatEl.style.top  = top  + 'px';
    floatEl.style.left = left + 'px';
    floatEl.classList.add('visible');
  }

  const answers = {};
  const toggles = { ynMentionName: false, ynMentionRole: false, ynMentionAddress: true, ynMentionPhone: true };
  let step = 0;
  let currentBubble = null;
  let currentInput  = null;
  let currentStepKey = null;
  let _resumeStep = null; // set when user taps a past answer to edit it

  const STEPS = [
    {
      mood: 's-wave',   pos: 'right',
      anim: { mood: 's-wave', flame: 's-flame-green', lights: 's-lights-sequence' },
      blastyMsg: "Hi there! 👋 I'm Blasty — your AI marketing co-pilot. I'll help you blast your business across every platform in minutes. First though... what's your name?",
      inputType: 'text',
      key: 'ownerName',
      placeholder: 'e.g. Dave',
      hint: 'Your first name, or full name — your call',
      validate: v => v.trim().length >= 1 ? null : 'Please enter your name.',
      toggle: { stateKey: 'ynMentionName', label: 'Include my name in marketing copy' }
    },
    {
      mood: 's-happy',  pos: 'left',
      blastyMsgFn: a => 'Nice to meet you, ' + _ob2Esc(a.ownerName || 'you') + '! What\'s the name of your business?',
      inputType: 'text',
      key: 'bizName',
      placeholder: "e.g. Mike's Auto Repair",
      hint: 'This is how customers will find you everywhere',
      validate: v => v.trim().length >= 1 ? null : 'Please enter your business name.'
    },
    {
      mood: 's-ask',    pos: 'right',
      blastyMsgFn: a => 'Great, ' + _ob2Esc(a.ownerName || 'you') + '! What\'s your title at ' + _ob2Esc(a.bizName) + '?',
      inputType: 'text',
      key: 'role',
      placeholder: 'e.g. Owner, Marketing Director, GM',
      hint: 'How you\'d introduce yourself to a customer',
      validate: v => v.trim().length >= 1 ? null : 'Please enter your title.',
      toggle: { stateKey: 'ynMentionRole', label: 'Include my title in marketing copy' }
    },
    {
      mood: 's-ask',    pos: 'right',
      blastyMsgFn: a => 'Great! What\'s the best email address for ' + _ob2Esc(a.bizName) + '?',
      inputType: 'email',
      key: 'email',
      placeholder: 'you@yourbusiness.com',
      hint: 'Used for customer inquiries and marketing',
      skipIf: a => !!a.email,
      validate: v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim()) ? null : 'Please enter a valid email address.',
      toggle: { stateKey: 'ynMentionEmail', label: 'Include email in marketing copy' }
    },
    {
      mood: 's-happy',  pos: 'left',
      blastyMsgFn: a => 'Perfect. What\'s the best phone number for ' + _ob2Esc(a.bizName) + '?',
      inputType: 'tel',
      key: 'phone',
      placeholder: '555-867-5309',
      hint: 'Customers can call or text this number',
      validate: v => v.replace(/\D/g,'').length >= 7 ? null : 'Please enter a phone number.',
      toggle: { stateKey: 'ynMentionPhone', label: 'Include phone number in marketing copy' }
    },
    {
      mood: 's-ask',    pos: 'right',
      blastyMsgFn: a => 'Got it! Is ' + _ob2Esc(a.bizName) + ' a physical location, online only, or both?',
      inputType: 'choice',
      key: 'locationType',
      choices: [
        { value: 'brick',  label: '🏪  Physical Location' },
        { value: 'online', label: '🌐  Online Only' },
        { value: 'both',   label: '🏪🌐  Both' }
      ],
      validate: v => v ? null : 'Please choose one.'
    },
    {
      mood: 's-ask',    pos: 'left',
      blastyMsgFn: () => 'What\'s the street address?',
      inputType: 'text',
      key: 'street',
      placeholder: 'e.g. 123 Main St',
      hint: 'Street number and street name',
      skipIf: a => a.locationType === 'online',
      validate: v => v.trim().length >= 2 ? null : 'Please enter a street address.',
      toggle: { stateKey: 'ynMentionAddress', label: 'Mention address in marketing copy' }
    },
    {
      mood: 's-happy',  pos: 'right',
      blastyMsgFn: () => 'City?',
      inputType: 'text',
      key: 'city',
      placeholder: 'e.g. Springfield',
      hint: '',
      skipIf: a => a.locationType === 'online',
      validate: v => v.trim().length >= 2 ? null : 'Please enter a city.'
    },
    {
      mood: 's-ask',    pos: 'left',
      blastyMsgFn: () => 'State?',
      inputType: 'text',
      key: 'state',
      placeholder: 'e.g. IL',
      hint: 'Two-letter abbreviation or full name',
      skipIf: a => a.locationType === 'online',
      validate: v => v.trim().length >= 2 ? null : 'Please enter a state.'
    },
    {
      mood: 's-happy',  pos: 'right',
      blastyMsgFn: () => 'ZIP code?',
      inputType: 'text',
      key: 'zip',
      placeholder: 'e.g. 62701',
      hint: '',
      skipIf: a => a.locationType === 'online',
      validate: v => /^\d{5}(-\d{4})?$/.test(v.trim()) ? null : 'Please enter a valid ZIP code.'
    },
    {
      mood: 's-working', pos: 'left',
      blastyMsgFn: a => 'Almost there! What\'s the website for ' + _ob2Esc(a.bizName) + '?',
      inputType: 'text',
      key: 'website',
      placeholder: 'e.g. yourbusiness.com',
      hint: 'Leave blank if you don\'t have one yet — no worries!',
      skipIf: a => a.locationType === 'brick',
      validate: v => {
        if (!v.trim()) return null;
        return /\.\S{2,}/.test(v.trim())
          ? null
          : 'Please include the full address — e.g. yourbusiness.com.';
      }
    },

    /* ══════════════════════════════════════════════════════════
       PHASE 2 — Story questions (always run)
    ══════════════════════════════════════════════════════════ */
    {
      mood: 's-celebrate', pos: 'right',
      anim: { mood: 's-celebrate', flame: 's-flame-green', lights: 's-lights-flash', smoke: true },
      blastyMsgFn: a => 'You\'re set up! Now I need to get to know ' + _ob2Esc(a.bizName) + '. The more I know about you, the better every blast gets — sharper copy, better targeting, more you. Let\'s start with the origin story: how did ' + _ob2Esc(a.bizName) + ' get started?',
      inputType: 'textarea',
      key: 'story',
      placeholder: 'e.g. We opened in 1987 after my father emigrated from Mexico with nothing but a family recipe and a dream…',
      hint: 'As much or as little as you like',
      validate: () => null
    },
    {
      mood: 's-happy', pos: 'right',
      blastyMsgFn: a => 'Good stuff! What makes ' + _ob2Esc(a.bizName) + ' different from the competition?',
      inputType: 'textarea',
      key: 'different',
      placeholder: 'e.g. Everything is made from scratch daily. Our head chef trained in Lyon for 3 years…',
      hint: 'Why should someone choose you?',
      validate: () => null
    },
    {
      mood: 's-ask', pos: 'left',
      blastyMsg: 'Any awards, press coverage, or milestones worth mentioning?',
      inputType: 'textarea',
      key: 'awards',
      placeholder: 'e.g. Best Pizza 3 years running. Featured in the Tribune. 4.9 stars across 600+ reviews…',
      hint: 'Leave blank if none — totally fine!',
      validate: () => null
    },
    {
      mood: 's-happy', pos: 'right',
      blastyMsgFn: a => 'Who\'s your ideal customer for ' + _ob2Esc(a.bizName) + '?',
      inputType: 'textarea',
      key: 'customer',
      placeholder: 'e.g. Homeowners aged 35–60 who value quality over price and have been burned by cheap contractors before…',
      hint: 'Who gets the most value from what you do?',
      validate: () => null
    },
    {
      mood: 's-ask', pos: 'left',
      blastyMsg: 'Anything else I should always know about your business?',
      inputType: 'textarea',
      key: 'other',
      placeholder: 'e.g. Free estimates. Loyalty program. Family-owned since 1995. We sponsor the local little league…',
      hint: 'Special services, team, community involvement — anything',
      validate: () => null
    },

    /* ══════════════════════════════════════════════════════════
       PHASE 3 — Campaign questions (always run)
    ══════════════════════════════════════════════════════════ */
    {
      mood: 's-working', pos: 'right',
      blastyMsgFn: a => 'Perfect — I know you so much better now! Let\'s build your first campaign. What do you want to call it?',
      inputType: 'text',
      key: 'campaignName',
      placeholder: 'e.g. Summer Sale, Grand Opening, New Menu Drop',

        // Best-effort only: suggestCategory runs before the magic-link sign-in,

        // failure UI can tell the owner what actually went wrong instead of
        // collapsing every cause into the same blank text box.
        let res;
        try {
          res = await fetch('https://us-central1-blastybiz-9523e.cloudfunctions.net/suggestCategory', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              ...(token ? { 'Authorization': 'Bearer ' + token } : {})
            },
            body: JSON.stringify({
              bizName:         a.bizName          || '',

              role:            a.role             || '',

          e.kind = 'network';

  function lockField(key, text) {
    const row = document.getElementById('obfr-'+key);
    if (!row) return;
    row.classList.remove('active','future','bb-field-blur');
    row.classList.add('answered','bb-field-done');
    // Attach on the next tick. The click that locked this field originated on a
    // button INSIDE this row and is still bubbling upward. Assigning the handler
    // synchronously means that same tap immediately fires _ob2JumpToKey and
    // bounces the user back into the step they just answered — on the AI category
    // step that re-runs the entire lookup the moment you accept the suggestion.
    setTimeout(() => { row.onclick = () => window._ob2JumpToKey(key); }, 0);
    const slot = document.getElementById('obfs-'+key);

  function showStep() {

        const display = Array.isArray(answers[s.key]) ? answers[s.key].join(', ') : String(answers[s.key]);
        lockField(s.key, display);

      step++; showStep(); return;

    currentStepKey = s.key;

    // is not immediately squashed by a subsequent setMood() call.
    setMood(s.anim || s.mood);

    if (window._ob2Guide) {

      if (activeRow) {

// ── Platform list: load from Firestore config/platforms ─────────────────────
// Runs immediately (config/platforms is public-read — no auth required).
// By the time the user reaches the platform step, this will have resolved.
(async () => {
  try {
    const platforms = await loadPlatforms(db, getDoc, doc);
    // Store raw proOnly — renderInput evaluates isPro at render time to avoid
    // a race condition where auth hasn't resolved yet at this point.
    window._bbPlatformChoices = platforms.map(p => ({
      value:   p.slug,
      label:   p.icon + ' ' + p.name,
      proOnly: p.proOnly,
    }));
  } catch(e) {
    console.warn('[ob2] platform list load failed, using fallback:', e.message);
  }
})();

// ── Onboarding progress persistence ────────────────────────────────────────
// Saves current answers/toggles/step to users/{uid}.onboardingProgress so
// the user can resume after email verification on a different tab or device.
window._ob2SaveProgress = async function(answersSnap, togglesSnap, stepIndex) {
  if (!window._ob2Uid) return;
  try {
    // Deep-copy arrays/objects so Firestore doesn't get live references
    const safeAnswers = JSON.parse(JSON.stringify(answersSnap));
    await setDoc(doc(db, 'users', window._ob2Uid), {
      onboardingProgress: { answers: safeAnswers, toggles: togglesSnap, stepIndex, savedAt: new Date().toISOString() }
    }, { merge: true });
  } catch(e) { console.warn('[ob2] save progress failed:', e.message); }
};

window._ob2ClearProgress = async function() {
  if (!window._ob2Uid) return;
  try {
    await updateDoc(doc(db, 'users', window._ob2Uid), { onboardingProgress: deleteField() });
  } catch(e) { console.warn('[ob2] clear progress failed:', e.message); }
};

window._ob2Save = async function(answers, toggles) {
  const isEdit = !!window._ob2EditBizId;
  const bizRef = isEdit
    ? doc(db, 'users', window._ob2Uid, 'businesses', window._ob2EditBizId)
    : doc(collection(db, 'users', window._ob2Uid, 'businesses'));
  const bizId  = bizRef.id;
  const campId = 'c_' + Date.now();

  const campaignStory = [
    answers.campaignAbout    ? 'About this campaign: ' + answers.campaignAbout    : '',
    answers.campaignAudience ? 'Target audience: '     + answers.campaignAudience : ''
  ].filter(Boolean).join('\n');

  const batch = writeBatch(db);

  /* ── Business document — canonical schema ─────────────────── */
  batch.set(bizRef, {
    name:               answers.bizName      || '',
    businessName:       answers.bizName      || '',
    category:           answers.category     || '',
    ownerName:          answers.ownerName    || '',
    ownerRole:          answers.role         || '',
    email:              answers.email        || '',
    phone:              answers.phone        || '',
    street:             answers.street       || '',
    city:               answers.city         || '',
    state:              answers.state        || '',
    zip:                answers.zip          || '',
    website:            answers.website      || '',
    locationType:       answers.locationType || '',
    ynMentionName:      toggles.ynMentionName    ? 'yes' : 'no',
    ynMentionRole:      toggles.ynMentionRole    ? 'yes' : 'no',
    ynMentionAddress:   toggles.ynMentionAddress ? 'yes' : 'no',
    ynMentionPhone:     toggles.ynMentionPhone   ? 'yes' : 'no',
    ynMentionWebsite:   'yes',
    ynMentionEmail:     'yes',
    aiContext: {
      story:     answers.story     || '',
      different: answers.different || '',
      awards:    answers.awards    || '',
      customer:  answers.customer  || '',
      other:     answers.other     || '',
    },
    globalMemory: window._ob2GlobalMemory || '',
    createdAt: serverTimestamp()
  }, isEdit ? { merge: true } : {});

  /* ── Mark user as onboarded — only for new businesses ─────── */
  if (!isEdit) {
    batch.set(doc(db, 'users', window._ob2Uid), {
      onboarded:           true,
      activeBusiness:      bizId,
      onboardingVersion:   1,
      onboardingCompleted: serverTimestamp()
    }, { merge: true });
  }

  /* ── First campaign document ──────────────────────────────── */
  batch.set(
    doc(db, 'users', window._ob2Uid, 'businesses', bizId, 'campaigns', campId),
    {
      id:                  campId,
      name:                answers.campaignName || 'My First Campaign',
      offer:               answers.campaignOffer || '',
      campaignStory,
      onboardingPlatforms: Array.isArray(answers.campaignPlatforms) ? answers.campaignPlatforms : [],
      createdAt:           serverTimestamp(),
      lastUsedAt:          '',
      photos:              [],
      adName:              '',
      price:               '',
      factoids:            [],
      platformHistory:     {}
    }
  );

  /* ── Atomic commit — all three or none ────────────────────── */
  await batch.commit();

  return { bizId, campId };
};

function _ready(uid, name, plan) {
  window._ob2Uid   = uid;
  window._ob2Name  = name || '';
  window._ob2Plan  = plan || 'trial';
  window._ob2Ready = true;
  if (window._ob2StartConvo) window._ob2StartConvo();
}

if (isSignInWithEmailLink(auth, window.location.href)) {
  const email = localStorage.getItem('bb_trial_email') || prompt('Please confirm your email address:') || '';
  const name  = localStorage.getItem('bb_trial_name')  || '';
  localStorage.removeItem('bb_trial_email');
  localStorage.removeItem('bb_trial_name');
  if (email) {
    signInWithEmailLink(auth, email, window.location.href)
      .then(async result => {
        await setDoc(doc(db, 'users', result.user.uid), {
          plan: 'trial', displayName: name, email, createdAt: serverTimestamp()
        }, { merge: true });
        const clean = new URL(window.location.href);
        ['oobCode','apiKey','mode','lang'].forEach(p => clean.searchParams.delete(p));
        history.replaceState(null, '', clean.toString());
        _ready(result.user.uid, name, 'trial');
      })
      .catch(() => { window.location.href = 'BlastyBiz-Trial.html'; });
  } else {
    window.location.href = 'BlastyBiz-Trial.html';
  }
} else {
  onAuthStateChanged(auth, async user => {
    if (!user) { window.location.href = 'BlastyBiz-Trial.html'; return; }
    const urlP      = new URLSearchParams(window.location.search);
    const editBizId = urlP.get('bizId') || null;
    const isNew     = urlP.has('new');
    const userSnap  = await getDoc(doc(db, 'users', user.uid));
    const ud        = userSnap.exists() ? userSnap.data() : {};
    // Redirect already-onboarded users back to the app UNLESS they explicitly
    // chose to add a new business (?new=1) or edit an existing one (?bizId=...)
    if (ud.onboarded && ud.onboardingVersion && ud.activeBusiness && !isNew && !editBizId) {
      window.location.href = 'BlastyBiz.html';
      return;
    }
    // Resume onboarding progress saved before email verification
    if (ud.onboardingProgress && ud.onboardingProgress.stepIndex > 0 && !editBizId) {
      window._ob2ResumeData = ud.onboardingProgress;
      window._ob2Prefill = ud.onboardingProgress.answers || {};
    } else if (ud.ownerName && !editBizId) {
      // Name was already collected at signup — skip the name step entirely
      window._ob2ResumeData = { stepIndex: 1, answers: { ownerName: ud.ownerName } };
      window._ob2Prefill    = { ownerName: ud.ownerName };
    }
    // Always prefill auth email so the email step is skipped for new signups
    if (!editBizId && user.email) {
      window._ob2Prefill = window._ob2Prefill || {};
      if (!window._ob2Prefill.email) window._ob2Prefill.email = user.email;
    }
    // Return-visit: load existing biz data for pre-population
    if (editBizId) {
      window._ob2EditBizId = editBizId;
      try {
        const bizSnap = await getDoc(doc(db, 'users', user.uid, 'businesses', editBizId));
        if (bizSnap.exists()) {
          const d = bizSnap.data();
          window._ob2Prefill = {
            bizName:      d.name || d.businessName || '',
            ownerName:    d.ownerName    || '',
            role:         d.ownerRole   || '',
            email:        d.email        || '',
            phone:        d.phone       || '',
            locationType: d.locationType|| '',
            street:       (d.address && d.address.street) || d.street || '',
            city:         (d.address && d.address.city)   || d.city   || '',
            state:        (d.address && d.address.state)  || d.state  || '',
            zip:          (d.address && d.address.zip)    || d.zip    || '',
            website:      d.website     || '',
            story:        (d.aiContext && d.aiContext.story)     || d.story     || '',
            different:    (d.aiContext && d.aiContext.different) || d.different || '',
            awards:       (d.aiContext && d.aiContext.awards)    || d.awards    || '',
            customer:     (d.aiContext && d.aiContext.customer)  || d.customer  || '',
            other:        (d.aiContext && d.aiContext.other)     || d.otherInfo || '',
          };
        }
      } catch(e) { console.warn('[ob2 prefill]', e); }
    }
    // Load step overrides from Firestore (non-fatal)
    try {
      const ovSnap = await getDoc(doc(db, 'config', 'ob1Steps'));
      if (ovSnap.exists() && window._ob2ApplyOverrides) {
        window._ob2ApplyOverrides(ovSnap.data());
      }
    } catch(e) { /* use defaults if unavailable */ }
    const plan = ud.plan || 'trial';
    _ready(user.uid, user.displayName || '', plan);
  });
}
</script>
