  </div>

<div class="toast" id="toast"></div>

<script>
const PLATFORM_META = {
  google:     { name: 'Google Business', icon: 'G', piClass: 'pi-google'  },
  facebook:   { name: 'Facebook Page',   icon: 'f', piClass: 'pi-fb'      },
  instagram:  { name: 'Instagram',       icon: '📸', piClass: 'pi-ig'     },
  bing:       { name: 'Bing Places',     icon: 'B', piClass: 'pi-bing'    },
  applemaps:  { name: 'Apple Maps',      icon: '🍎', piClass: 'pi-apple'  },
  yelp:       { name: 'Yelp',            icon: 'Y', piClass: 'pi-yelp'    },
  nextdoor:   { name: 'Nextdoor',        icon: 'N', piClass: 'pi-nd'      },
  craigslist: { name: 'Craigslist',      icon: 'C', piClass: 'pi-cl'      },
  fbmarket:   { name: 'FB Marketplace',  icon: 'M', piClass: 'pi-fbm'     },
};

const STATUS_CONFIG = {
  canceled:         { label: 'Canceled', cls: 'pill-pending', rowCls: '' },
  success:          { label: 'Live',        cls: 'pill-live',    rowCls: 'status-live' },
  manual_required:  { label: 'Action Needed', cls: 'pill-manual', rowCls: 'status-manual' },
  manual_posted: {label:'Posted by you',cls:'pill-live',rowCls:'status-live'},
  manual_skipped: {label:'Skipped',cls:'pill-pending',rowCls:''},
  manual_lapsed: {label:'Not posted',cls:'pill-pending',rowCls:''},
  skipped: {label:'Skipped',cls:'pill-pending',rowCls:''},
  manual_completed: { label: 'Posted',      cls: 'pill-live',    rowCls: 'status-live' },
  processing:       { label: 'Publishing', cls: 'pill-running', rowCls: 'status-running' },
  manual_followup:  { label: 'Action Needed', cls: 'pill-manual', rowCls: 'status-manual' },
  running:          { label: 'Publishing',  cls: 'pill-running', rowCls: 'status-running' },
  pending:          { label: 'Waiting',     cls: 'pill-pending', rowCls: '' },
  failed:           { label: 'Failed',      cls: 'pill-failed',  rowCls: 'status-failed' },
  needs_connection: { label: 'Not connected yet', cls: 'pill-manual', rowCls: 'status-manual' },
  retry_pending:    { label: 'Retrying',    cls: 'pill-running', rowCls: 'status-running' },
};

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500)}

let scheduleFocused = false;
function focusFutureSchedule() {
  const host = document.getElementById('future-blast-schedule');
  if (scheduleFocused || location.hash !== '#future-blast-schedule' || !host || host.hidden ||
      document.getElementById('content-state').classList.contains('hidden')) return;
  scheduleFocused = true;
  requestAnimationFrame(() => host.scrollIntoView?.({block:'start'}));
}

function renderJobs(jobs) {
  const total = jobs.length;
  const done  = jobs.filter(j => ['success','manual_completed'].includes(j.status)).length;
  const pct   = total ? Math.round((done / total) * 100) : 0;

  document.getElementById('progress-count').textContent = `${done} of ${total} Complete`;
  document.getElementById('progress-bar').style.width = pct + '%';

  const list = document.getElementById('platform-list');
  list.innerHTML = '';
  jobs.forEach(job => {
    const meta   = PLATFORM_META[job.platform] || { name: job.platform, icon: '●', bg: '#444' };
    const status = STATUS_CONFIG[job.status] || { label: job.status, cls: 'pill-pending', rowCls: '' };
    const row = document.createElement('div');
    row.className = 'platform-row ' + status.rowCls;
    row.innerHTML = `
      <div class="platform-icon ${meta.piClass || 'pi-default'}">${meta.icon}</div>
      <div class="platform-info">
        <div class="platform-name">${meta.name}</div>
        <div class="platform-msg">${window.escHtml(job.customerVisibleMessage || status.label)}</div>
      </div>
      <div class="status-pill ${status.cls}">${status.label}</div>
    `;
    if (job.status === 'needs_connection') {
      const btn = document.createElement('a');
      btn.href = 'BlastyBiz.html?'+new URLSearchParams({bizId:new URLSearchParams(location.search).get('bizId')||'',tab:'platforms'});
      btn.className = 'btn-copy';
      btn.style.cssText = 'text-decoration:none;white-space:nowrap;margin-left:8px;';
      btn.textContent = '🔗 Connect';
      row.appendChild(btn);
    }
    list.appendChild(row)});

  const manualJobs = jobs.filter(j => ['manual_required', 'manual_followup'].includes(j.status));
  const actionCard = document.getElementById('action-card');
  const actionItems = document.getElementById('action-items');
  if (manualJobs.length) {
    actionCard.classList.remove('hidden');
    const _listingStore = {};
    actionItems.innerHTML = manualJobs.map(job => {
      _listingStore[job.jobId] = typeof job.payload === 'object' ? (job.payload.adaptedContent || '') : '';
      return `<div class="action-item" data-jobid="${job.jobId}" data-platform="${job.platform}">
          <div class="action-platform"></div>
          <div class="action-desc"></div>
          <div class="action-btns">
            <button class="btn-copy">📋 Copy Listing</button>
            <button class="btn-instructions">View Instructions</button>
          </div>
        </div>`;
    }).join('');
    actionItems.querySelectorAll('.action-item').forEach(item => {
      const jobId    = item.dataset.jobid;
      const platform = item.dataset.platform;
      const job = manualJobs.find(j => j.jobId === jobId);
      const meta = PLATFORM_META[platform] || { name: platform };
      item.querySelector('.action-platform').textContent = meta.name;
      item.querySelector('.action-desc').textContent = (job && job.customerVisibleMessage) || 'Your listing is ready — post it manually.';
      item.querySelector('.btn-copy').addEventListener('click', () => copyListing(jobId, _listingStore[jobId] || ''));
      item.querySelector('.btn-instructions').addEventListener('click', () => showInstructions(platform));
    });
  } else {
    actionCard.classList.add('hidden');
  }

  const hoursSaved = (done * 0.8).toFixed(1);
  document.getElementById('hours-saved').textContent = hoursSaved;

  document.getElementById('loading-state').classList.add('hidden');
  document.getElementById('content-state').classList.remove('hidden');
  focusFutureSchedule();}

function copyListing(jobId, text) {
  navigator.clipboard.writeText(text).then(() => showToast('📋 Listing copied!'))}

function showInstructions(platform) {
  const instructions = {
    nextdoor:   'Go to nextdoor.com → Post → For Sale & Free → paste your listing text.',
    craigslist: 'Go to craigslist.org → your city → Services → paste your listing.',
    fbmarket:   'Go to facebook.com/marketplace → Create listing → paste your text.',
  };
  showToast(instructions[platform] || 'Open the platform website and paste your listing.')}

function showEmptyState(msg) {
  document.getElementById('loading-state').style.display = 'none';
  document.getElementById('content-state').classList.remove('hidden');
  focusFutureSchedule();
  document.getElementById('progress-count').textContent = '0 of 0 Complete';
  document.getElementById('progress-bar').style.width = '0%';
  document.getElementById('platform-list').innerHTML =
    `<div class="empty-state-msg">${msg}</div>`;
  const actionCard = document.getElementById('action-card');
  if (actionCard) actionCard.classList.add('hidden');
  const hoursSaved = document.getElementById('hours-saved');
  if (hoursSaved) hoursSaved.textContent = '0'}
</script>

<script src="schedule-utils.js"></script>
<script src="lifecycle-ui.js?v=20261002-simple-scheduler"></script>
<script src="lifecycle-status.js?v=20261002-simple-scheduler"></script>
<script type="module">
import { auth, db } from './firebase-init-v2.js';
import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { collection, query, where, orderBy, limit, onSnapshot, getDoc, doc } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

auth.authStateReady().then(() => {
onAuthStateChanged(auth, async (user) => {
  if (!user) return; // auth-guard.js handles redirect
  const ownerUid=new URLSearchParams(window.location.search).get('ownerUid');
  if(ownerUid && ownerUid!==user.uid){document.getElementById('loading-state').textContent='This Blast belongs to another account. Sign out and use the account that received the link.';return;}

  try {
    const userSnap = await getDoc(doc(db, 'users', user.uid));
    const userData = userSnap.exists() ? userSnap.data() : {};
    const bizId    = new URLSearchParams(location.search).get('bizId') || userData.activeBusiness || user.uid;

    const params  = new URLSearchParams(window.location.search);
    const draftId = params.get('draftId');
    BBLifecycleStatus.initialize({businessId:bizId,blastId:draftId,token:()=>user.getIdToken()},userData);

    // Offer future scheduling only after this Blast has been submitted.
    if (draftId) {
      getDoc(doc(db, 'users', user.uid, 'businesses', bizId, 'listingDrafts', draftId))
        .then(snap => { if (snap.exists()) { BBLifecycle.futureSchedule(document.getElementById('future-blast-schedule'), snap.data()); focusFutureSchedule(); } })
        .catch(error => console.warn('Future scheduling could not load:', error.message));
    }

    let q;
    if (draftId) {
      q = query(
        collection(db, 'users', user.uid, 'businesses', bizId, 'publishJobs'),
        where('draftId', '==', draftId)
      )} else {
      q = query(
        collection(db, 'users', user.uid, 'businesses', bizId, 'publishJobs'),
        orderBy('createdAt', 'desc'),
        limit(20)
      )}

    // Live listener — updates status cards in real-time as jobs complete
    onSnapshot(q, (snap) => {
      if (snap.empty) {
        window.showEmptyState('No publishing jobs yet. Approve a listing to start blasting.')} else {
        const jobs = snap.docs.map(d => ({ jobId: d.id, ...d.data() }));
        window.renderJobs(jobs)}
    }, (e) => {
      console.error('Failed to load jobs:', e);
      window.showEmptyState('Could not load jobs. Refresh to try again.')})} catch (e) {
    console.error('Failed to init:', e);
    window.showEmptyState('Could not load jobs. Refresh to try again.')}
})});
</script>
