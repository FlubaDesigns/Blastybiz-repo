<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <meta charset="UTF-8"/>
  <meta name="theme-color" content="#000000"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BlastyBiz — Mood Presets</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>

  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="global-style.css?v=1786138690073">
  <style>
    body { visibility:hidden }
    .mp-grid { display:grid; grid-template-columns:1fr 220px; gap:24px; align-items:start; }
    @media (max-width:800px) { .mp-grid { grid-template-columns:1fr; } .mp-preview { display:none; } }
    .sec-hd { display:flex; align-items:center; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
    .sec-hd h2 { font:700 18px 'DM Sans',sans-serif; color:#0f172a; margin:0; flex:1; }
    /* preset cards */
    .preset-card { background:#fff; border:1.5px solid #e4e9f0; border-radius:12px; margin-bottom:10px; }
    .preset-head { display:flex; align-items:center; gap:10px; padding:10px 14px; flex-wrap:wrap; }
    .preset-name { font:700 14px 'DM Sans',sans-serif; color:#0f172a; flex:1; min-width:80px; }
    .preset-tags { display:flex; gap:5px; flex-wrap:wrap; flex:2; }
    .ptag { font-size:10px; background:#f1f5f9; color:#475569; border-radius:10px; padding:2px 7px; font-weight:600; white-space:nowrap; }
    .btn-del { background:none; border:1.5px solid #e2e8f0; border-radius:7px; padding:4px 10px; font:12px 'DM Sans',sans-serif; cursor:pointer; color:#94a3b8; white-space:nowrap; }
    .btn-del:hover { border-color:#ef4444; color:#ef4444; }
    .btn-prv2 { background:none; border:1.5px solid #e2e8f0; border-radius:7px; padding:4px 10px; font:12px 'DM Sans',sans-serif; cursor:pointer; color:#64748b; white-space:nowrap; }
    .btn-prv2:hover { border-color:#7c3aed; color:#7c3aed; }
    /* add form */
    .add-form { background:#f8fafc; border:1.5px solid #e4e9f0; border-radius:12px; padding:16px; margin-bottom:18px; display:none; }
    .add-form.open { display:block; }
    .form-row { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:12px; }
    .form-fld { display:flex; flex-direction:column; gap:3px; flex:1 1 130px; min-width:0; }
    .form-fld label { font:700 10px 'DM Sans',sans-serif; color:#94a3b8; text-transform:uppercase; letter-spacing:.05em; }
    .form-fld input, .form-fld select { width:100%; box-sizing:border-box; border:1.5px solid #e2e8f0; border-radius:6px; padding:5px 8px; font:13px 'DM Sans',sans-serif; color:#0f172a; background:#fff; }
    .form-fld input:focus, .form-fld select:focus { border-color:#2563eb; outline:none; }
    .form-fld.name-fld { flex:2 1 180px; }
    .form-acts { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .btn-save { background:#2563eb; color:#fff; border:none; border-radius:7px; padding:7px 18px; font:600 13px 'DM Sans',sans-serif; cursor:pointer; }
    .btn-save:hover { background:#1d4ed8; }
    .btn-cancel { background:none; border:1.5px solid #e2e8f0; border-radius:7px; padding:6px 14px; font:13px 'DM Sans',sans-serif; cursor:pointer; color:#64748b; }
    .add-btn { background:#0f172a; color:#fff; border:none; border-radius:8px; padding:8px 18px; font:600 13px 'DM Sans',sans-serif; cursor:pointer; }
    .add-btn:hover { background:#1e293b; }
    .gsts { font-size:12px; color:#22c55e; }
    .fsts { font-size:12px; }
    /* preview */
    .mp-preview { position:sticky; top:80px; }
    .prev-panel { background:#0d1f3c; border-radius:14px; padding:18px; text-align:center; }
    .prev-lbl { font-size:10px; color:#64748b; text-transform:uppercase; letter-spacing:.1em; margin-bottom:12px; }
    #pb-mascot { display:inline-block; position:relative; }
    #pb-mascot svg { width:160px; height:auto; overflow:visible; }
    .prev-cap { font-size:12px; color:#9ca3af; margin-top:8px; min-height:16px; }
    .empty-state { text-align:center; padding:40px 20px; color:#94a3b8; font-size:14px; }
    .drag-hint { font-size:11px; color:#cbd5e1; margin-bottom:4px; text-align:right; }
  </style>
  <script type="importmap">
{
  "integrity": {
    "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js":       "sha384-wY0ZJNz4V101UNldqXjHz0zuQq2LFWQg9C6MejyUaw58KxejR+Fq3MinHCx/5y77",
    "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js":      "sha384-zgcbfcVBtrcOc7CwpMfyGnYBfuol1tUBzdw+qfnzk43mD50+D2shQKuddFaWQfsc",
    "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js": "sha384-wrbWJmwwo/g58yNujR9u0v2HlcTvuGH1Pb8q0J3RR0EyaqypirmzeoG8+qkopilb",
    "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js":   "sha384-MiuhCiy/+BHXhKiAgD/lPmYfVJHJMXdXL6BVfwPkfeg7UCfcjV6EMGCWk+LqguU1"
  }
}
</script>
  <script type="module" src="./admin-guard.js"></script>
  <script src="blastybiz-menu.js?v=6"></script>
  <script src="/mascot.js"></script>
</head>
<body class="admin-page">

<header>
  <a class="logo" href="BlastyBiz-Home.html">BlastyBiz<span>Mood Presets</span></a>
  <div class="top-actions">
    <a class="icon-btn hide-mobile" href="BlastyBiz-Admin.html">Dashboard</a>
    <a class="icon-btn hide-mobile" href="BlastyBiz-Admin-OnboardSteps.html">Step Editor</a>
    <a class="icon-btn active" href="#">Moods</a>
  </div>
  <div class="hamburger" onclick="toggleMenu()">☰</div>
</header>

<main><div class="main-inner">
<div class="mp-grid">

  <!-- left: list + form -->
  <div>
    <div class="sec-hd">
      <h2>Mood Presets</h2>
      <button class="add-btn" onclick="window._toggleForm()">+ New Mood</button>
      <span class="gsts" id="gstatus"></span>
    </div>

    <div class="add-form" id="add-form">
      <div class="form-row">
        <div class="form-fld name-fld">
          <label>Name</label>
          <input id="mf-label" placeholder="e.g. Greeting" oninput="window._livePreview()">
        </div>
        <div class="form-fld">
          <label>Pose</label>
          <select id="mf-pose" onchange="window._livePreview()"></select>
        </div>
        <div class="form-fld">
          <label>Exhaust</label>
          <select id="mf-exhaust" onchange="window._livePreview()"></select>
        </div>
        <div class="form-fld">
          <label>Eyes</label>
          <select id="mf-eyes" onchange="window._livePreview()"></select>
        </div>
        <div class="form-fld">
          <label>Nose</label>
          <select id="mf-nose" onchange="window._livePreview()"></select>
        </div>
        <div class="form-fld">
          <label>Mouth</label>
          <select id="mf-mouth" onchange="window._livePreview()"></select>
        </div>
        <div class="form-fld">
          <label>Limbs</label>
          <select id="mf-limbs" onchange="window._livePreview()"></select>
        </div>
      </div>
      <div class="form-acts">
        <button class="btn-save" onclick="window._savePreset()">Save Preset</button>
        <button class="btn-cancel" onclick="window._toggleForm()">Cancel</button>
        <span class="fsts" id="fstatus"></span>
      </div>
    </div>

    <div id="preset-list"><div class="empty-state">Loading…</div></div>
  </div>

  <!-- right: preview -->
  <div class="mp-preview">
    <div class="prev-panel">
      <div class="prev-lbl">Preview</div>
      <div class="pb-mascot s-ask" id="pb-mascot"></div>
      <div class="prev-cap" id="prev-cap">Ask</div>
    </div>
  </div>

</div>
</div></main>

<script type="module">
import { auth } from './firebase-init-v2.js';
import { getApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, doc, getDoc, setDoc } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

const db = getFirestore(getApp());

const POSE_OPTS    = [{v:'s-ask',l:'Ask'},{v:'s-ask-2',l:'Ask 2 (lean right)'},{v:'s-ask-3',l:'Ask 3 (look up)'},{v:'s-wave',l:'Wave'},{v:'s-wave-2',l:'Wave 2 (big)'},{v:'s-happy',l:'Happy'},{v:'s-working',l:'Working'},{v:'s-celebrate',l:'Celebrate'},{v:'s-spin',l:'Spin'},{v:'s-tilt-left',l:'Tilt Left'},{v:'s-tilt-right',l:'Tilt Right'},{v:'s-arrive-land',l:'Arrive Land'}];
const EXHAUST_OPTS = [{v:'',l:'Normal flame'},{v:'s-flame-blue',l:'Blue flame'},{v:'s-flame-green',l:'Green flame'},{v:'s-flame-red',l:'Red flame'},{v:'s-flame-purple',l:'Purple flame'},{v:'s-flame-white',l:'White flame'},{v:'s-smoke-sm',l:'Smoke — small'},{v:'s-smoke-lg',l:'Smoke — large'},{v:'s-smoke-2',l:'Smoke — 2 puffs'},{v:'s-smoke-3',l:'Smoke — 3 puffs'}];
const EYES_OPTS    = [{v:'',l:'Default'},{v:'s-eyes-up',l:'Up'},{v:'s-eyes-down',l:'Down'},{v:'s-eyes-left',l:'Left'},{v:'s-eyes-right',l:'Right'},{v:'s-eyes-roll',l:'Roll'},{v:'s-eyes-surprise',l:'Surprise'}];
const NOSE_OPTS    = [{v:'',l:'Off'},{v:'s-nose-shake',l:'Shake'},{v:'s-nose-pop-slow',l:'Pop slow'},{v:'s-nose-pop-fast',l:'Pop fast'}];
const MOUTH_OPTS   = [{v:'',l:'Default (mood)'},{v:'s-mouth-happy',l:'Happy 😄'},{v:'s-mouth-working',l:'Working 😮'},{v:'s-mouth-celebrate',l:'Celebrate 😃'},{v:'s-mouth-ask',l:'Ask 😐'}];
const LIMBS_OPTS   = [{v:'',l:'Pose default'},{v:'s-limb-wave',l:'Arm wave 🫳'},{v:'s-limb-point',l:'Arm point 👉'},{v:'s-limb-both',l:'Arms up 🙌'},{v:'s-limb-none',l:'Arms hidden'},{v:'s-limb-fin-wave',l:'Fin wave (left) 🏳️'},{v:'s-limb-fin-point',l:'Fin point (right) 🏳️'},{v:'s-limb-fin-both',l:'Fins up (both) 🏳️'}];

const DEFAULT_PRESETS = [
  {id:'greeting',  label:'Greeting',    pose:'s-wave',        exhaust:'',             eyes:'',           nose:'',              mouth:'',                   limbs:'s-limb-wave'},
  {id:'asking',    label:'Asking',      pose:'s-ask',         exhaust:'',             eyes:'',           nose:'s-nose-shake', mouth:'',                   limbs:''},
  {id:'thinking',  label:'Thinking',    pose:'s-ask-3',       exhaust:'',             eyes:'s-eyes-up',  nose:'',              mouth:'',                   limbs:''},
  {id:'working',   label:'Working',     pose:'s-working',     exhaust:'',             eyes:'',           nose:'',              mouth:'s-mouth-working',     limbs:'s-limb-point'},
  {id:'happy',     label:'Happy',       pose:'s-happy',       exhaust:'s-flame-blue', eyes:'',           nose:'',              mouth:'s-mouth-happy',       limbs:''},
  {id:'celebrate', label:'Celebrating', pose:'s-celebrate',   exhaust:'s-smoke-3',    eyes:'',           nose:'',              mouth:'s-mouth-celebrate',   limbs:'s-limb-both'},
  {id:'arrive',    label:'Arriving',    pose:'s-arrive-land', exhaust:'',             eyes:'',           nose:'',              mouth:'',                   limbs:''},
];

const sel = (opts, val='') => opts.map(o=>`<option value="${o.v}"${o.v===val?' selected':''}>${o.l}</option>`).join('');

function populateForm() {
  document.getElementById('mf-pose').innerHTML    = sel(POSE_OPTS,    's-ask');
  document.getElementById('mf-exhaust').innerHTML = sel(EXHAUST_OPTS, '');
  document.getElementById('mf-eyes').innerHTML    = sel(EYES_OPTS,    '');
  document.getElementById('mf-nose').innerHTML    = sel(NOSE_OPTS,    '');
  document.getElementById('mf-mouth').innerHTML   = sel(MOUTH_OPTS,   '');
  document.getElementById('mf-limbs').innerHTML   = sel(LIMBS_OPTS,   '');
}

let presets = [];

function tagLabel(v, opts) {
  return opts.find(o=>o.v===v)?.l || v;
}

function renderList() {
  const el = document.getElementById('preset-list');
  if (!presets.length) {
    el.innerHTML = '<div class="empty-state">No presets yet — click + New Mood to add one.</div>';
    return;
  }
  el.innerHTML = presets.map((p, i) => {
    const tags = [
      p.pose    ? tagLabel(p.pose,    POSE_OPTS)    : null,
      p.exhaust ? tagLabel(p.exhaust, EXHAUST_OPTS) : null,
      p.eyes    ? tagLabel(p.eyes,    EYES_OPTS)    : null,
      p.nose    ? tagLabel(p.nose,    NOSE_OPTS)    : null,
      p.mouth   ? tagLabel(p.mouth,   MOUTH_OPTS)   : null,
      p.limbs   ? tagLabel(p.limbs,   LIMBS_OPTS)   : null,
    ].filter(Boolean);
    return `<div class="preset-card">
      <div class="preset-head">
        <span class="preset-name">${p.label}</span>
        <div class="preset-tags">${tags.map(t=>`<span class="ptag">${t}</span>`).join('')}</div>
        <button class="btn-prv2" onclick="window._previewPreset(${i})">▶ Preview</button>
        <button class="btn-del"  onclick="window._deletePreset(${i})">✕ Delete</button>
      </div>
    </div>`;
  }).join('');
}

function toMoodSpec(p) {
  const spec = { mood: p.pose || 's-ask' };
  if (p.exhaust?.startsWith('s-flame')) { spec.flame = p.exhaust; spec.smoke = ''; }
  else if (p.exhaust?.startsWith('s-smoke')) { spec.smoke = p.exhaust; spec.flame = ''; }
  if (p.eyes)  spec.eyes     = p.eyes;
  if (p.nose)  spec.noseSpin = p.nose;
  if (p.mouth) spec.mouth    = p.mouth;
  if (p.limbs) spec.limbs    = p.limbs;
  return spec;
}

async function persist() {
  if (auth.currentUser) await auth.currentUser.getIdToken(true);
  await setDoc(doc(db,'config','mascotMoods'), { presets }, { merge:false });
}

window._previewPreset = function(i) {
  const p = presets[i]; if (!p) return;
  window.PBMascot.setMood(toMoodSpec(p));
  document.getElementById('prev-cap').textContent = p.label;
};

window._livePreview = function() {
  const p = {
    pose:    document.getElementById('mf-pose').value,
    exhaust: document.getElementById('mf-exhaust').value,
    eyes:    document.getElementById('mf-eyes').value,
    nose:    document.getElementById('mf-nose').value,
    mouth:   document.getElementById('mf-mouth').value,
    limbs:   document.getElementById('mf-limbs').value,
    label:   document.getElementById('mf-label').value || '…'
  };
  window.PBMascot.setMood(toMoodSpec(p));
  document.getElementById('prev-cap').textContent = p.label;
};

window._toggleForm = function() {
  const f = document.getElementById('add-form');
  const open = f.classList.toggle('open');
  if (open) {
    document.getElementById('mf-label').value = '';
    document.getElementById('fstatus').textContent = '';
    populateForm();
  }
};

window._savePreset = async function() {
  const label = document.getElementById('mf-label').value.trim();
  const fsts  = document.getElementById('fstatus');
  if (!label) { fsts.style.color='#ef4444'; fsts.textContent='Name is required.'; return; }
  const id = label.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') + '-' + Date.now().toString(36);
  const preset = { id, label,
    pose:    document.getElementById('mf-pose').value,
    exhaust: document.getElementById('mf-exhaust').value,
    eyes:    document.getElementById('mf-eyes').value,
    nose:    document.getElementById('mf-nose').value,
    mouth:   document.getElementById('mf-mouth').value,
    limbs:   document.getElementById('mf-limbs').value,
  };
  fsts.style.color='#64748b'; fsts.textContent='Saving…';
  try {
    presets.push(preset);
    await persist();
    renderList();
    fsts.style.color='#22c55e'; fsts.textContent='✓ Saved';
    setTimeout(window._toggleForm, 700);
  } catch(e) {
    presets.pop();
    fsts.style.color='#ef4444'; fsts.textContent='✗ '+e.message;
  }
};

window._deletePreset = async function(i) {
  if (!confirm(`Delete "${presets[i]?.label}"?`)) return;
  presets.splice(i, 1);
  try {
    await persist();
    renderList();
    const g = document.getElementById('gstatus');
    g.textContent='✓ Deleted'; setTimeout(()=>{ g.textContent=''; },2000);
  } catch(e) {
    document.getElementById('gstatus').style.color='#ef4444';
    document.getElementById('gstatus').textContent='✗ '+e.message;
  }
};

onAuthStateChanged(auth, async user => {
  if (!user) return;
  try {
    const snap = await getDoc(doc(db,'config','mascotMoods'));
    if (snap.exists() && snap.data().presets?.length) {
      presets = snap.data().presets;
    } else {
      presets = DEFAULT_PRESETS;
      await persist();
    }
    renderList();
    if (presets.length) {
      window.PBMascot.setMood(toMoodSpec(presets[0]));
      document.getElementById('prev-cap').textContent = presets[0].label;
    }
  } catch(e) {
    document.getElementById('preset-list').innerHTML = '<div class="empty-state">Error loading presets: '+e.message+'</div>';
  }
  document.body.style.visibility = '';
});
</script>
</body>
</html>
