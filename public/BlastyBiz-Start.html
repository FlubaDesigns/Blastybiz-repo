<head>

  <link rel="stylesheet" href="global-style.css?v=20261110-section1"/>
  <link rel="icon" type="image/x-icon" href="favicon.ico"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>

<body class="start-page">
  <main class="main"><div class="main-inner"><div class="row">
    <h1>Create your first post</h1>
    <a class="btn btn__primary" id="start-continue" href="BlastyBiz-Login.html?start=forms">Create my post</a>
    <a href="BlastyBiz-Login.html?intent=signin">Sign in</a>
  </div></div></main>
  <script>
    // Preserve old guided links and return-to-work parameters without another choice screen.
    const params = new URLSearchParams(location.search);
    if (params.get('intent') !== 'signin' && !['guided','forms'].includes(params.get('start'))) params.set('start','forms');
    const next = 'BlastyBiz-Login.html?' + params;
    document.getElementById('start-continue').href = next;
    location.replace(next);
  </script>
</body>
</html>
