<body class="has-site-header app-page page-rewards">
<div id="header__inject"></div><script src="header-loader.js?v=1"></script>
<main class="main"><div class="main-inner w-xl">
  <div class="row"><div class="col-full"><h1 class="page-title">Your QR Gear <span>shirt</span></h1><p id="reward-message" role="status">Opening your saved reward…</p><p id="reward-error" role="alert"></p></div></div>
  <div class="row"><div class="col-full"><button class="btn" id="reward-refresh" type="button">Refresh shirt status</button><a class="btn" href="BlastyBiz-Dashboard.html">Dashboard</a></div></div>
  <div class="row" id="reward-upgrade" hidden><div class="col-full"><a class="btn btn-primary" href="BlastyBiz-Choose-Plan.html">View annual Pro</a></div></div>
  <section class="row" id="reward-content" hidden><div class="col-full card">
    <h2 id="reward-title">Personalize your shirt</h2><p id="reward-description"></p><p id="reward-terms"></p>
    <fieldset class="row" id="reward-options"><legend>Your design</legend><div class="col-full">
      <label for="reward-business">Business</label><select id="reward-business"><option value="">Choose your business</option></select>
      <label for="reward-style">What to print</label><select id="reward-style"><option value="full">Full graphic — logo, website and QR</option><option value="qr-only">QR code only</option></select>
      <div class="row" id="reward-logo-options"><div class="col-full"><label for="reward-image">Saved logo</label><select id="reward-image"><option value="">Choose a PNG logo</option></select><label for="reward-upload">Or upload your logo</label><input id="reward-upload" type="file" accept="image/png,image/jpeg,image/webp"><p id="reward-upload-status" role="status"></p></div></div>
      <label for="reward-color">Color</label><select id="reward-color"><option value="">Choose a color</option></select>
      <label for="reward-size">Size</label><select id="reward-size"><option value="">Choose a size</option></select>
      <button class="btn btn-primary" id="reward-generate" type="button">Create my shirt preview</button>
    </div></fieldset>
    <figure class="row" id="reward-preview" hidden><div class="col-full"><a id="reward-preview-link" target="_blank" rel="noopener noreferrer"><img id="reward-preview-image" class="reward-preview-image" alt="Your personalized shirt preview"></a><figcaption id="reward-preview-caption"></figcaption><p>Tap the image to open it and zoom in.</p><p>QR destination: <a id="reward-destination" target="_blank" rel="noopener noreferrer"></a></p></div></figure>
    <form class="row" id="reward-shipping"><fieldset class="col-full" id="reward-shipping-fields"><legend>Where to send it</legend>
      <label for="reward-name">Full name</label><input id="reward-name" name="name" autocomplete="name" maxlength="160" required>
      <label for="reward-address1">Street address</label><input id="reward-address1" name="address1" autocomplete="address-line1" maxlength="160" required>
      <label for="reward-address2">Apartment or suite (optional)</label><input id="reward-address2" name="address2" autocomplete="address-line2" maxlength="160">
      <label for="reward-city">City</label><input id="reward-city" name="city" autocomplete="address-level2" maxlength="160" required>
      <label for="reward-region">State / region</label><input id="reward-region" name="region" autocomplete="address-level1" maxlength="160" required>
      <label for="reward-postalCode">Postal code</label><input id="reward-postalCode" name="postalCode" autocomplete="postal-code" maxlength="160" required>
      <label for="reward-country">Country code</label><input id="reward-country" name="country" autocomplete="country" maxlength="2" minlength="2" value="US" required>
    </fieldset><div class="col-full"><label><input id="reward-consent" type="checkbox"> I approve this exact design, color, size and shipping address.</label><button class="btn btn-primary" id="reward-approve" type="submit" disabled>Claim my free shirt</button></div></form>
    <div class="row"><div class="col-full"><a class="btn" id="reward-tracking" target="_blank" rel="noopener noreferrer" hidden>Track my shirt</a></div></div>
  </div></section>
  <div class="row"><div class="col-full"><p>Made through <a href="https://qrgear-c1ffd.web.app" target="_blank" rel="noopener noreferrer">QR Gear</a>.</p></div></div>
</div></main>
