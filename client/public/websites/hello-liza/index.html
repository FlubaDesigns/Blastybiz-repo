<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello Liza</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: black;
            color: green;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        h1 {
            font-size: 4em;
            text-shadow: 0 0 10px green;
            animation: pulse 2s infinite alternate;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }
        @media (prefers-reduced-motion: reduce) {
            h1 {
                animation: none;
            }
        }
    </style>
</head>
<body>
    <h1>Hello World</h1>
    <h2>Hello Liza!</h2>
    <p>Welcome to the self-contained webpage. Here you can find some useful information.</p>
</body>
</html>
