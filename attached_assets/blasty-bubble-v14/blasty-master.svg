<svg class="blasty-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 460" role="img" aria-labelledby="blastyTitle blastyDesc">
  <title id="blastyTitle">Blasty rocket assistant</title>
  <desc id="blastyDesc">A friendly red, white, green and orange rocket mascot with expressive face and animated gestures.</desc>
  <defs>
    <linearGradient id="bodyFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".48" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#dbe6f2"/>
    </linearGradient>
    <linearGradient id="bodyShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".94"/>
      <stop offset=".64" stop-color="#ffffff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#8ea4bc" stop-opacity=".34"/>
    </linearGradient>
    <linearGradient id="redFill" x1="0" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#ff5a4f"/>
      <stop offset=".48" stop-color="#ff2f2f"/>
      <stop offset="1" stop-color="#d70f22"/>
    </linearGradient>
    <linearGradient id="greenFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ee33f"/>
      <stop offset=".5" stop-color="#49bf24"/>
      <stop offset="1" stop-color="#238b19"/>
    </linearGradient>
    <radialGradient id="eyeFill" cx=".35" cy=".25" r=".9">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".15" stop-color="#deffd8"/>
      <stop offset=".58" stop-color="#65d84a"/>
      <stop offset="1" stop-color="#1b8e2b"/>
    </radialGradient>
    <linearGradient id="flameOuter" x1=".5" y1="0" x2=".5" y2="1">
      <stop offset="0" stop-color="#ffdc2f"/>
      <stop offset=".46" stop-color="#ff961f"/>
      <stop offset="1" stop-color="#ef3d10"/>
    </linearGradient>
    <linearGradient id="flameInner" x1=".5" y1="0" x2=".5" y2="1">
      <stop offset="0" stop-color="#fffbd7"/>
      <stop offset=".55" stop-color="#fff04c"/>
      <stop offset="1" stop-color="#ffac20"/>
    </linearGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="rocketShadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="5" flood-color="#020b1c" flood-opacity=".45"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="bodyClip">
      <path d="M180 42 C117 89 89 163 91 251 C92 309 119 348 180 378 C241 348 268 309 269 251 C271 163 243 89 180 42Z"/>
    </clipPath>
  </defs>

  <g id="blasty-shadow">
    <ellipse class="shadow-ellipse" cx="180" cy="431" rx="72" ry="15" fill="#091c42" opacity=".5" filter="url(#softShadow)"/>
  </g>

  <g id="blasty-effects">
    <g class="motion-lines motion-left" fill="none" stroke="#76b8ff" stroke-width="7" stroke-linecap="round" opacity="0">
      <path d="M64 272 Q48 294 61 319"/>
      <path d="M47 260 Q24 292 43 329"/>
    </g>
    <g class="motion-lines motion-right" fill="none" stroke="#76b8ff" stroke-width="7" stroke-linecap="round" opacity="0">
      <path d="M296 272 Q312 294 299 319"/>
      <path d="M313 260 Q336 292 317 329"/>
    </g>
    <g class="sparkles" opacity="0">
      <path d="M53 102 l5 13 13 5-13 5-5 13-5-13-13-5 13-5z" fill="#ffd12f"/>
      <path d="M305 94 l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill="#62dd43"/>
      <circle cx="67" cy="164" r="5" fill="#ff5a4f"/>
      <circle cx="300" cy="168" r="5" fill="#ff9f1c"/>
    </g>
    <g class="confetti" opacity="0">
      <rect x="30" y="160" width="9" height="20" rx="3" fill="#ff3c35" transform="rotate(-26 34 170)"/>
      <rect x="313" y="179" width="9" height="20" rx="3" fill="#52ce34" transform="rotate(22 317 189)"/>
      <rect x="56" y="226" width="9" height="20" rx="3" fill="#ffc228" transform="rotate(32 60 236)"/>
      <rect x="294" y="232" width="9" height="20" rx="3" fill="#44a9ff" transform="rotate(-28 298 242)"/>
      <circle cx="37" cy="285" r="6" fill="#43d355"/>
      <circle cx="325" cy="287" r="6" fill="#ff4b3e"/>
    </g>
  </g>

  <g id="blasty-rocket" filter="url(#rocketShadow)">
    <g id="blasty-exhaust">
      <path class="flame flame-outer" d="M180 354 C213 385 207 419 180 446 C153 419 147 385 180 354Z" fill="url(#flameOuter)" stroke="#102957" stroke-width="8" stroke-linejoin="round"/>
      <path class="flame flame-inner" d="M180 368 C197 389 194 411 180 428 C166 411 163 389 180 368Z" fill="url(#flameInner)"/>
      <g class="smoke" opacity="0">
        <circle cx="163" cy="420" r="13" fill="#cbd6e7"/>
        <circle cx="184" cy="429" r="18" fill="#e5ebf3"/>
        <circle cx="204" cy="419" r="12" fill="#cbd6e7"/>
      </g>
    </g>

    <g id="blasty-fins">
      <path d="M103 240 C68 254 46 286 48 327 C74 312 97 298 116 276Z" fill="url(#redFill)" stroke="#102957" stroke-width="9" stroke-linejoin="round"/>
      <path d="M257 240 C292 254 314 286 312 327 C286 312 263 298 244 276Z" fill="url(#redFill)" stroke="#102957" stroke-width="9" stroke-linejoin="round"/>
      <path d="M97 258 C78 271 67 288 61 307" fill="none" stroke="#ff7d72" stroke-width="6" stroke-linecap="round" opacity=".8"/>
      <path d="M263 258 C282 271 293 288 299 307" fill="none" stroke="#ff7d72" stroke-width="6" stroke-linecap="round" opacity=".8"/>
    </g>

    <g id="blasty-body">
      <path d="M180 42 C117 89 89 163 91 251 C92 309 119 348 180 378 C241 348 268 309 269 251 C271 163 243 89 180 42Z" fill="url(#bodyFill)" stroke="#102957" stroke-width="10" stroke-linejoin="round"/>
      <g clip-path="url(#bodyClip)">
        <path d="M184 36 C138 106 128 245 149 342 C126 329 107 307 98 278 C77 209 103 104 180 42Z" fill="#ffffff" opacity=".88"/>
        <path d="M231 76 C265 135 278 240 246 315 C232 340 210 359 180 377 C207 285 214 168 184 43Z" fill="url(#bodyShade)" opacity=".75"/>
        <path d="M93 269 C121 289 148 299 180 299 C212 299 239 289 267 269 L265 301 C239 319 211 327 180 327 C149 327 121 319 95 301Z" fill="url(#greenFill)" stroke="#102957" stroke-width="8"/>
        <path d="M105 283 C132 298 156 304 180 304 C204 304 228 298 255 283" fill="none" stroke="#b3ff70" stroke-width="5" opacity=".8"/>
      </g>

      <path d="M180 42 C151 64 129 88 113 116 C137 105 157 100 180 100 C203 100 223 105 247 116 C231 88 209 64 180 42Z" fill="url(#redFill)" stroke="#102957" stroke-width="9" stroke-linejoin="round"/>
      <path d="M149 80 C163 63 175 53 180 49 C191 57 203 68 214 82" fill="none" stroke="#ff9a91" stroke-width="7" stroke-linecap="round" opacity=".8"/>
      <path d="M205 56 C220 72 229 85 236 102" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" opacity=".9"/>

      <g id="blasty-face">
        <g class="brow brow-left" fill="none" stroke="#102957" stroke-width="8" stroke-linecap="round">
          <path d="M126 161 Q145 146 160 158"/>
        </g>
        <g class="brow brow-right" fill="none" stroke="#102957" stroke-width="8" stroke-linecap="round">
          <path d="M200 158 Q216 146 234 161"/>
        </g>

        <g class="eye eye-left">
          <ellipse cx="145" cy="196" rx="29" ry="37" fill="#fff" stroke="#102957" stroke-width="7"/>
          <g class="pupil pupil-left">
            <ellipse cx="148" cy="200" rx="18" ry="24" fill="url(#eyeFill)" stroke="#102957" stroke-width="5"/>
            <ellipse cx="151" cy="202" rx="8" ry="13" fill="#071329"/>
            <circle cx="143" cy="190" r="6" fill="#fff"/>
            <circle cx="155" cy="211" r="3" fill="#fff" opacity=".8"/>
          </g>
          <path class="lid lid-left" d="M116 195 Q145 170 174 195" fill="#f8fbff" stroke="#102957" stroke-width="7" opacity="0"/>
        </g>

        <g class="eye eye-right">
          <ellipse cx="215" cy="196" rx="29" ry="37" fill="#fff" stroke="#102957" stroke-width="7"/>
          <g class="pupil pupil-right">
            <ellipse cx="212" cy="200" rx="18" ry="24" fill="url(#eyeFill)" stroke="#102957" stroke-width="5"/>
            <ellipse cx="209" cy="202" rx="8" ry="13" fill="#071329"/>
            <circle cx="204" cy="190" r="6" fill="#fff"/>
            <circle cx="216" cy="211" r="3" fill="#fff" opacity=".8"/>
          </g>
          <path class="lid lid-right" d="M186 195 Q215 170 244 195" fill="#f8fbff" stroke="#102957" stroke-width="7" opacity="0"/>
        </g>

        <ellipse class="cheek cheek-left" cx="121" cy="244" rx="15" ry="8" fill="#ff7272" opacity=".55"/>
        <ellipse class="cheek cheek-right" cx="239" cy="244" rx="15" ry="8" fill="#ff7272" opacity=".55"/>

        <g id="mouths">
          <path class="mouth mouth-smile" d="M145 238 Q180 270 215 238 Q208 286 180 291 Q152 286 145 238Z" fill="#102957"/>
          <path class="mouth mouth-smile" d="M162 273 Q180 287 198 273 Q187 269 180 270 Q173 269 162 273Z" fill="#ff4d57"/>
          <ellipse class="mouth mouth-talk-small" cx="180" cy="259" rx="17" ry="21" fill="#102957" opacity="0"/>
          <ellipse class="mouth mouth-talk-small" cx="180" cy="268" rx="10" ry="6" fill="#ff4d57" opacity="0"/>
          <ellipse class="mouth mouth-talk-open" cx="180" cy="260" rx="25" ry="31" fill="#102957" opacity="0"/>
          <path class="mouth mouth-talk-open" d="M161 274 Q180 289 199 274 Q180 267 161 274Z" fill="#ff4d57" opacity="0"/>
          <path class="mouth mouth-concern" d="M153 273 Q180 247 207 273" fill="none" stroke="#102957" stroke-width="9" stroke-linecap="round" opacity="0"/>
        </g>

        <g id="blasty-badge">
          <circle cx="180" cy="316" r="29" fill="#102957"/>
          <circle cx="180" cy="316" r="23" fill="url(#greenFill)" stroke="#b9ff78" stroke-width="4"/>
          <path d="M169 299 H183 C198 299 202 314 192 320 C202 325 198 337 183 337 H169Z" fill="#fff"/>
          <path d="M177 306 H184 C191 306 191 314 184 314 H177ZM177 321 H185 C192 321 192 329 185 329 H177Z" fill="#2c9e1d"/>
        </g>
      </g>
    </g>

    <g id="blasty-arms">
      <g class="arm arm-wave" opacity="0">
        <path d="M113 261 C84 253 73 229 82 207" fill="none" stroke="#102957" stroke-width="19" stroke-linecap="round"/>
        <path d="M113 261 C84 253 73 229 82 207" fill="none" stroke="#f8fbff" stroke-width="11" stroke-linecap="round"/>
        <g transform="translate(78 199) rotate(-18)">
          <circle cx="0" cy="0" r="16" fill="#fff" stroke="#102957" stroke-width="6"/>
          <path d="M-12 -7 L-22 -22 M-4 -13 L-7 -31 M5 -13 L10 -31 M12 -8 L23 -22" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round"/>
          <path d="M-12 -7 L-22 -22 M-4 -13 L-7 -31 M5 -13 L10 -31 M12 -8 L23 -22" fill="none" stroke="#102957" stroke-width="4" stroke-linecap="round"/>
        </g>
      </g>

      <g class="arm arm-point-right" opacity="0">
        <path d="M247 259 C277 250 292 235 307 220" fill="none" stroke="#102957" stroke-width="19" stroke-linecap="round"/>
        <path d="M247 259 C277 250 292 235 307 220" fill="none" stroke="#f8fbff" stroke-width="11" stroke-linecap="round"/>
        <g transform="translate(311 216) rotate(-20)">
          <circle cx="0" cy="0" r="15" fill="#fff" stroke="#102957" stroke-width="6"/>
          <path d="M9 -3 L34 -11" fill="none" stroke="#102957" stroke-width="11" stroke-linecap="round"/>
          <path d="M9 -3 L34 -11" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
        </g>
      </g>

      <g class="arm arm-think" opacity="0">
        <path d="M242 267 C269 268 279 249 271 232" fill="none" stroke="#102957" stroke-width="19" stroke-linecap="round"/>
        <path d="M242 267 C269 268 279 249 271 232" fill="none" stroke="#f8fbff" stroke-width="11" stroke-linecap="round"/>
        <circle cx="271" cy="226" r="15" fill="#fff" stroke="#102957" stroke-width="6"/>
      </g>
    </g>
  </g>
</svg>
