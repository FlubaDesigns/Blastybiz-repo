<header class="header">
  <div class="header__nav-row">
    <a class="header__logo" href="BlastyBiz-Home.html" aria-label="BlastyBiz — go to home">
      <img class="header__logo-icon" src="img/blastie-blizz-logo.png" alt="BlastyBiz logo" />
      <div class="header__logo-brand">
        <img class="header__logo-wordmark" src="img/blastybiz-title.png?v=2" alt="BlastyBiz" />
        <img class="header__logo-tagline" id="site-header-tagline" src="img/blastybiz-tagline.png?v=2" alt="Lock. Load. Blast." />
      </div>
    </a>
    <nav class="header__nav">
      <a class="header__nav-link" href="BlastyBiz-About.html">About</a>
      <a class="header__nav-link" href="BlastyBiz-Contact.html">Contact</a>
      <a class="header__nav-link" id="sh-create-link" href="BlastyBiz.html">Create Listing</a>
      <a class="header__nav-link" id="sh-login-link" href="BlastyBiz-Login.html">Log In</a>
      <button class="header__nav-link sh-logout-btn" id="sh-logout-btn" onclick="if(typeof doSignOut==='function')doSignOut()">Log Out</button>
      <a class="header__nav-cta" href="BlastyBiz-Login.html">Try It Free</a>
      <button class="header__hamburger" id="sh-hamburger" aria-label="Open menu" onclick="if(typeof toggleMenu==='function')toggleMenu()">
        <span></span><span></span><span></span>
      </button>
    </nav>
  </div>
  <div class="header__badge-bar">
    <span class="header__badge">⚡ AI-Powered Marketing</span>
  </div>
</header>
<nav class="header__mobile-menu" id="mobile-menu">
  <a class="header__mobile-link" href="BlastyBiz-About.html"   onclick="closeMenu()">About</a>
  <a class="header__mobile-link" href="BlastyBiz-Contact.html" onclick="closeMenu()">Contact</a>
  <a class="header__mobile-link" href="BlastyBiz.html"         onclick="closeMenu()">Create Listing</a>
  <a class="header__mobile-link" id="menu-login-link"  href="BlastyBiz-Login.html" onclick="closeMenu()">Log In</a>
  <button class="header__mobile-link" id="menu-logout-btn" onclick="if(typeof doSignOut==='function'){closeMenu();doSignOut()}">Log Out</button>
  <a class="header__mobile-link header__nav-cta" href="BlastyBiz-Login.html" onclick="closeMenu()">Try It Free</a>
</nav>
<script>
function toggleMenu(){
  var m=document.getElementById('mobile-menu');
  if(m)m.classList.toggle('open');
}
function closeMenu(){
  var m=document.getElementById('mobile-menu');
  if(m)m.classList.remove('open');
}
function _setHeaderOffset(){
  var h=document.querySelector('.header');
  if(!h)return;
  var px=h.offsetHeight+'px';
  document.body.style.paddingTop=px;
  document.documentElement.style.setProperty('--header-h',px);
}
if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',_setHeaderOffset);
}else{
  _setHeaderOffset();
}
window.addEventListener('resize',_setHeaderOffset);
</script>
