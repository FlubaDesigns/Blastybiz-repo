<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <meta name="description" content="Set up your BlastyBiz business profile."/>
  <link rel="stylesheet" href="global-style.css?v=1784537230277"/>
  <title>BlastyBiz — Your Business</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700&display=swap" rel="stylesheet"/>
  <script src="blastybiz-menu.js?v=3"></script>
  <style>

    .pb-page {
      min-height: 100vh;
      padding-top: var(--main-offset, 55px);
      display: flex;
      align-items: flex-start;
    }
    .pb-layout {
      display: flex;
      flex-direction: row;
      width: 100%;
      max-width: 860px;
      margin: 0 auto;
      padding: 44px 24px 80px;
      gap: 36px;
      align-items: flex-start;
    }

    .pb-chat {
      flex: 1;
      min-width: 0;
      order: 1;
    }
    .pb-logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 30px;
      color: var(--green);
      letter-spacing: 2px;
      margin-bottom: 2px;
    }
    .pb-tagline {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 28px;
    }
    .pb-thread {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .bubble-blasty {
      align-self: flex-end;
      background: var(--panel, #111);
      border: 1.5px solid var(--border, #222);
      border-radius: 18px 4px 18px 18px;
      padding: 13px 16px;
      max-width: 88%;
      font-size: 15px;
      line-height: 1.65;
      color: var(--light, #fff);
      animation: bb-in .38s ease both;
    }
    .bubble-user {
      align-self: flex-start;
      background: var(--panel, #111);
      border: 1.5px solid var(--border, #222);
      border-radius: 4px 18px 18px 18px;
      padding: 13px 16px;
      max-width: 88%;
      width: 100%;
      box-sizing: border-box;
      animation: bb-in .38s ease both;
    }
    .bubble-user.locked {
      background: var(--green);
      border-color: var(--green);
      color: #000;
      font-weight: 700;
      font-size: 15px;
      padding: 12px 16px;
    }
    @keyframes bb-in {
      from { opacity: 0; transform: translateY(9px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .bubble-input {
      display: block;
      width: 100%;
      box-sizing: border-box;
      background: var(--panel, #111);
      border: 1.5px solid var(--border, #222);
      border-radius: 8px;
      padding: 11px 14px;
      font-size: 15px;
      color: var(--light, #fff);
      font-family: 'DM Sans', sans-serif;
      outline: none;
      transition: border-color .18s;
    }
    .bubble-input:focus { border-color: var(--green); }
    .bubble-input::placeholder { color: var(--muted, #555); }

    .bubble-hint {
      font-size: 12px;
      color: var(--muted, #555);
      margin-top: 7px;
    }
    .bubble-action-btn {
      display: block;
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      background: var(--green);
      color: #000;
      font-weight: 700;
      font-size: 14px;
      border: none;
      border-radius: 9px;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: opacity .18s, transform .1s;
    }
    .bubble-action-btn:hover  { opacity: .88; }
    .bubble-action-btn:active { transform: scale(.98); }
    .bubble-action-btn:disabled { opacity: .42; cursor: not-allowed; }

    .pb-err {
      font-size: 13px;
      color: #e57373;
      margin-top: 7px;
      display: none;
    }

    /* ── Toggle switch ──────────────────────────────────────────── */
    .toggle-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 11px;
      padding: 9px 12px;
      background: rgba(255,255,255,.04);
      border-radius: 8px;
    }
    .toggle-label {
      font-size: 13px;
      color: var(--muted, #888);
      flex: 1;
      line-height: 1.4;
    }
    .toggle-switch {
      position: relative;
      width: 42px;
      height: 24px;
      flex-shrink: 0;
    }
    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
      position: absolute;
    }
    .toggle-slider {
      position: absolute;
      inset: 0;
      background: #333;
      border-radius: 24px;
      cursor: pointer;
      transition: background .2s;
    }
    .toggle-slider::before {
      content: '';
      position: absolute;
      width: 18px;
      height: 18px;
      left: 3px;
      top: 3px;
      background: white;
      border-radius: 50%;
      transition: transform .2s;
    }
    .toggle-switch input:checked + .toggle-slider { background: var(--green); }
    .toggle-switch input:checked + .toggle-slider::before { transform: translateX(18px); }

    /* ── Blasty zone (right — desktop) ──────────────────────────── */
    .pb-blasty-zone {
      flex-shrink: 0;
      width: 190px;
      order: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: sticky;
      top: calc(var(--main-offset, 55px) + 20px);
    }
    .pb-blasty { width: 160px; }
    #blasty-svg { width: 100%; height: auto; overflow: visible; }
    .pb-blasty-caption {
      font-size: 12px;
      color: var(--muted, #666);
      margin-top: 10px;
      text-align: center;
      font-style: italic;
      min-height: 18px;
      transition: opacity .3s;
    }

    /* ── Blasty animations ──────────────────────────────────────── */
    #blasty-svg {
      transform-box: fill-box;
      transform-origin: bottom center;
    }
    .pb-blasty.s-arrive #blasty-svg {
      animation: b-arrive .45s cubic-bezier(.34,1.56,.64,1) both;
    }
    @keyframes b-arrive {
      0%   { transform: scale(0.6) translateY(18px); opacity: 0; }
      100% { transform: scale(1)   translateY(0);    opacity: 1; }
    }

    /* Idle float — whole rocket */
    #blasty-body {
      transform-box: fill-box;
      transform-origin: bottom center;
      animation: b-float 3.2s ease-in-out infinite;
    }
    @keyframes b-float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-11px); }
    }

    /* Flame pulse */
    .flame {
      transform-box: fill-box;
      transform-origin: top center;
      animation: b-flame-pulse 0.5s ease-in-out infinite;
    }
    @keyframes b-flame-pulse {
      0%, 100% { transform: scaleY(1)   scaleX(1); }
      50%       { transform: scaleY(1.35) scaleX(0.8); }
    }

    /* Mouth variants — default happy visible, rest hidden */
    .mouth-working, .mouth-celebrate, .mouth-ask { opacity: 0 !important; }
    .pb-blasty.s-working  .mouth-happy    { opacity: 0 !important; }
    .pb-blasty.s-working  .mouth-working  { opacity: 1 !important; }
    .pb-blasty.s-celebrate .mouth-happy   { opacity: 0 !important; }
    .pb-blasty.s-celebrate .mouth-celebrate { opacity: 1 !important; }
    .pb-blasty.s-ask      .mouth-happy    { opacity: 0 !important; }
    .pb-blasty.s-ask      .mouth-ask      { opacity: 1 !important; }

    /* Arms — all hidden by default, CSS shows per mood */
    .blasty-arm { transition: opacity .25s ease; }
    .pb-blasty.s-wave    .blasty-arm-wave  { opacity: 1 !important; }
    .pb-blasty.s-working .blasty-arm-point { opacity: 1 !important; }

    /* ── s-wave ──────────────────────────────────────────────────── */
    .pb-blasty.s-wave #blasty-body {
      animation: b-wave .55s ease-in-out 4, b-float 3.2s ease-in-out infinite 2.2s;
    }
    @keyframes b-wave {
      0%, 100% { transform: rotate(0deg)   translateY(0); }
      25%       { transform: rotate(-22deg) translateY(-8px); }
      65%       { transform: rotate(16deg)  translateY(-4px); }
    }
    .pb-blasty.s-wave .pupil-group-l { transform: scale(1.1) translateY(-3px); }
    .pb-blasty.s-wave .pupil-group-r { transform: scale(1.1) translateY(-3px); }

    /* ── s-happy ─────────────────────────────────────────────────── */
    .pb-blasty.s-happy #blasty-body {
      animation: b-bounce .4s ease-in-out 3, b-float 3.2s ease-in-out infinite 1.2s;
    }
    @keyframes b-bounce {
      0%   { transform: translateY(0)     scale(1,1); }
      35%  { transform: translateY(-28px) scale(0.9,1.15); }
      65%  { transform: translateY(-22px) scale(0.9,1.15); }
      85%  { transform: translateY(4px)   scale(1.12,0.88); }
      100% { transform: translateY(0)     scale(1,1); }
    }
    .pb-blasty.s-happy .pupil-group-l { transform: translateY(4px) scaleY(0.75); }
    .pb-blasty.s-happy .pupil-group-r { transform: translateY(4px) scaleY(0.75); }

    /* ── s-ask ───────────────────────────────────────────────────── */
    .pb-blasty.s-ask .pupil-group-l { transform: translateX(-6px) translateY(2px); transition: transform .3s ease; }
    .pb-blasty.s-ask .pupil-group-r { transform: translateX(-6px) translateY(2px); transition: transform .3s ease; }
    .pb-blasty.s-ask #blasty-body   { animation: b-lean 3s ease-in-out infinite; }
    @keyframes b-lean {
      0%, 100% { transform: translateY(0)    rotate(-9deg); }
      50%       { transform: translateY(-10px) rotate(-9deg); }
    }

    /* ── s-working ───────────────────────────────────────────────── */
    .pb-blasty.s-working #blasty-body {
      animation: b-work .65s ease-in-out infinite;
    }
    @keyframes b-work {
      0%, 100% { transform: translateY(0)   rotate(-5deg); }
      25%       { transform: translateY(-9px) rotate(7deg); }
      75%       { transform: translateY(-4px) rotate(-8deg); }
    }
    .pb-blasty.s-working .flame {
      animation: b-flame-work .32s ease-in-out infinite;
    }
    @keyframes b-flame-work {
      0%, 100% { transform: scaleY(1)   scaleX(1); }
      50%       { transform: scaleY(2.1) scaleX(0.65); }
    }
    .pb-blasty.s-working .pupil-group-l { transform: translateY(5px); }
    .pb-blasty.s-working .pupil-group-r { transform: translateY(5px); }

    /* ── s-celebrate ─────────────────────────────────────────────── */
    .pb-blasty.s-celebrate #blasty-body {
      animation: b-celebrate .38s ease-in-out 5;
    }
    @keyframes b-celebrate {
      0%, 100% { transform: translateY(0)    scale(1)    rotate(0deg); }
      25%       { transform: translateY(-30px) scale(1.14) rotate(-8deg); }
      75%       { transform: translateY(-22px) scale(1.14) rotate(8deg); }
    }
    .pb-blasty.s-celebrate .confetti > g {
      transform-box: fill-box;
      transform-origin: center;
      animation: confetti-burst 1.6s ease-out forwards;
    }
    @keyframes confetti-burst {
      0%   { opacity: 1; transform: translateY(0)    scale(1); }
      100% { opacity: 0; transform: translateY(80px) scale(1.8); }
    }

    /* ── Per-message mini Blasty avatar ─────────────────────────── */
    .blasty-msg-row {
      display: flex;
      align-items: flex-end;
      align-self: flex-end;   /* right-align row in thread column, matching existing bubble behaviour */
      gap: 8px;
      margin-bottom: 2px;
      max-width: 92%;         /* cap full row width so bubble doesn't swamp the thread */
    }
    .blasty-msg-row .bubble-blasty {
      flex: 1;
      min-width: 0;
      max-width: 100%;        /* constrained by row's max-width, not the thread */
    }
    .blasty-msg-avatar {
      width: 34px;
      flex-shrink: 0;
      opacity: 0.92;
    }
    .blasty-msg-avatar svg { width: 34px; height: auto; display: block; overflow: visible; }

    /* ── Choice buttons ─────────────────────────────────────────── */
    .ob2-choices {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 4px;
    }
    .ob2-choice-btn {
      width: 100%;
      padding: 13px 16px;
      background: var(--panel, #111);
      border: 1.5px solid var(--border, #333);
      border-radius: 10px;
      color: var(--light, #fff);
      font-size: 15px;
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      transition: border-color .18s, background .18s, transform .1s;
    }
    .ob2-choice-btn:hover   { border-color: var(--green); background: rgba(0,200,83,.06); }
    .ob2-choice-btn:active  { transform: scale(.98); }
    /* ── Textarea input ─────────────────────────────────────────── */
    .bubble-textarea {
      width: 100%; min-height: 80px; resize: vertical;
      font-family: inherit; font-size: 15px; line-height: 1.55;
      background: var(--bg-input, #1a1a1a); color: var(--light, #fff);
      border: 1px solid var(--border, #333); border-radius: 10px;
      padding: 10px 12px; box-sizing: border-box; margin-bottom: 2px;
    }
    .bubble-textarea:focus { border-color: var(--green); outline: none; }
    .bubble-textarea::placeholder { color: var(--muted, #555); }

    /* ── Multiselect (platforms) ─────────────────────────────────── */
    .ob2-multiselect { display: flex; flex-direction: column; gap: 10px; margin: 4px 0 8px; }
    .ob2-ms-label {
      display: flex; align-items: center; gap: 10px;
      font-size: 15px; cursor: pointer; padding: 10px 12px;
      background: var(--bg-input, #1a1a1a); border: 1px solid var(--border, #333);
      border-radius: 10px; transition: border-color .2s;
    }
    .ob2-ms-label:hover { border-color: var(--green); }
    .ob2-ms-label input[type=checkbox] { width: 17px; height: 17px; accent-color: var(--green); cursor: pointer; }
    .ob2-ms-locked { opacity: 0.42; cursor: default; }
    .ob2-ms-locked:hover { border-color: var(--border, #333); }
    .ob2-pro-badge {
      font-size: 10px; font-weight: 700; background: var(--green, #39ff14);
      color: #000; border-radius: 4px; padding: 1px 6px; margin-left: auto;
    }

    .ob2-choice-btn.selected {
      border-color: var(--green);
      background: rgba(0,200,83,.14);
      color: var(--green);
      font-weight: 700;
    }

    /* ── Tablet (580 – 859px) ───────────────────────────────────── */
    @media (max-width: 859px) {
      .pb-layout {
        flex-direction: column;
        max-width: 600px;
        padding: 28px 24px 80px;
        gap: 0;
      }
      .pb-blasty-zone {
        width: 100%;
        order: -1;
        flex-direction: row;
        justify-content: center;
        align-items: flex-end;
        position: static;
        padding-bottom: 20px;
        gap: 14px;
        transition: justify-content .4s ease;
      }
      .pb-blasty-zone.blasty-pos-left  { justify-content: flex-start; }
      .pb-blasty-zone.blasty-pos-right { justify-content: flex-end; }
      /* caption flips side to stay readable next to Blasty */
      .pb-blasty-zone.blasty-pos-right { flex-direction: row-reverse; }
      .pb-blasty { width: 110px; }
      .pb-blasty-caption {
        font-size: 13px;
        text-align: left;
        margin-top: 0;
        max-width: 180px;
      }
    }

    /* ── Mobile (< 580px) ───────────────────────────────────────── */
    @media (max-width: 579px) {
      .pb-layout {
        padding: 16px 14px 60px;
      }
      .pb-blasty-zone {
        padding-bottom: 14px;
        gap: 10px;
        transition: justify-content .4s ease;
      }
      .pb-blasty-zone.blasty-pos-left  { justify-content: flex-start; }
      .pb-blasty-zone.blasty-pos-right { justify-content: flex-end; flex-direction: row-reverse; }
      .pb-blasty { width: 68px; }
      .pb-logo    { display: none; }
      .pb-tagline { margin-bottom: 14px; font-size: 13px; }
      .pb-blasty-caption { font-size: 12px; max-width: 160px; }
      .bubble-blasty,
      .bubble-user { max-width: 96%; font-size: 14px; }
    }
  </style>
</head>
<body class="has-site-header">
<div id="header__inject"></div>

<div class="pb-page">
  <div class="pb-layout">

    <!-- ── Chat thread (left) ─────────────────────────────────── -->
    <div class="pb-chat">
      <div class="pb-logo">BlastyBiz</div>
      <div class="pb-tagline">Step 2 — Tell me about your business</div>
      <div class="pb-thread" id="pb-thread"></div>
    </div>

    <!-- ── Blasty (right) ────────────────────────────────────── -->
    <div class="pb-blasty-zone" id="pb-blasty-zone">
      <div class="pb-blasty s-ask" id="pb-blasty">
        <svg id="blasty-svg" viewBox="0 0 360 460" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="ob2-bodyFill" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#ffffff"/><stop offset=".48" stop-color="#f8fbff"/><stop offset="1" stop-color="#dbe6f2"/>
            </linearGradient>
            <linearGradient id="ob2-bodyShade" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#ffffff" stop-opacity=".94"/><stop offset=".64" stop-color="#ffffff" stop-opacity=".08"/><stop offset="1" stop-color="#8ea4bc" stop-opacity=".34"/>
            </linearGradient>
            <linearGradient id="ob2-redFill" x1="0" y1="0" x2=".8" y2="1">

            </linearGradient>
            <linearGradient id="ob2-greenFill" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#8ee33f"/><stop offset=".5" stop-color="#49bf24"/><stop offset="1" stop-color="#238b19"/>
            </linearGradient>
            <radialGradient id="ob2-eyeFill" cx=".35" cy=".25" r=".9">

            <linearGradient id="ob2-flameOut" x1=".5" y1="0" x2=".5" y2="1">

            </linearGradient>
            <linearGradient id="ob2-flameIn" x1=".5" y1="0" x2=".5" y2="1">
              <stop offset="0" stop-color="#fffbd7"/><stop offset=".55" stop-color="#fff04c"/><stop offset="1" stop-color="#ffac20"/>
            </linearGradient>

              <path d="M180 42 C117 89 89 163 91 251 C92 309 119 348 180 378 C241 348 268 309 269 251 C271 163 243 89 180 42Z"/>
            </clipPath>

            <g fill="none" stroke="#76b8ff" stroke-width="7" stroke-linecap="round" opacity="0"><path d="M296 272 Q312 294 299 319"/><path d="M313 260 Q336 292 317 329"/></g>
            <g opacity="0"><path d="M53 102 l5 13 13 5-13 5-5 13-5-13-13-5 13-5z" fill="#ffd12f"/><path d="M305 94 l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill="#62dd43"/><circle cx="67" cy="164" r="5" fill="#ff5a4f"/><circle cx="300" cy="168" r="5" fill="#ff9f1c"/></g>
            <g opacity="0"><rect x="30" y="160" width="9" height="20" rx="3" fill="#ff3c35" transform="rotate(-26 34 170)"/><rect x="313" y="179" width="9" height="20" rx="3" fill="#52ce34" transform="rotate(22 317 189)"/><rect x="56" y="226" width="9" height="20" rx="3" fill="#ffc228" transform="rotate(32 60 236)"/><rect x="294" y="232" width="9" height="20" rx="3" fill="#44a9ff" transform="rotate(-28 298 242)"/><circle cx="37" cy="285" r="6" fill="#43d355"/><circle cx="325" cy="287" r="6" fill="#ff4b3e"/></g>
          </g>

          <!-- Ground shadow (stays put, outside float group) -->

          <!-- Whole rocket — floats via CSS -->

            <!-- Fins -->

            <path d="M97 258 C78 271 67 288 61 307" fill="none" stroke="#ff7d72" stroke-width="6" stroke-linecap="round" opacity=".8"/>
            <path d="M263 258 C282 271 293 288 299 307" fill="none" stroke="#ff7d72" stroke-width="6" stroke-linecap="round" opacity=".8"/>

            <!-- Body hull -->

            <g clip-path="url(#ob2-bodyClip)">
              <path d="M184 36 C138 106 128 245 149 342 C126 329 107 307 98 278 C77 209 103 104 180 42Z" fill="#fff" opacity=".88"/>
              <path d="M231 76 C265 135 278 240 246 315 C232 340 210 359 180 377 C207 285 214 168 184 43Z" fill="url(#ob2-bodyShade)" opacity=".75"/>
              <path d="M93 269 C121 289 148 299 180 299 C212 299 239 289 267 269 L265 301 C239 319 211 327 180 327 C149 327 121 319 95 301Z" fill="url(#ob2-greenFill)" stroke="#102957" stroke-width="8"/>
              <path d="M105 283 C132 298 156 304 180 304 C204 304 228 298 255 283" fill="none" stroke="#b3ff70" stroke-width="5" opacity=".8"/>
            </g>

<!-- ── Conversation engine ────────────────────────────────────────── -->
<script>
(function() {
  const answers = {};
  const toggles = { ynMentionName: false, ynMentionRole: false, ynMentionAddress: true, ynMentionPhone: true };
  let step = 0;

  const STEPS = [
    {
      mood: 's-wave',   pos: 'right',
      blastyMsgFn: () => 'Great' + (window._ob2Name ? ', ' + window._ob2Name : '') + '! First — what\'s the name of your business?',
      inputType: 'text',
      key: 'bizName',
      placeholder: "e.g. Mike's Auto Repair",
      hint: 'This is how customers will find you everywhere',
      validate: v => v.trim().length >= 1 ? null : 'Please enter your business name.'
    },
    {
      mood: 's-happy',  pos: 'left',
      blastyMsgFn: () => 'And what\'s your name?',
      inputType: 'text',
      key: 'ownerName',
      placeholder: 'e.g. Dave',
      hint: 'Your first name, or full name — your call',
      validate: v => v.trim().length >= 1 ? null : 'Please enter your name.',
      toggle: { stateKey: 'ynMentionName', label: 'Include my name in marketing copy' }
    },
    {
      mood: 's-ask',    pos: 'right',
      blastyMsgFn: a => 'Great, ' + (a.ownerName || 'you') + '! What\'s your title at ' + a.bizName + '?',
      inputType: 'text',
      key: 'role',
      placeholder: 'e.g. Owner, Marketing Director, GM',
      hint: 'How you\'d introduce yourself to a customer',
      validate: v => v.trim().length >= 1 ? null : 'Please enter your title.',
      toggle: { stateKey: 'ynMentionRole', label: 'Include my title in marketing copy' }
    },
    {
      mood: 's-happy',  pos: 'left',
      blastyMsgFn: a => 'Perfect. What\'s the best phone number for ' + a.bizName + '?',
      inputType: 'tel',
      key: 'phone',
      placeholder: '(555) 867-5309',
      hint: 'Customers can call or text this number',
      validate: v => v.trim().length >= 7 ? null : 'Please enter a phone number.',
      toggle: { stateKey: 'ynMentionPhone', label: 'Include phone number in marketing copy' }
    },
    {
      mood: 's-ask',    pos: 'right',
      blastyMsgFn: a => 'Got it! Is ' + a.bizName + ' a physical location, online only, or both?',
      inputType: 'choice',
      key: 'locationType',
      choices: [
        { value: 'brick',  label: '🏪  Physical Location' },
        { value: 'online', label: '🌐  Online Only' },
        { value: 'both',   label: '🏪🌐  Both' }
      ],
      validate: v => v ? null : 'Please choose one.'
    },
    {
      mood: 's-ask',    pos: 'left',
      blastyMsgFn: () => 'What\'s the street address?',
      inputType: 'text',
      key: 'street',
      placeholder: 'e.g. 123 Main St',
      hint: 'Street number and street name',
      skipIf: a => a.locationType === 'online',
      validate: v => v.trim().length >= 2 ? null : 'Please enter a street address.',
      toggle: { stateKey: 'ynMentionAddress', label: 'Mention address in marketing copy' }
    },
    {
      mood: 's-happy',  pos: 'right',
      blastyMsgFn: () => 'City?',
      inputType: 'text',
      key: 'city',
      placeholder: 'e.g. Springfield',
      hint: '',
      skipIf: a => a.locationType === 'online',
      validate: v => v.trim().length >= 2 ? null : 'Please enter a city.'
    },
    {
      mood: 's-ask',    pos: 'left',
      blastyMsgFn: () => 'State?',
      inputType: 'text',
      key: 'state',
      placeholder: 'e.g. IL',
      hint: 'Two-letter abbreviation or full name',
      skipIf: a => a.locationType === 'online',
      validate: v => v.trim().length >= 2 ? null : 'Please enter a state.'
    },
    {
      mood: 's-happy',  pos: 'right',
      blastyMsgFn: () => 'ZIP code?',
      inputType: 'text',
      key: 'zip',
      placeholder: 'e.g. 62701',
      hint: '',
      skipIf: a => a.locationType === 'online',
      validate: v => /^\d{5}(-\d{4})?$/.test(v.trim()) ? null : 'Please enter a valid ZIP code.'
    },
    {
      mood: 's-working', pos: 'left',
      blastyMsgFn: a => 'Almost there! What\'s the website for ' + a.bizName + '?',
      inputType: 'url',
      key: 'website',
      placeholder: 'e.g. https://qrgear.com',
      hint: 'Leave blank if you don\'t have one yet — no worries!',
      skipIf: a => a.locationType === 'brick',
      validate: () => null
    },

    /* ══════════════════════════════════════════════════════════
       PHASE 2 — Fork: memory explanation + path choice
    ══════════════════════════════════════════════════════════ */
    {
      mood: 's-celebrate', pos: 'right',
      blastyMsg: "You're set up! Quick note — I use two kinds of memory. 📖 Your Story is what I always know about you: your vibe, what makes you different, your ideal customer. Every campaign gets sharper the more I know you. 🚀 Campaign memory is specific to one blast — the offer, goal, and audience. Want to blast right now, or tell me your story first?",
      inputType: 'choice',
      key: '_fork',
      choices: [
        { value: 'blast', label: '🚀 Let\'s blast!' },
        { value: 'story', label: '💬 Tell me your story first' }
      ],
      validate: v => v ? null : 'Pick one!'
    },

    /* ══════════════════════════════════════════════════════════
       PHASE 2B — Story questions (skip if blast chosen)
    ══════════════════════════════════════════════════════════ */
    {
      mood: 's-ask', pos: 'left',
      blastyMsgFn: a => 'Love it! How did ' + a.bizName + ' get started? What\'s the story?',
      inputType: 'textarea',
      key: 'story',
      placeholder: 'e.g. We opened in 1987 after my father emigrated from Mexico with nothing but a family recipe and a dream...',
      hint: 'As much or as little as you like',
      skipIf: a => a._fork === 'blast',
      validate: () => null
    },
    {
      mood: 's-happy', pos: 'right',
      blastyMsgFn: a => 'Good stuff! What makes ' + a.bizName + ' different from the competition?',
      inputType: 'textarea',
      key: 'different',
      placeholder: 'e.g. Everything is made from scratch daily. Our head chef trained in Lyon for 3 years...',
      hint: 'Why should someone choose you?',
      skipIf: a => a._fork === 'blast',
      validate: () => null
    },
    {
      mood: 's-ask', pos: 'left',
      blastyMsg: 'Any awards, press coverage, or milestones worth mentioning?',
      inputType: 'textarea',
      key: 'awards',
      placeholder: 'e.g. Best Pizza 3 years running. Featured in the Tribune. 4.9 stars across 600+ reviews...',
      hint: 'Leave blank if none — totally fine!',
      skipIf: a => a._fork === 'blast',
      validate: () => null
    },
    {
      mood: 's-happy', pos: 'right',
      blastyMsgFn: a => 'Who\'s your ideal customer for ' + a.bizName + '?',
      inputType: 'textarea',
      key: 'customer',
      placeholder: 'e.g. Homeowners aged 35–60 who value quality over price and have been burned by cheap contractors before...',
      hint: 'Who gets the most value from what you do?',
      skipIf: a => a._fork === 'blast',
      validate: () => null
    },
    {
      mood: 's-ask', pos: 'left',
      blastyMsg: 'Anything else I should always know about your business?',
      inputType: 'textarea',
      key: 'other',
      placeholder: 'e.g. Free estimates. Loyalty program. Family-owned since 1995. We sponsor the local little league...',
      hint: 'Special services, team, community involvement — anything',
      skipIf: a => a._fork === 'blast',
      validate: () => null
    },

    /* ══════════════════════════════════════════════════════════
       PHASE 2A — Campaign questions (always run)
    ══════════════════════════════════════════════════════════ */
    {
      mood: 's-working', pos: 'right',
      blastyMsgFn: a => (a._fork === 'story' ? 'Perfect — I know you so much better now! ' : '') + 'Let\'s build your first campaign. What do you want to call it?',
      inputType: 'text',
      key: 'campaignName',
      placeholder: 'e.g. Summer Sale, Grand Opening, New Menu Drop',
      validate: v => v.trim().length >= 1 ? null : 'Give this campaign a name!'
    },
    {
      mood: 's-ask', pos: 'left',
      blastyMsg: 'What\'s this campaign about? What are you promoting?',
      inputType: 'textarea',
      key: 'campaignAbout',
      placeholder: 'e.g. Grand reopening after renovations. New fall menu just dropped. Announcing our second location...',
      hint: 'The more detail, the better the copy',
      validate: v => v.trim().length >= 3 ? null : 'Tell me a bit more!'
    },
    {
      mood: 's-happy', pos: 'right',
      blastyMsg: 'Who is this campaign targeting?',
      inputType: 'textarea',
      key: 'campaignAudience',
      placeholder: 'e.g. Local families, young professionals, pet owners in the area...',
      hint: 'Who do you want to reach with this one?',
      validate: v => v.trim().length >= 3 ? null : 'Tell me about your audience!'
    },
    {
      mood: 's-ask', pos: 'left',
      blastyMsg: 'Any special offer or call to action for this campaign?',
      inputType: 'textarea',
      key: 'campaignOffer',
      placeholder: 'e.g. 20% off this weekend only · Free consultation · Book now and save $50...',
      hint: 'Leave blank for pure awareness — totally fine!',
      validate: () => null
    },
    {
      mood: 's-working', pos: 'right',
      blastyMsg: 'Last one — which platforms do you want to blast on?',
      inputType: 'multiselect',
      key: 'campaignPlatforms',
      choices: [
        { value: 'google_business', label: '📍 Google Business' },
        { value: 'facebook_page',   label: '📘 Facebook Page' },
        { value: 'instagram',       label: '📸 Instagram',  proOnly: true },
        { value: 'twitter',         label: '𝕏 Twitter / X', proOnly: true },
        { value: 'linkedin',        label: '💼 LinkedIn',    proOnly: true }
      ],
      validate: v => (v && v.length) ? null : 'Pick at least one platform!'
    },
    {
      mood: 's-working', pos: 'left',
      blastyMsgFn: a => 'Almost done! Let me figure out the right <strong>category</strong> for ' + a.bizName + ' — the right one gets you found on every platform...',
      inputType: 'ai-suggest',
      key: 'category',
      fetchFn: async a => {
        const res = await fetch('https://us-central1-blastybiz-9523e.cloudfunctions.net/suggestCategory', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ bizName: a.bizName })
        });
        const data = await res.json();
        return data.category || 'Local Business';
      }
    }
  ];

  const MOOD_CAPTIONS = {
    's-wave':      'Hey there! 👋',
    's-ask':       'Tell me more...',
    's-happy':     'Looking good! 🎉',
    's-working':   'On it...',
    's-celebrate': 'Let\'s blast! 🚀'
  };

  function setMood(mood) {
    const el = document.getElementById('pb-blasty');
    /* strip all classes → force reflow → re-apply so animations restart fresh */
    el.className = 'pb-blasty s-arrive';
    void el.offsetWidth;
    el.className = 'pb-blasty s-arrive ' + mood;
    /* after arrival pop finishes, drop s-arrive so it doesn't fight the mood */
    setTimeout(() => {
      if (el.className.includes(mood)) el.className = 'pb-blasty ' + mood;
    }, 500);
    const cap = document.getElementById('pb-blasty-caption');
    if (cap) cap.textContent = MOOD_CAPTIONS[mood] || '';
  }

  function setPosition(pos) {
    const zone = document.getElementById('pb-blasty-zone');
    if (!zone) return;
    zone.classList.remove('blasty-pos-left', 'blasty-pos-right');
    if (pos) zone.classList.add('blasty-pos-' + pos);
  }

  function _miniBlastySVG(mood) {
    const py = { 's-ask': 204, 's-working': 207, 's-wave': 198, 's-happy': 205, 's-celebrate': 198 }[mood] || 202;
    return `<svg viewBox="0 0 360 460" xmlns="http://www.w3.org/2000/svg">
      <path d="M180 354 C213 385 207 419 180 446 C153 419 147 385 180 354Z" fill="#ff8c1a"/>
      <path d="M103 240 C68 254 46 286 48 327 C74 312 97 298 116 276Z" fill="#ff2f2f" stroke="#102957" stroke-width="9"/>
      <path d="M257 240 C292 254 314 286 312 327 C286 312 263 298 244 276Z" fill="#ff2f2f" stroke="#102957" stroke-width="9"/>
      <path d="M180 42 C117 89 89 163 91 251 C92 309 119 348 180 378 C241 348 268 309 269 251 C271 163 243 89 180 42Z" fill="#f0f6ff" stroke="#102957" stroke-width="10"/>
      <path d="M93 269 C121 289 148 299 180 299 C212 299 239 289 267 269 L265 301 C239 319 211 327 180 327 C149 327 121 319 95 301Z" fill="#49bf24" stroke="#102957" stroke-width="8"/>
      <path d="M180 42 C151 64 129 88 113 116 C137 105 157 100 180 100 C203 100 223 105 247 116 C231 88 209 64 180 42Z" fill="#ff2f2f" stroke="#102957" stroke-width="9"/>
      <ellipse cx="145" cy="196" rx="29" ry="37" fill="#fff" stroke="#102957" stroke-width="7"/>
      <ellipse cx="148" cy="${py-2}" rx="16" ry="22" fill="#49d834"/>
      <ellipse cx="151" cy="${py}" rx="8" ry="13" fill="#071329"/>
      <circle cx="143" cy="190" r="5" fill="#fff"/>
      <ellipse cx="215" cy="196" rx="29" ry="37" fill="#fff" stroke="#102957" stroke-width="7"/>
      <ellipse cx="212" cy="${py-2}" rx="16" ry="22" fill="#49d834"/>
      <ellipse cx="209" cy="${py}" rx="8" ry="13" fill="#071329"/>
      <circle cx="204" cy="190" r="5" fill="#fff"/>
      <ellipse cx="121" cy="244" rx="15" ry="8" fill="#ff7272" opacity=".55"/>
      <ellipse cx="239" cy="244" rx="15" ry="8" fill="#ff7272" opacity=".55"/>
      <path d="M155 248 Q180 265 205 248" stroke="#102957" stroke-width="9" fill="none" stroke-linecap="round"/>
    </svg>`;
  }

  function addBlastyBubble(text) {
    const thread = document.getElementById('pb-thread');
    const currentMood = (document.getElementById('pb-blasty') || {}).className || '';
    const mood = ['s-wave','s-happy','s-ask','s-working','s-celebrate'].find(m => currentMood.includes(m)) || 's-ask';
    const row = document.createElement('div');
    row.className = 'blasty-msg-row';
    const avatar = document.createElement('div');
    avatar.className = 'blasty-msg-avatar';
    avatar.innerHTML = _miniBlastySVG(mood);
    const el = document.createElement('div');
    el.className = 'bubble-blasty';
    el.innerHTML = text;
    row.appendChild(avatar);
    row.appendChild(el);
    thread.appendChild(row);
    setTimeout(() => row.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 60);
    return el;
  }

  function addUserBubble(id) {
    const thread = document.getElementById('pb-thread');
    const el = document.createElement('div');
    el.className = 'bubble-user';
    if (id) el.id = id;
    thread.appendChild(el);
    return el;
  }

  function lockBubble(el, text) {
    el.className = 'bubble-user locked';
    el.innerHTML = '';
    el.textContent = text;
  }

  function renderInput(s) {
    const bubble = addUserBubble('ob2-current-bubble');
    let html = '';

    if (s.inputType === 'choice') {
      html += '<div class="ob2-choices" id="ob2-choices">';
      s.choices.forEach(c => {
        html += '<button type="button" class="ob2-choice-btn" data-val="' + c.value + '" onclick="window._ob2PickChoice(this)">' + c.label + '</button>';
      });
      html += '</div>';
      html += '<input type="hidden" id="ob2-input" value=""/>';
    } else if (s.inputType === 'multiselect') {
      const plan = window._ob2Plan || 'trial';
      const isPro = plan === 'pro' || plan === 'agency';
      html += '<div class="ob2-multiselect" id="ob2-multiselect">';
      s.choices.forEach(c => {
        const locked = c.proOnly && !isPro;
        html += '<label class="ob2-ms-label' + (locked ? ' ob2-ms-locked' : '') + '">'
          + '<input type="checkbox" class="ob2-ms-check" value="' + c.value + '"'
          + (locked ? ' disabled' : '') + ' onchange="window._ob2MsChange()"/>'
          + c.label
          + (locked ? ' <span class="ob2-pro-badge">PRO</span>' : '')
          + '</label>';
      });
      html += '</div>';
      html += '<input type="hidden" id="ob2-input" value=""/>';
      html += '<button type="button" class="bubble-action-btn" id="ob2-btn" onclick="window._ob2Continue()">Blast! 🚀</button>';
    } else if (s.inputType === 'ai-suggest') {
      html += '<div id="ob2-ai-suggest-wrap" style="padding:4px 0">'
        + '<div style="color:var(--muted,#888);font-size:13px;display:flex;align-items:center;gap:8px">'
        + '<span style="display:inline-block;animation:spin 1s linear infinite;font-size:16px">⚙️</span> Thinking...</div>'
        + '</div>'
        + '<input type="hidden" id="ob2-input" value=""/>';
    } else if (s.inputType === 'textarea') {
      html += '<textarea id="ob2-input" class="bubble-textarea" placeholder="' + (s.placeholder || '') + '" rows="3"></textarea>';
      if (s.hint) html += '<div class="bubble-hint">' + s.hint + '</div>';
      html += '<button type="button" class="bubble-action-btn" id="ob2-btn" onclick="window._ob2Continue()">Continue →</button>';
    } else {
      html += '<input id="ob2-input" type="' + s.inputType + '" class="bubble-input" placeholder="' + (s.placeholder || '') + '" autocomplete="off"/>';
      if (s.hint) html += '<div class="bubble-hint">' + s.hint + '</div>';
      const toggleDefs = s.toggles || (s.toggle ? [s.toggle] : []);
      toggleDefs.forEach((t, i) => {
        html += '<div class="toggle-row">'
              + '<span class="toggle-label">' + t.label + '</span>'
              + '<label class="toggle-switch">'
              + '<input type="checkbox" id="ob2-toggle-' + i + '"' + (toggles[t.stateKey] ? ' checked' : '')
              + ' onchange="window._ob2ToggleChange(\'' + t.stateKey + '\',this.checked)"/>'
              + '<span class="toggle-slider"></span>'
              + '</label>'
              + '</div>';
      });
      html += '<button type="button" class="bubble-action-btn" id="ob2-btn" onclick="window._ob2Continue()">Continue →</button>';
    }

    html += '<div class="pb-err" id="ob2-err"></div>';
    bubble.innerHTML = html;

    const inp = document.getElementById('ob2-input');
    if (inp && s.inputType !== 'choice') {
      inp.focus();
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') window._ob2Continue(); });
    }
    setTimeout(() => bubble.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 80);
  }

  function showStep() {
    if (step >= STEPS.length) { finish(); return; }
    const s = STEPS[step];
    if (s.skipIf && s.skipIf(answers)) { step++; showStep(); return; }
    setMood(s.mood);
    setPosition(s.pos || 'right');
    const delay = step === 0 ? 700 : 440;
    setTimeout(() => {
      const msg = s.blastyMsgFn ? s.blastyMsgFn(answers) : s.blastyMsg;
      addBlastyBubble(msg);
      setTimeout(() => {
        renderInput(s);
        /* ── AI-suggest: fire fetch after bubble renders ── */
        if (s.inputType === 'ai-suggest' && s.fetchFn) {
          s.fetchFn(answers)
            .then(suggestion => {
              const wrap = document.getElementById('ob2-ai-suggest-wrap');
              if (!wrap) return;
              /* Blasty states the category confidently, then user confirms or fixes */
              setMood('s-happy');
              setTimeout(() => {
                addBlastyBubble('The best category for ' + answers.bizName + ' on the platforms is <strong>' + suggestion + '</strong> — does that sound right?');
                const safe = suggestion.replace(/'/g, "\\'");
                wrap.innerHTML =
                  '<div class="ob2-choices">'
                  + '<button type="button" class="ob2-choice-btn" onclick="window._ob2AcceptSuggestion(\'' + safe + '\')">✅ Yep, that\'s it</button>'
                  + '<button type="button" class="ob2-choice-btn" onclick="window._ob2ChangeSuggestion()">✏️ Not quite</button>'
                  + '</div>';
              }, 200);
            })
            .catch(() => { window._ob2ChangeSuggestion(); });
        }
      }, 320);
    }, delay);
  }

  window._ob2AcceptSuggestion = function(value) {
    answers[STEPS[step].key] = value;
    const bubble = document.getElementById('ob2-current-bubble');
    if (bubble) lockBubble(bubble, value);
    step++;
    setTimeout(showStep, 380);
  };

  window._ob2ChangeSuggestion = function() {
    const wrap = document.getElementById('ob2-ai-suggest-wrap');
    if (!wrap) return;
    wrap.innerHTML =
      '<input id="ob2-input-cat" type="text" class="bubble-input" placeholder="e.g. Hair Salon, Mexican Restaurant..." autocomplete="off"/>'
      + '<button type="button" class="bubble-action-btn" style="margin-top:8px" '
      + 'onclick="window._ob2AcceptSuggestion(document.getElementById(\'ob2-input-cat\').value.trim()||\'Local Business\')">Looks good →</button>';
    const inp = document.getElementById('ob2-input-cat');
    if (inp) { inp.focus(); inp.addEventListener('keydown', e => { if (e.key === 'Enter') window._ob2AcceptSuggestion(inp.value.trim() || 'Local Business'); }); }
  };

  window._ob2MsChange = function() {
    const checked = [...document.querySelectorAll('.ob2-ms-check:checked')].map(c => c.value);
    const inp = document.getElementById('ob2-input');
    if (inp) inp.value = checked.join(',');
  };

  window._ob2ToggleChange = function(stateKey, checked) {
    toggles[stateKey] = checked;
  };

  window._ob2PickChoice = function(btn) {
    document.querySelectorAll('.ob2-choice-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    document.getElementById('ob2-input').value = btn.dataset.val;
    const errEl = document.getElementById('ob2-err');
    if (errEl) errEl.style.display = 'none';
    setTimeout(() => window._ob2Continue(), 220);
  };

  window._ob2Continue = function() {
    const s = STEPS[step];
    const inp = document.getElementById('ob2-input');
    const val = inp ? inp.value : '';
    const errEl = document.getElementById('ob2-err');
    if (s.validate) {
      const err = s.validate(val);
      if (err) { errEl.textContent = err; errEl.style.display = 'block'; return; }
    }
    if (s.inputType === 'multiselect') {
      answers[s.key] = val.split(',').filter(Boolean);
      const bubble = document.getElementById('ob2-current-bubble');
      if (bubble) lockBubble(bubble, answers[s.key].join(', ') || '(none selected)');
    } else {
      answers[s.key] = val.trim();
      const bubble = document.getElementById('ob2-current-bubble');
      if (bubble) lockBubble(bubble, val.trim());
    }
    step++;
    setTimeout(showStep, 380);
  };

  async function finish() {
    setMood('s-working');
    setPosition('right');
    setTimeout(() => {
      addBlastyBubble("On it! Saving everything and firing up your first blast... 🚀");
    }, 440);
    try {
      const { bizId, campId } = await window._ob2Save(answers, toggles);
      // #2 Post-onboarding summary — show "Here's what we built" before redirect
      const safeBizName = (answers.bizName || 'Your business').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      setTimeout(() => {
        addBlastyBubble(
          "Here's what we just built: <strong>" + safeBizName + "</strong> is set up with your first campaign ready to go. " +
          "AI is about to generate your content — let's launch! 🚀"
        );
        setTimeout(() => {
          window.location.href = 'BlastyBiz.html?bizId=' + bizId + '&cid=' + campId + '&autogenerate=1';
        }, 2400);
      }, 600);
    } catch (e) {
      console.error('[ob2 save]', e);
      addBlastyBubble("Something went wrong saving — let's try again.");
      setMood('s-ask');
      const retryBtn = document.createElement('button');
      retryBtn.textContent = '↩ Try again';
      retryBtn.style.cssText = 'margin:10px auto;display:block;padding:10px 24px;background:#ff6b00;color:#fff;border:none;border-radius:8px;font-size:15px;cursor:pointer;';
      retryBtn.onclick = () => { retryBtn.remove(); finish(); };
      document.getElementById('ob2-thread')?.appendChild(retryBtn);
    }
  }

  window._ob2StartConvo = function() { showStep(); };
  if (window._ob2Ready) window._ob2StartConvo();
})();
</script>

<!-- ── Firebase ───────────────────────────────────────────────────── -->
<script type="module">
import { auth } from './firebase-init-v2.js';
import {
  isSignInWithEmailLink,
  signInWithEmailLink,
  onAuthStateChanged
} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import {
  getFirestore, doc, getDoc, setDoc, collection, serverTimestamp, writeBatch
} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
import { getApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';

const db = getFirestore(getApp());

window._ob2Save = async function(answers, toggles) {
  const bizRef = doc(collection(db, 'users', window._ob2Uid, 'businesses'));
  const bizId  = bizRef.id;
  const campId = 'c_' + Date.now();

  const campaignStory = [
    answers.campaignAbout    ? 'About this campaign: ' + answers.campaignAbout    : '',
    answers.campaignAudience ? 'Target audience: '     + answers.campaignAudience : ''
  ].filter(Boolean).join('\n');

  const batch = writeBatch(db);

  /* ── Business document — canonical schema ─────────────────── */
  batch.set(bizRef, {
    name:               answers.bizName      || '',
    businessName:       answers.bizName      || '',
    category:           answers.category     || '',
    ownerName:          answers.ownerName    || '',
    ownerRole:          answers.role         || '',
    phone:              answers.phone        || '',
    street:             answers.street       || '',
    city:               answers.city         || '',
    state:              answers.state        || '',
    zip:                answers.zip          || '',
    website:            answers.website      || '',
    locationType:       answers.locationType || '',
    ynMentionName:      toggles.ynMentionName    ? 'yes' : 'no',
    ynMentionRole:      toggles.ynMentionRole    ? 'yes' : 'no',
    ynMentionAddress:   toggles.ynMentionAddress ? 'yes' : 'no',
    ynMentionPhone:     toggles.ynMentionPhone   ? 'yes' : 'no',
    ynMentionWebsite:   'yes',
    ynMentionEmail:     'yes',
    aiContext: {
      story:     answers.story     || '',
      different: answers.different || '',
      awards:    answers.awards    || '',
      customer:  answers.customer  || '',
      other:     answers.other     || '',
    },
    createdAt: serverTimestamp()
  });

  /* ── Mark user as onboarded (all three docs or none) ─────── */
  batch.set(doc(db, 'users', window._ob2Uid), {
    onboarded:           true,
    activeBusiness:      bizId,
    onboardingVersion:   1,
    onboardingCompleted: serverTimestamp()
  }, { merge: true });

  /* ── First campaign document ──────────────────────────────── */
  batch.set(
    doc(db, 'users', window._ob2Uid, 'businesses', bizId, 'campaigns', campId),
    {
      id:                  campId,
      name:                answers.campaignName || 'My First Campaign',
      offer:               answers.campaignOffer || '',
      campaignStory,
      onboardingPlatforms: Array.isArray(answers.campaignPlatforms) ? answers.campaignPlatforms : [],
      createdAt:           serverTimestamp(),
      lastUsedAt:          '',
      photos:              [],
      adName:              '',
      price:               '',
      factoids:            [],
      platformHistory:     {}
    }
  );

  /* ── Atomic commit — all three or none ────────────────────── */
  await batch.commit();

  return { bizId, campId };
};

function _ready(uid, name, plan) {
  window._ob2Uid   = uid;
  window._ob2Name  = name || '';
  window._ob2Plan  = plan || 'trial';
  window._ob2Ready = true;
  if (window._ob2StartConvo) window._ob2StartConvo();
}

if (isSignInWithEmailLink(auth, window.location.href)) {
  const email = localStorage.getItem('bb_trial_email') || prompt('Please confirm your email address:') || '';
  const name  = localStorage.getItem('bb_trial_name')  || '';
  localStorage.removeItem('bb_trial_email');
  localStorage.removeItem('bb_trial_name');
  if (email) {
    signInWithEmailLink(auth, email, window.location.href)
      .then(async result => {
        await setDoc(doc(db, 'users', result.user.uid), {
          plan: 'trial', displayName: name, email, createdAt: serverTimestamp()
        }, { merge: true });
        const clean = new URL(window.location.href);
        ['oobCode','apiKey','mode','lang'].forEach(p => clean.searchParams.delete(p));
        history.replaceState(null, '', clean.toString());
        _ready(result.user.uid, name, 'trial');
      })
      .catch(() => { window.location.href = 'BlastyBiz-Trial.html'; });
  } else {
    window.location.href = 'BlastyBiz-Trial.html';
  }
} else {
  onAuthStateChanged(auth, async user => {
    if (!user) { window.location.href = 'BlastyBiz-Trial.html'; return; }
    const userSnap = await getDoc(doc(db, 'users', user.uid));
    const ud = userSnap.exists() ? userSnap.data() : {};
    if (ud.onboarded && ud.onboardingVersion && ud.activeBusiness) {
      window.location.href = 'BlastyBiz.html';
      return;
    }
    const plan = ud.plan || 'trial';
    _ready(user.uid, user.displayName || '', plan);
  });
}
</script>

fetch('blastybiz-header.html')
  .then(r => r.text())
  .then(html => { document.getElementById('header__inject').innerHTML = html; });
</script>
