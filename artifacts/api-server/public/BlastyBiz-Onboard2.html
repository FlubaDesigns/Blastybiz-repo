<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <meta name="description" content="Set up your BlastyBiz business profile."/>
  <link rel="stylesheet" href="global-style.css?v=1784658571123"/>
  <title>BlastyBiz — Your Business</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700&display=swap" rel="stylesheet"/>
  <script src="blastybiz-menu.js?v=3"></script>
  <style>
    /* ─── OB2 NEW LAYOUT ─────────────────────────────────────── */
    .ob-page {
      display: flex;
      flex-direction: row;
      min-height: calc(100vh - var(--main-offset, 55px));
    }
    /* Left: Blasty sticky column */
    .ob-blasty-col {
      width: 228px;
      min-width: 228px;
      position: sticky;
      top: var(--main-offset, 55px);
      height: calc(100vh - var(--main-offset, 55px));
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 14px 20px;
      border-right: 1px solid rgba(255,255,255,.07);
      box-sizing: border-box;
      overflow: hidden;
    }
    .pb-mascot { width: 190px; flex-shrink: 0; }
    #mascot-svg { width: 100%; height: auto; overflow: visible; }
    .pb-mascot-caption {
      font-size: 11px;
      color: var(--muted, #555);
      margin-top: 5px;
      text-align: center;
      font-style: italic;
      min-height: 15px;
    }
    /* Blasty question bubble */
    .ob-q-bubble {
      position: relative;
      background: linear-gradient(168deg, #ffffff 0%, #f0f5ff 70%, #e6eeff 100%);
      border: 1.5px solid rgba(180,205,240,.55);
      border-radius: 4px 18px 18px 18px;
      padding: 13px 15px;
      margin-top: 14px;
      font-size: 13px;
      line-height: 1.58;
      color: #0d1f3c;
      box-shadow: 0 6px 22px rgba(0,0,0,.32);
      width: 100%;
      box-sizing: border-box;
      transition: opacity .2s;
    }
    .ob-q-bubble::before {
      content: '';
      position: absolute;
      top: -9px;
      left: 20px;
      border: 9px solid transparent;
      border-bottom-color: #f0f5ff;
      border-top: none;
    }
    @keyframes bb-in {
      from { opacity: 0; transform: translateY(9px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    /* Right: Form column */
    .ob-form-col {
      flex: 1;
      min-width: 0;
      overflow-y: auto;
      padding: 28px 36px 80px;
      box-sizing: border-box;
      background: var(--bg, #000);
    }
    /* Progress bar */
    .ob-progress-wrap {
      height: 4px;
      background: rgba(255,255,255,.07);
      border-radius: 2px;
      margin-bottom: 28px;
      overflow: hidden;
    }
    .ob-progress-bar {
      height: 100%;
      background: var(--green, #39ff14);
      border-radius: 2px;
      transition: width .5s ease;
    }
    /* Form sections */
    .obf-section { margin-bottom: 14px; }
    .obf-sec-title {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--muted, #666);
      margin-bottom: 6px;
      padding-bottom: 5px;
      border-bottom: 1px solid rgba(255,255,255,.06);
    }
    /* Field rows */
    .obf-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid transparent;
      transition: opacity .35s ease, background .35s ease;
    }
    .obf-row.future  { opacity: .2; pointer-events: none; }
    .obf-row.answered { opacity: .62; }
    .obf-row.active {
      opacity: 1;
      background: rgba(57,255,20,.032);
      border-color: rgba(57,255,20,.11);
      margin: 2px -10px;
      padding: 14px 10px;
    }
    .obf-label {
      font-size: 10.5px;
      font-weight: 700;
      color: var(--muted, #888);
      text-transform: uppercase;
      letter-spacing: .07em;
      min-width: 96px;
      flex-shrink: 0;
      padding-top: 10px;
      line-height: 1.4;
    }
    .obf-slot { flex: 1; min-width: 0; }
    .obf-dash { color: var(--muted, #444); font-size: 14px; line-height: 2.8; }
    .obf-answered-val {
      font-size: 14px;
      color: var(--text, #c8dbf5);
      word-break: break-word;
      line-height: 1.5;
      padding: 7px 0;
      display: block;
    }
    /* User speech bubble (in active slot) — tail points RIGHT (away from Blasty on the left) */
    .obf-bubble {
      position: relative;
      background: #0c1828;
      border: 1.5px solid rgba(57,255,20,.2);
      border-radius: 4px 16px 16px 16px;
      padding: 12px 14px 10px;
      box-shadow: 0 4px 18px rgba(0,0,0,.3);
    }
    .obf-bubble::after {
      content: '';
      position: absolute;
      top: 14px;
      right: -9px;
      border: 9px solid transparent;
      border-left-color: #0c1828;
      border-right: none;
    }
    /* Fork step prompt */
    .ob-fork-prompt {
      background: rgba(57,255,20,.038);
      border: 1px solid rgba(57,255,20,.14);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 18px;
    }
    .ob-fork-prompt .ob2-choices { flex-direction: row; flex-wrap: wrap; }
    .ob-fork-prompt .ob2-choice-btn { width: auto; flex: 1; min-width: 150px; }
    /* Status (finish messages) */
    .ob-status {
      padding: 24px;
      text-align: center;
      color: var(--text, #e0ecff);
      font-size: 15px;
      line-height: 1.7;
    }
    .ob-status p { margin: 8px 0; }
    /* Flash on commit (mobile) */
    @keyframes ob-flash {
      0%   { background: rgba(57,255,20,.26); }
      100% { background: transparent; }
    }
    .obf-row.just-answered { animation: ob-flash .65s ease; }
    /* Mobile: stacked layout */
    @media (max-width: 860px) {
      .ob-page { flex-direction: column; }
      .ob-blasty-col {
        width: 100%; min-width: unset; position: static; height: auto;
        flex-direction: row; align-items: flex-start;
        padding: 10px 14px; border-right: none;
        border-bottom: 1px solid rgba(255,255,255,.07);
        gap: 12px; overflow: visible;
      }
      .pb-mascot { width: 64px; flex-shrink: 0; }
      .ob-q-bubble {
        margin-top: 0; font-size: 12.5px; flex: 1; min-width: 0;
        border-radius: 4px 14px 14px 14px; max-width: unset;
      }
      .ob-q-bubble::before {
        top: 12px; left: -9px;
        border: 9px solid transparent;
        border-right-color: #f0f5ff;
        border-top: none; border-bottom: none;
      }
      .ob-form-col { padding: 16px 14px 80px; overflow: visible; }
      .obf-label { min-width: 80px; font-size: 10px; }
      .obf-bubble::after { display: none; }
    }
    .bubble-input {
      display: block;
      width: 100%;
      box-sizing: border-box;
      background: var(--panel, #111);
      border: 1.5px solid var(--border, #222);
      border-radius: 8px;
      padding: 11px 14px;
      font-size: 15px;
      color: var(--light, #fff);
      font-family: 'DM Sans', sans-serif;
      outline: none;
      transition: border-color .18s;
    }
    .bubble-input:focus { border-color: var(--green); }
    .bubble-input::placeholder { color: var(--muted, #555); }

    .bubble-hint {
      font-size: 12px;
      color: var(--muted, #555);
      margin-top: 7px;
    }
    .bubble-action-btn {
      display: block;
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      background: var(--green);
      color: #000;
      font-weight: 700;
      font-size: 14px;
      border: none;
      border-radius: 9px;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: opacity .18s, transform .1s;
    }
    .bubble-action-btn:hover  { opacity: .88; }
    .bubble-action-btn:active { transform: scale(.98); }
    .bubble-action-btn:disabled { opacity: .42; cursor: not-allowed; }

    .pb-err {
      font-size: 13px;
      color: #e57373;
      margin-top: 7px;
      display: none;
    }

    /* ── Toggle switch ──────────────────────────────────────────── */
    .toggle-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 11px;
      padding: 9px 12px;
      background: rgba(255,255,255,.04);
      border-radius: 8px;
    }
    .toggle-label {
      font-size: 13px;
      color: var(--muted, #888);
      flex: 1;
      line-height: 1.4;
    }
    .toggle-switch {
      position: relative;
      width: 42px;
      height: 24px;
      flex-shrink: 0;
    }
    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
      position: absolute;
    }
    .toggle-slider {
      position: absolute;
      inset: 0;
      background: #333;
      border-radius: 24px;
      cursor: pointer;
      transition: background .2s;
    }
    .toggle-slider::before {
      content: '';
      position: absolute;
      width: 18px;
      height: 18px;
      left: 3px;
      top: 3px;
      background: white;
      border-radius: 50%;
      transition: transform .2s;
    }
    .toggle-switch input:checked + .toggle-slider { background: var(--green); }
    .toggle-switch input:checked + .toggle-slider::before { transform: translateX(18px); }

    /* ── Blasty animations ──────────────────────────────────────── */
    #mascot-svg {
      transform-box: fill-box;
      transform-origin: bottom center;
    }
    .pb-mascot.s-arrive #mascot-svg {
      animation: b-arrive .45s cubic-bezier(.34,1.56,.64,1) both;
    }
    @keyframes b-arrive {
      0%   { transform: scale(0.6) translateY(18px); opacity: 0; }
      100% { transform: scale(1)   translateY(0);    opacity: 1; }
    }

    /* Idle float — whole rocket */
    #mascot-body {
      transform-box: fill-box;
      transform-origin: bottom center;
      animation: b-float 3.2s ease-in-out infinite;
    }
    @keyframes b-float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-11px); }
    }

    /* Flame pulse */
    .flame {
      transform-box: fill-box;
      transform-origin: top center;
      animation: b-flame-pulse 0.5s ease-in-out infinite;
    }
    @keyframes b-flame-pulse {
      0%, 100% { transform: scaleY(1)   scaleX(1); }
      50%       { transform: scaleY(1.35) scaleX(0.8); }
    }

    /* Mouth variants — default happy visible, rest hidden */
    .mouth-working, .mouth-celebrate, .mouth-ask { opacity: 0 !important; }
    .pb-mascot.s-working  .mouth-happy    { opacity: 0 !important; }
    .pb-mascot.s-working  .mouth-working  { opacity: 1 !important; }
    .pb-mascot.s-celebrate .mouth-happy   { opacity: 0 !important; }
    .pb-mascot.s-celebrate .mouth-celebrate { opacity: 1 !important; }
    .pb-mascot.s-ask      .mouth-happy    { opacity: 0 !important; }
    .pb-mascot.s-ask      .mouth-ask      { opacity: 1 !important; }

    /* Arms — all hidden by default, CSS shows per mood */
    .mascot-arm { transition: opacity .25s ease; }
    .pb-mascot.s-wave    .mascot-arm-wave  { opacity: 1 !important; }
    .pb-mascot.s-working .mascot-arm-point { opacity: 1 !important; }

    /* ── s-wave ──────────────────────────────────────────────────── */
    .pb-mascot.s-wave #mascot-body {
      animation: b-wave .55s ease-in-out 4, b-float 3.2s ease-in-out infinite 2.2s;
    }
    @keyframes b-wave {
      0%, 100% { transform: rotate(0deg)   translateY(0); }
      25%       { transform: rotate(-22deg) translateY(-8px); }
      65%       { transform: rotate(16deg)  translateY(-4px); }
    }
    .pb-mascot.s-wave .pupil-group-l { transform: scale(1.1) translateY(-3px); }
    .pb-mascot.s-wave .pupil-group-r { transform: scale(1.1) translateY(-3px); }

    /* ── s-happy ─────────────────────────────────────────────────── */
    .pb-mascot.s-happy #mascot-body {
      animation: b-bounce .4s ease-in-out 3, b-float 3.2s ease-in-out infinite 1.2s;
    }
    @keyframes b-bounce {
      0%   { transform: translateY(0)     scale(1,1); }
      35%  { transform: translateY(-28px) scale(0.9,1.15); }
      65%  { transform: translateY(-22px) scale(0.9,1.15); }
      85%  { transform: translateY(4px)   scale(1.12,0.88); }
      100% { transform: translateY(0)     scale(1,1); }
    }
    .pb-mascot.s-happy .pupil-group-l { transform: translateY(4px) scaleY(0.75); }
    .pb-mascot.s-happy .pupil-group-r { transform: translateY(4px) scaleY(0.75); }

    /* ── s-ask ───────────────────────────────────────────────────── */
    .pb-mascot.s-ask .pupil-group-l { transform: translateX(-6px) translateY(2px); transition: transform .3s ease; }
    .pb-mascot.s-ask .pupil-group-r { transform: translateX(-6px) translateY(2px); transition: transform .3s ease; }
    .pb-mascot.s-ask #mascot-body   { animation: b-lean 3s ease-in-out infinite; }
    @keyframes b-lean {
      0%, 100% { transform: translateY(0)    rotate(-9deg); }
      50%       { transform: translateY(-10px) rotate(-9deg); }
    }

    /* ── s-working ───────────────────────────────────────────────── */
    .pb-mascot.s-working #mascot-body {
      animation: b-work .65s ease-in-out infinite;
    }
    @keyframes b-work {
      0%, 100% { transform: translateY(0)   rotate(-5deg); }
      25%       { transform: translateY(-9px) rotate(7deg); }
      75%       { transform: translateY(-4px) rotate(-8deg); }
    }
    .pb-mascot.s-working .flame {
      animation: b-flame-work .32s ease-in-out infinite;
    }
    @keyframes b-flame-work {
      0%, 100% { transform: scaleY(1)   scaleX(1); }
      50%       { transform: scaleY(2.1) scaleX(0.65); }
    }
    .pb-mascot.s-working .pupil-group-l { transform: translateY(5px); }
    .pb-mascot.s-working .pupil-group-r { transform: translateY(5px); }

    /* ── s-celebrate ─────────────────────────────────────────────── */
    .pb-mascot.s-celebrate #mascot-body {
      animation: b-celebrate .38s ease-in-out 5;
    }
    @keyframes b-celebrate {
      0%, 100% { transform: translateY(0)    scale(1)    rotate(0deg); }
      25%       { transform: translateY(-30px) scale(1.14) rotate(-8deg); }
      75%       { transform: translateY(-22px) scale(1.14) rotate(8deg); }
    }
    .pb-mascot.s-celebrate .confetti > g {
      transform-box: fill-box;
      transform-origin: center;
      animation: confetti-burst 1.6s ease-out forwards;
    }
    @keyframes confetti-burst {
      0%   { opacity: 1; transform: translateY(0)    scale(1); }
      100% { opacity: 0; transform: translateY(80px) scale(1.8); }
    }

    /* ══════════════════════════════════════════════════════════════
       BLASTY ANIMATION LIBRARY — extended states
    ══════════════════════════════════════════════════════════════ */

    /* ── Flame color system (CSS custom properties) ──────────────── */
    .pb-mascot {
      --flame-top:#ffdc2f; --flame-mid:#ff961f; --flame-bot:#ef3d10;
      --flamein-top:#fffbd7; --flamein-mid:#fff04c; --flamein-bot:#ffac20;
    }
    .pb-mascot.s-flame-blue   { --flame-top:#b3e5fc; --flame-mid:#0288d1; --flame-bot:#01579b; --flamein-top:#e1f5fe; --flamein-mid:#4fc3f7; --flamein-bot:#0288d1; }
    .pb-mascot.s-flame-green  { --flame-top:#b9f6ca; --flame-mid:#00c853; --flame-bot:#1b5e20; --flamein-top:#f1fff1; --flamein-mid:#69f0ae; --flamein-bot:#00c853; }
    .pb-mascot.s-flame-red    { --flame-top:#ff8a80; --flame-mid:#ff1744; --flame-bot:#b71c1c; --flamein-top:#fff;    --flamein-mid:#ff8a80; --flamein-bot:#ff1744; }
    .pb-mascot.s-flame-purple { --flame-top:#ea80fc; --flame-mid:#aa00ff; --flame-bot:#4a148c; --flamein-top:#fce4ff; --flamein-mid:#e040fb; --flamein-bot:#aa00ff; }
    .pb-mascot.s-flame-white  { --flame-top:#ffffff; --flame-mid:#e0f7fa; --flame-bot:#b2ebf2; --flamein-top:#fff;    --flamein-mid:#fff;    --flamein-bot:#e0f7fa; }

    /* ── s-arrive-land: descend from above, settle with bounce ──── */
    .pb-mascot.s-arrive-land #mascot-svg { animation: b-land .7s cubic-bezier(.22,1.4,.64,1) both; }
    @keyframes b-land {
      0%   { transform: translateY(-80px) scale(.8);   opacity: .2; }
      70%  { transform: translateY(8px)   scale(1.04); opacity: 1;  }
      100% { transform: translateY(0)     scale(1);    opacity: 1;  }
    }

    /* ── s-spin: full 360° and settle ───────────────────────────── */
    .pb-mascot.s-spin #mascot-body {
      animation: b-spin-full 1s cubic-bezier(.34,1.56,.64,1) both,
                 b-float 3.2s ease-in-out infinite 1.05s;
    }
    @keyframes b-spin-full {
      0%   { transform: rotate(0deg)   scale(1);   }
      50%  { transform: rotate(200deg) scale(1.1); }
      85%  { transform: rotate(355deg) scale(1);   }
      100% { transform: rotate(360deg) scale(1);   }
    }

    /* ── s-tilt-left / s-tilt-right ─────────────────────────────── */
    .pb-mascot.s-tilt-left #mascot-body  { animation: b-tilt-l 3.2s ease-in-out infinite; }
    @keyframes b-tilt-l {
      0%,100% { transform: rotate(-8deg) translateY(0);    }
      50%      { transform: rotate(-8deg) translateY(-10px); }
    }
    .pb-mascot.s-tilt-right #mascot-body { animation: b-tilt-r 3.2s ease-in-out infinite; }
    @keyframes b-tilt-r {
      0%,100% { transform: rotate(8deg) translateY(0);    }
      50%      { transform: rotate(8deg) translateY(-10px); }
    }

    /* ── s-ask-2: lean right, look right ────────────────────────── */
    .pb-mascot.s-ask-2 .pupil-group-l { transform: translateX(6px) translateY(-2px); }
    .pb-mascot.s-ask-2 .pupil-group-r { transform: translateX(6px) translateY(-2px); }
    .pb-mascot.s-ask-2 #mascot-body   { animation: b-lean-r 3s ease-in-out infinite; }
    @keyframes b-lean-r {
      0%,100% { transform: translateY(0)    rotate(8deg); }
      50%      { transform: translateY(-9px) rotate(8deg); }
    }
    /* ── s-ask-3: look up, slow curious bob ─────────────────────── */
    .pb-mascot.s-ask-3 .pupil-group-l { transform: translateY(-7px); }
    .pb-mascot.s-ask-3 .pupil-group-r { transform: translateY(-7px); }
    .pb-mascot.s-ask-3 #mascot-body   { animation: b-float 2.2s ease-in-out infinite; }

    /* ── s-wave-2: big enthusiastic wave ────────────────────────── */
    .pb-mascot.s-wave-2 .mascot-arm-wave { opacity: 1 !important; }
    .pb-mascot.s-wave-2 #mascot-body {
      animation: b-wave-big .45s ease-in-out 5, b-float 3.2s ease-in-out infinite 2.25s;
    }
    @keyframes b-wave-big {
      0%,100% { transform: rotate(0deg)   translateY(0);    }
      25%      { transform: rotate(-28deg) translateY(-12px); }
      65%      { transform: rotate(20deg)  translateY(-6px);  }
    }
    .pb-mascot.s-wave-2 .pupil-group-l { transform: scale(1.15) translateY(-4px); }
    .pb-mascot.s-wave-2 .pupil-group-r { transform: scale(1.15) translateY(-4px); }

    /* ── Eye states ──────────────────────────────────────────────── */
    .pb-mascot.s-eyes-up    .pupil-group-l, .pb-mascot.s-eyes-up    .pupil-group-r { transform: translateY(-9px); }
    .pb-mascot.s-eyes-down  .pupil-group-l, .pb-mascot.s-eyes-down  .pupil-group-r { transform: translateY(8px);  }
    .pb-mascot.s-eyes-left  .pupil-group-l, .pb-mascot.s-eyes-left  .pupil-group-r { transform: translateX(-9px); }
    .pb-mascot.s-eyes-right .pupil-group-l, .pb-mascot.s-eyes-right .pupil-group-r { transform: translateX(9px);  }

    .pb-mascot.s-eyes-roll .pupil-group-l,
    .pb-mascot.s-eyes-roll .pupil-group-r { animation: b-eye-roll 1.4s ease-in-out 2 both; }
    @keyframes b-eye-roll {
      0%   { transform: translate(0,0);     }
      20%  { transform: translate(8px,-4px);  }
      50%  { transform: translate(0,-10px);   }
      75%  { transform: translate(-8px,-4px); }
      100% { transform: translate(0,0);     }
    }
    .pb-mascot.s-eyes-surprise .pupil-group-l,
    .pb-mascot.s-eyes-surprise .pupil-group-r { animation: b-eye-surprise 1s ease both; }
    @keyframes b-eye-surprise {
      0%   { transform: translateY(0);     }
      15%  { transform: translateY(-12px); }
      65%  { transform: translateY(-12px); }
      100% { transform: translateY(0);     }
    }

    /* ── Nose cone spin ──────────────────────────────────────────── */
    .pb-mascot.s-nose-spin .mascot-nose { animation: b-nose-spin .7s cubic-bezier(.34,1.56,.64,1) 1 both; }
    @keyframes b-nose-spin {
      0%   { transform: rotate(0deg);   }
      55%  { transform: rotate(210deg); }
      100% { transform: rotate(360deg); }
    }
    /* nose variants */
    .pb-mascot.s-nose-shake .mascot-nose { animation:b-nose-shake 1.3s ease-in-out infinite; }
    @keyframes b-nose-shake { 0%,100%{transform:rotate(0deg)} 25%{transform:rotate(-7deg)} 75%{transform:rotate(7deg)} }
    @keyframes b-nose-pop-slow { 0%{transform:translateY(0)} 35%{transform:translateY(-32px)} 100%{transform:translateY(0)} }
    .pb-mascot.s-nose-pop-fast .mascot-nose { animation:b-nose-pop-fast .45s cubic-bezier(.34,1.56,.64,1) 1 both; }
    @keyframes b-nose-pop-fast { 0%{transform:translateY(0)} 40%{transform:translateY(-22px)} 100%{transform:translateY(0)} }

    /* ── Nose beacon light ───────────────────────────────────────── */
    .pb-mascot.s-light-nose #mascot-nose-light { opacity:.9; animation: b-beacon 1.8s ease-in-out infinite; }
    @keyframes b-beacon {
      0%,75%,100% { opacity: .9; }
      40%          { opacity: .1; }
    }

    /* ── Waist lights ────────────────────────────────────────────── */
    .pb-mascot.s-lights-pulse .w-light { animation: b-light-pulse 1.1s ease-in-out infinite; }
    @keyframes b-light-pulse {
      0%,100% { opacity: .9;  }
      50%      { opacity: .15; }
    }
    .pb-mascot.s-lights-sequence .w-light:nth-child(1) { animation: b-light-seq 1.4s 0.0s ease-in-out infinite; }
    .pb-mascot.s-lights-sequence .w-light:nth-child(2) { animation: b-light-seq 1.4s 0.2s ease-in-out infinite; }
    .pb-mascot.s-lights-sequence .w-light:nth-child(3) { animation: b-light-seq 1.4s 0.4s ease-in-out infinite; }
    .pb-mascot.s-lights-sequence .w-light:nth-child(4) { animation: b-light-seq 1.4s 0.6s ease-in-out infinite; }
    .pb-mascot.s-lights-sequence .w-light:nth-child(5) { animation: b-light-seq 1.4s 0.8s ease-in-out infinite; }
    .pb-mascot.s-lights-sequence .w-light:nth-child(6) { animation: b-light-seq 1.4s 1.0s ease-in-out infinite; }
    .pb-mascot.s-lights-sequence .w-light:nth-child(7) { animation: b-light-seq 1.4s 1.2s ease-in-out infinite; }
    @keyframes b-light-seq {
      0%,100% { opacity: .1; }
      50%      { opacity: 1;  }
    }
    .pb-mascot.s-lights-flash .w-light { animation: b-light-flash .28s ease-in-out 6; }
    @keyframes b-light-flash {
      0%,100% { opacity: 0; }
      50%      { opacity: 1; }
    }

    /* ── Smoke puff ──────────────────────────────────────────────── */
    .pb-mascot.s-smoke .smoke-puff {
      animation: b-smoke 1.4s ease-out forwards;
      transform-box: fill-box; transform-origin: center;
    }
    .pb-mascot.s-smoke .smoke-puff:nth-child(1) { animation-delay:  0s; }
    .pb-mascot.s-smoke .smoke-puff:nth-child(2) { animation-delay: .18s; }
    .pb-mascot.s-smoke .smoke-puff:nth-child(3) { animation-delay: .36s; }
    @keyframes b-smoke {
      0%   { opacity: .7; transform: scale(.15) translateY(0);    }
      35%  { opacity: .5; transform: scale(1.5)  translateY(-20px); }
      100% { opacity: 0;  transform: scale(2.8)  translateY(-55px); }
    }
    /* smoke variants */
    .pb-mascot.s-smoke-sm .smoke-puff:nth-child(1) { animation:b-smoke-sm 1.2s ease-out forwards; transform-box:fill-box; transform-origin:center; }
    .pb-mascot.s-smoke-sm .smoke-puff:nth-child(2), .pb-mascot.s-smoke-sm .smoke-puff:nth-child(3) { animation:none; }
    @keyframes b-smoke-sm { 0%{opacity:.7;transform:scale(.15) translateY(0)} 40%{opacity:.5;transform:scale(.9) translateY(-12px)} 100%{opacity:0;transform:scale(1.6) translateY(-30px)} }
    .pb-mascot.s-smoke-lg .smoke-puff:nth-child(1) { animation:b-smoke-lg 1.9s ease-out forwards; transform-box:fill-box; transform-origin:center; }
    .pb-mascot.s-smoke-lg .smoke-puff:nth-child(2), .pb-mascot.s-smoke-lg .smoke-puff:nth-child(3) { animation:none; }
    @keyframes b-smoke-lg { 0%{opacity:.85;transform:scale(.15) translateY(0)} 30%{opacity:.6;transform:scale(2.2) translateY(-22px)} 100%{opacity:0;transform:scale(4.2) translateY(-65px)} }
    .pb-mascot.s-smoke-2 .smoke-puff:nth-child(1) { animation:b-smoke 1.4s ease-out forwards; transform-box:fill-box; transform-origin:center; animation-delay:0s; }
    .pb-mascot.s-smoke-2 .smoke-puff:nth-child(2) { animation:b-smoke 1.4s ease-out forwards; transform-box:fill-box; transform-origin:center; animation-delay:.18s; }
    .pb-mascot.s-smoke-3 .smoke-puff { animation:b-smoke 1.4s ease-out forwards; transform-box:fill-box; transform-origin:center; }
    .pb-mascot.s-smoke-3 .smoke-puff:nth-child(1){animation-delay:0s}
    .pb-mascot.s-smoke-3 .smoke-puff:nth-child(2){animation-delay:.18s}
    .pb-mascot.s-smoke-3 .smoke-puff:nth-child(3){animation-delay:.36s}

    /* ── Per-message mini Blasty avatar ─────────────────────────── */
    .mascot-msg-row {
      display: flex;
      align-items: flex-end;
      align-self: flex-start;   /* LEFT-align — Blasty messages are "incoming" */
      gap: 10px;
      margin-bottom: 4px;
      max-width: 88%;
    }
    .mascot-msg-row .bubble-blasty {
      flex: 1;
      min-width: 0;
      max-width: 100%;
      align-self: auto;
    }
    /* Speech bubble tail — shadow layer (slightly larger, behind) */
    .mascot-msg-row .bubble-blasty::before {
      content: '';
      position: absolute;
      left: -15px;
      bottom: 12px;
      width: 0;
      height: 0;
      border-top: 11px solid transparent;
      border-bottom: 11px solid transparent;
      border-right: 16px solid rgba(0,0,0,0.22);
    }
    /* Speech bubble tail — bright white layer (on top) */
    .mascot-msg-row .bubble-blasty::after {
      content: '';
      position: absolute;
      left: -11px;
      bottom: 14px;
      width: 0;
      height: 0;
      border-top: 9px solid transparent;
      border-bottom: 9px solid transparent;
      border-right: 13px solid #f0f5ff;
    }
    .mascot-msg-avatar {
      width: 48px;
      flex-shrink: 0;
    }
    .mascot-msg-avatar svg { width: 48px; height: auto; display: block; overflow: visible; }

    /* ── Choice buttons ─────────────────────────────────────────── */
    .ob2-choices {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 4px;
    }
    .ob2-choice-btn {
      width: 100%;
      padding: 13px 16px;
      background: var(--panel, #111);
      border: 1.5px solid var(--border, #333);
      border-radius: 10px;
      color: var(--light, #fff);
      font-size: 15px;
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      transition: border-color .18s, background .18s, transform .1s;
    }
    .ob2-choice-btn:hover   { border-color: var(--green); background: rgba(0,200,83,.06); }
    .ob2-choice-btn:active  { transform: scale(.98); }
    /* ── Textarea input ─────────────────────────────────────────── */
    .bubble-textarea {
      width: 100%; min-height: 80px; resize: vertical;
      font-family: inherit; font-size: 15px; line-height: 1.55;
      background: var(--bg-input, #1a1a1a); color: var(--light, #fff);
      border: 1px solid var(--border, #333); border-radius: 10px;
      padding: 10px 12px; box-sizing: border-box; margin-bottom: 2px;
    }
    .bubble-textarea:focus { border-color: var(--green); outline: none; }
    .bubble-textarea::placeholder { color: var(--muted, #555); }

    /* ── Multiselect (platforms) ─────────────────────────────────── */
    .ob2-multiselect { display: flex; flex-direction: column; gap: 10px; margin: 4px 0 8px; }
    .ob2-ms-label {
      display: flex; align-items: center; gap: 10px;
      font-size: 15px; cursor: pointer; padding: 10px 12px;
      background: var(--bg-input, #1a1a1a); border: 1px solid var(--border, #333);
      border-radius: 10px; transition: border-color .2s;
    }
    .ob2-ms-label:hover { border-color: var(--green); }
    .ob2-ms-label input[type=checkbox] { width: 17px; height: 17px; accent-color: var(--green); cursor: pointer; }
    .ob2-ms-locked { opacity: 0.42; cursor: default; }
    .ob2-ms-locked:hover { border-color: var(--border, #333); }
    .ob2-pro-badge {
      font-size: 10px; font-weight: 700; background: var(--green, #39ff14);
      color: #000; border-radius: 4px; padding: 1px 6px; margin-left: auto;
    }

    .ob2-choice-btn.selected {
      border-color: var(--green);
      background: rgba(0,200,83,.14);
      color: var(--green);
      font-weight: 700;
    }

  </style>
</head>

                  ? { mood: moodOrSpec }
                  : (moodOrSpec || { mood: 's-ask' });
    const mood     = spec.mood || 's-ask';
    const merged   = Object.assign({}, DEFAULT_ANIM[mood] || {}, spec);
    const extra = [
      merged.eyes, merged.flame, merged.lights,
      merged.smoke === true ? 's-smoke-3' : (merged.smoke || ''),
      merged.noseSpin === true ? 's-nose-shake' : (merged.noseSpin || '')
    ].filter(Boolean);
    const el = document.getElementById('pb-mascot');
    el.className = 'pb-mascot s-arrive';
    void el.offsetWidth;
    el.className = ['pb-mascot', 's-arrive', mood, ...extra].join(' ');
    setTimeout(() => {
      if (el.className.includes(mood))
        el.className = ['pb-mascot', mood, ...extra].join(' ');

    const cap = document.getElementById('pb-mascot-caption');
    if (cap) cap.textContent = MOOD_CAPTIONS[mood] || '';

  function buildFormRows() {
    const LABELS = {
      ownerName:'Your Name', bizName:'Business Name', role:'Your Title',
      email:'Email', phone:'Phone', locationType:'Location Type',
      street:'Street', city:'City', state:'State', zip:'ZIP', website:'Website',
      story:'Business Story', different:"What's Different",
      awards:'Awards / Press', customer:'Ideal Customer', other:'Other Info',
      campaignName:'Campaign Name', campaignAbout:"What It's About",
      campaignAudience:'Target Audience', campaignOffer:'Offer / CTA',
      campaignPlatforms:'Platforms', category:'Category'
    };
    const SECTIONS = [
      { title:'Business Info', keys:['ownerName','bizName','role','email','phone','locationType','street','city','state','zip','website'] },
      { title:'Your Story', keys:['story','different','awards','customer','other'] },
      { title:'Campaign', keys:['campaignName','campaignAbout','campaignAudience','campaignOffer','campaignPlatforms','category'] }
    ];
    const container = document.getElementById('ob-form-body');
    if (!container) return;
    container.innerHTML = '';
    SECTIONS.forEach(sec => {
      const sd = document.createElement('div');
      sd.className = 'obf-section';
      sd.innerHTML = '<div class="obf-sec-title">'+sec.title+'</div>';
      sec.keys.forEach(key => {
        const row = document.createElement('div');
        row.className = 'obf-row future';
        row.id = 'obfr-'+key;
        row.dataset.key = key;
        row.innerHTML = '<div class="obf-label">'+(LABELS[key]||key)+'</div>'
          +'<div class="obf-slot" id="obfs-'+key+'"><span class="obf-dash">\u2014</span></div>';
        sd.appendChild(row);
      });
      container.appendChild(sd);
    });
  }

  function setBlastyBubble(msg) {
    const el = document.getElementById('ob-q-text');
    if (!el) return;
    const bubble = document.getElementById('ob-q-bubble');
    if (bubble) bubble.style.opacity = '0';
    setTimeout(() => {
      el.innerHTML = msg;
      if (bubble) bubble.style.opacity = '1';
    }, 160);
  }

  function lockField(key, text) {
    const row = document.getElementById('obfr-'+key);
    if (!row) return;
    row.classList.remove('active','future');
    row.classList.add('answered');
    const slot = document.getElementById('obfs-'+key);
    if (slot) {
      const safe = String(text).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      slot.innerHTML = '<span class="obf-answered-val">'+safe+'</span>';
    }
    if (window.innerWidth <= 860) {
      row.classList.add('just-answered');
      setTimeout(() => row.classList.remove('just-answered'), 800);
    }
  }

  function addMascotBubble(msg) {
    setBlastyBubble(msg);
    const status = document.getElementById('ob-status');
    if (status && status.style.display !== 'none') {
      const p = document.createElement('p'); p.innerHTML = msg; status.appendChild(p);
    }
    return { innerHTML: '' };
  }

  function addUserBubble(id) {
    const key = currentStepKey;
    const el = document.createElement('div');
    el.className = key === '_fork' ? 'ob-fork-prompt' : 'obf-bubble';
    if (id) el.id = id;
    if (key && key !== '_fork') {
      const slot = document.getElementById('obfs-'+key);
      if (slot) { slot.innerHTML = ''; slot.appendChild(el); }
    } else if (key === '_fork') {
      const container = document.getElementById('ob-form-body');
      const existing = document.getElementById('ob-fork-prompt');
      if (existing) existing.remove();
      el.id = 'ob-fork-prompt';
      if (container) container.insertBefore(el, container.firstChild);
    }
    return el;
  }

  function lockBubble(el, text) {
    lockField(currentStepKey, text);

  function showStep() {
    if (step >= STEPS.length) { finish(); return; }
    const s = STEPS[step];
    if (s.skipIf && s.skipIf(answers)) { step++; showStep(); return; }
    currentStepKey = s.key;
    setMood(s.anim || s.mood);
    const msg = s.blastyMsgFn ? s.blastyMsgFn(answers) : interpolate(s.blastyMsg, answers);
    setBlastyBubble(msg);
    // Remove stale fork prompt when moving past it
    const fp = document.getElementById('ob-fork-prompt');
    if (fp) fp.remove();
    // Spotlight active field row
    if (s.key !== '_fork') {
      document.querySelectorAll('.obf-row').forEach(r => {
        if (r.id === 'obfr-'+s.key) {
          r.classList.remove('future','answered','just-answered');
          r.classList.add('active');
        } else if (!r.classList.contains('answered')) {
          r.classList.remove('active'); r.classList.add('future');
        } else {
          r.classList.remove('active');
        }
      });
    }
    // Progress bar
    const totalSteps = STEPS.filter(st => !st.skipIf || !st.skipIf(answers)).length;
    const pct = Math.round((step / Math.max(totalSteps, 1)) * 100);
    const bar = document.getElementById('ob-progress-bar');
    if (bar) bar.style.width = pct+'%';
    const delay = step === 0 ? 700 : 380;
    setTimeout(() => {
      renderInput(s);
      if (s.inputType === 'ai-suggest' && s.fetchFn) {
        s.fetchFn(answers)
          .then(suggestion => {
            const wrap = document.getElementById('ob2-ai-suggest-wrap');
            if (!wrap) return;
            setMood('s-happy');
            setTimeout(() => {
              setBlastyBubble('The best category for '+answers.bizName+' on the platforms is <strong>'+suggestion+'</strong> \u2014 does that sound right?');
              const safe = suggestion.replace(/'/g, "\\'");
              wrap.innerHTML = '<div class="ob2-choices">'
                +'<button type="button" class="ob2-choice-btn" onclick="window._ob2AcceptSuggestion(\''+safe+'\')">✅ Yep, that\'s it</button>'
                +'<button type="button" class="ob2-choice-btn" onclick="window._ob2ChangeSuggestion()">✏️ Not quite</button>'
                +'</div>';
            }, 200);
          })
          .catch(() => { window._ob2ChangeSuggestion(); });
      }
    }, delay);
  }
  function renderInput(s) {
    currentBubble = addUserBubble();
    const bubble = currentBubble;
    let html = '';

    if (s.inputType === 'choice') {
      html += '<div class="ob2-choices" id="ob2-choices">';
      s.choices.forEach(c => {
        html += '<button type="button" class="ob2-choice-btn" data-val="' + c.value + '" onclick="window._ob2PickChoice(this)">' + c.label + '</button>';
      });
      html += '</div>';
      html += '<input type="hidden" id="ob2-input" value=""/>';
    } else if (s.inputType === 'multiselect') {
      const plan = window._ob2Plan || 'trial';
      const isPro = plan === 'pro' || plan === 'agency';
      html += '<div class="ob2-multiselect" id="ob2-multiselect">';
      s.choices.forEach(c => {
        const locked = c.proOnly && !isPro;
        html += '<label class="ob2-ms-label' + (locked ? ' ob2-ms-locked' : '') + '">'
          + '<input type="checkbox" class="ob2-ms-check" value="' + c.value + '"'
          + (locked ? ' disabled' : '') + ' onchange="window._ob2MsChange()"/>'
          + c.label
          + (locked ? ' <span class="ob2-pro-badge">PRO</span>' : '')
          + '</label>';
      });
      html += '</div>';
      html += '<input type="hidden" id="ob2-input" value=""/>';
      html += '<button type="button" class="bubble-action-btn" id="ob2-btn" onclick="window._ob2Continue()">Blast! 🚀</button>';
    } else if (s.inputType === 'ai-suggest') {
      html += '<div id="ob2-ai-suggest-wrap" style="padding:4px 0">'
        + '<div style="color:var(--muted,#888);font-size:13px;display:flex;align-items:center;gap:8px">'
        + '<span style="display:inline-block;animation:spin 1s linear infinite;font-size:16px">⚙️</span> Thinking...</div>'
        + '</div>'
        + '<input type="hidden" id="ob2-input" value=""/>';
    } else if (s.inputType === 'textarea') {
      html += '<textarea id="ob2-input" class="bubble-textarea" placeholder="' + (s.placeholder || '') + '" rows="3"></textarea>';
      if (s.hint) html += '<div class="bubble-hint">' + s.hint + '</div>';
      html += '<button type="button" class="bubble-action-btn" id="ob2-btn" onclick="window._ob2Continue()">Continue →</button>';
    } else {
      var urlBlur = s.inputType === 'url' ? ' onblur="var v=this.value.trim();if(v){if(!/^https?:\/\//i.test(v))v=\'https://\'+v;v=v.replace(/^(https?:\/\/)(?!www\.)/i,\'$1www.\');this.value=v;}" ' : '';
      html += '<input id="ob2-input" type="' + s.inputType + '" class="bubble-input" placeholder="' + (s.placeholder || '') + '" autocomplete="off"' + urlBlur + '/>';
      if (s.hint) html += '<div class="bubble-hint">' + s.hint + '</div>';
      const toggleDefs = s.toggles || (s.toggle ? [s.toggle] : []);
      toggleDefs.forEach((t, i) => {
        html += '<div class="toggle-row">'
              + '<span class="toggle-label">' + t.label + '</span>'
              + '<label class="toggle-switch">'
              + '<input type="checkbox" id="ob2-toggle-' + i + '"' + (toggles[t.stateKey] ? ' checked' : '')
              + ' onchange="window._ob2ToggleChange(\'' + t.stateKey + '\',this.checked)"/>'
              + '<span class="toggle-slider"></span>'
              + '</label>'
              + '</div>';
      });
      html += '<button type="button" class="bubble-action-btn" id="ob2-btn" onclick="window._ob2Continue()">Continue →</button>';
    }

    html += '<div class="pb-err" id="ob2-err"></div>';
    bubble.innerHTML = html;

    currentInput = document.getElementById('ob2-input');
    if (currentInput && s.inputType !== 'choice') {
      currentInput.focus();
      if (s.inputType !== 'textarea') {
        currentInput.addEventListener('keydown', e => { if (e.key === 'Enter') window._ob2Continue(); });
      }
    }
    if (s.inputType === 'tel' && currentInput) {
      currentInput.addEventListener('input', function() {
        let digits = this.value.replace(/\D/g, '').slice(0, 10);
        if (digits.length >= 7)      this.value = digits.slice(0,3) + '-' + digits.slice(3,6) + '-' + digits.slice(6);
        else if (digits.length >= 4) this.value = digits.slice(0,3) + '-' + digits.slice(3);
        else                         this.value = digits;
      });
    }
    setTimeout(() => bubble.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 80);
  }

  function interpolate(msg, ans) {
    if (!msg || !ans) return msg;
    return msg.replace(/\{(\w+)\}/g, (_, k) => (ans[k] !== undefined ? ans[k] : '{' + k + '}'));
  }


  window._ob2AcceptSuggestion = function(value) {
    answers[STEPS[step].key] = value;
    if (currentBubble) lockBubble(currentBubble, value);
    step++;
    setTimeout(showStep, 380);
  };

  window._ob2ChangeSuggestion = function() {
    const wrap = document.getElementById('ob2-ai-suggest-wrap');
    if (!wrap) return;
    wrap.innerHTML =
      '<input id="ob2-input-cat" type="text" class="bubble-input" placeholder="e.g. Hair Salon, Mexican Restaurant..." autocomplete="off"/>'
      + '<button type="button" class="bubble-action-btn" style="margin-top:8px" '
      + 'onclick="window._ob2AcceptSuggestion(document.getElementById(\'ob2-input-cat\').value.trim()||\'Local Business\')">Looks good →</button>';
    const inp = document.getElementById('ob2-input-cat');
    if (inp) { inp.focus(); inp.addEventListener('keydown', e => { if (e.key === 'Enter') window._ob2AcceptSuggestion(inp.value.trim() || 'Local Business'); }); }
  };

  window._ob2MsChange = function() {
    const checked = [...document.querySelectorAll('.ob2-ms-check:checked')].map(c => c.value);
    const inp = document.getElementById('ob2-input');
    if (inp) inp.value = checked.join(',');
  };

  window._ob2ToggleChange = function(stateKey, checked) {
    toggles[stateKey] = checked;
  };

  window._ob2PickChoice = function(btn) {
    document.querySelectorAll('.ob2-choice-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    if (currentInput) currentInput.value = btn.dataset.val;
    const errEl = currentBubble ? currentBubble.querySelector('#ob2-err') : null;
    if (errEl) errEl.style.display = 'none';
    setTimeout(() => window._ob2Continue(), 220);
  };

  window._ob2Continue = function() {
    const s = STEPS[step];
    if (s.inputType === 'url' && currentInput) {
      var rv = currentInput.value.trim();
      if (rv) { if (!/^https?:\/\//i.test(rv)) rv = 'https://' + rv; rv = rv.replace(/^(https?:\/\/)(?!www\.)/i, '$1www.'); currentInput.value = rv; }
    }
    const val = currentInput ? currentInput.value : '';
    const errEl = currentBubble ? currentBubble.querySelector('#ob2-err') : null;
    if (s.validate) {
      const err = s.validate(val);
      if (err) {
        if (errEl) { errEl.textContent = err; errEl.style.display = 'block'; }
        return;
      }
    }
    if (s.inputType === 'multiselect') {
      answers[s.key] = val.split(',').filter(Boolean);
      if (currentBubble) lockBubble(currentBubble, answers[s.key].join(', ') || '(none selected)');
    } else {
      answers[s.key] = val.trim();
      if (currentBubble) lockBubble(currentBubble, val.trim());
    }
    step++;
    setTimeout(showStep, 380);
  };

  async function finish() {
    setMood('s-working');
    setPosition('right');
    setTimeout(() => {
      addMascotBubble("On it! Saving everything and firing up your first blast... 🚀");
    }, 440);
    try {
      const { bizId, campId } = await window._ob2Save(answers, toggles);
      // #2 Post-onboarding summary — show "Here's what we built" before redirect
      const safeBizName = (answers.bizName || 'Your business').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      setTimeout(() => {
        addMascotBubble(
          "Here's what we just built: <strong>" + safeBizName + "</strong> is set up with your first campaign ready to go. " +
          "AI is about to generate your content — let's launch! 🚀"
        );
        setTimeout(() => {
          window.location.href = 'BlastyBiz.html?bizId=' + bizId + '&cid=' + campId + '&autogenerate=1';
        }, 2400);
      }, 600);
    } catch (e) {
      console.error('[ob2 save]', e);
      addMascotBubble("Something went wrong saving — let's try again.");
      setMood('s-ask');
      const retryBtn = document.createElement('button');
      retryBtn.textContent = '↩ Try again';
      retryBtn.style.cssText = 'margin:10px auto;display:block;padding:10px 24px;background:#ff6b00;color:#fff;border:none;border-radius:8px;font-size:15px;cursor:pointer;';
      retryBtn.onclick = () => { retryBtn.remove(); finish(); };
      const _st = document.getElementById('ob-status');
      if (_st) { _st.style.display = 'block'; _st.appendChild(retryBtn); }
    }
  }

  window._ob2StartConvo = function() {
    buildFormRows();
    if (window._ob2Prefill) Object.assign(answers, window._ob2Prefill);
    setMood('s-wave');
    if (window._ob2EditBizId) {
      setTimeout(() => {
        addMascotBubble("Welcome back! Let's update your business profile. I'll walk through each step — just edit anything that's changed. 👋");
        setTimeout(showStep, 1400);
      }, 600);
    } else {
      setTimeout(showStep, 600);
    }
  };
  if (window._ob2Ready) window._ob2StartConvo();
})();
</script>

<!-- ── Firebase ───────────────────────────────────────────────────── -->
<script type="module">
import { auth } from './firebase-init-v2.js';
import {
  isSignInWithEmailLink,
  signInWithEmailLink,
  onAuthStateChanged
} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import {
  getFirestore, doc, getDoc, setDoc, collection, serverTimestamp, writeBatch
} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
import { getApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';

const db = getFirestore(getApp());

window._ob2Save = async function(answers, toggles) {
  const isEdit = !!window._ob2EditBizId;
  const bizRef = isEdit
    ? doc(db, 'users', window._ob2Uid, 'businesses', window._ob2EditBizId)
    : doc(collection(db, 'users', window._ob2Uid, 'businesses'));
  const bizId  = bizRef.id;
  const campId = 'c_' + Date.now();

  const campaignStory = [
    answers.campaignAbout    ? 'About this campaign: ' + answers.campaignAbout    : '',
    answers.campaignAudience ? 'Target audience: '     + answers.campaignAudience : ''
  ].filter(Boolean).join('\n');

  const batch = writeBatch(db);

  /* ── Business document — canonical schema ─────────────────── */
  batch.set(bizRef, {
    name:               answers.bizName      || '',
    businessName:       answers.bizName      || '',
    category:           answers.category     || '',
    ownerName:          answers.ownerName    || '',
    ownerRole:          answers.role         || '',
    email:              answers.email        || '',
    phone:              answers.phone        || '',
    street:             answers.street       || '',
    city:               answers.city         || '',
    state:              answers.state        || '',
    zip:                answers.zip          || '',
    website:            answers.website      || '',
    locationType:       answers.locationType || '',
    ynMentionName:      toggles.ynMentionName    ? 'yes' : 'no',
    ynMentionRole:      toggles.ynMentionRole    ? 'yes' : 'no',
    ynMentionAddress:   toggles.ynMentionAddress ? 'yes' : 'no',
    ynMentionPhone:     toggles.ynMentionPhone   ? 'yes' : 'no',
    ynMentionWebsite:   'yes',
    ynMentionEmail:     'yes',
    aiContext: {
      story:     answers.story     || '',
      different: answers.different || '',
      awards:    answers.awards    || '',
      customer:  answers.customer  || '',
      other:     answers.other     || '',
    },
    createdAt: serverTimestamp()
  }, isEdit ? { merge: true } : {});

  /* ── Mark user as onboarded — only for new businesses ─────── */
  if (!isEdit) {
    batch.set(doc(db, 'users', window._ob2Uid), {
      onboarded:           true,
      activeBusiness:      bizId,
      onboardingVersion:   1,
      onboardingCompleted: serverTimestamp()
    }, { merge: true });
  }

  /* ── First campaign document ──────────────────────────────── */
  batch.set(
    doc(db, 'users', window._ob2Uid, 'businesses', bizId, 'campaigns', campId),
    {
      id:                  campId,
      name:                answers.campaignName || 'My First Campaign',
      offer:               answers.campaignOffer || '',
      campaignStory,
      onboardingPlatforms: Array.isArray(answers.campaignPlatforms) ? answers.campaignPlatforms : [],
      createdAt:           serverTimestamp(),
      lastUsedAt:          '',
      photos:              [],
      adName:              '',
      price:               '',
      factoids:            [],
      platformHistory:     {}
    }
  );

  /* ── Atomic commit — all three or none ────────────────────── */
  await batch.commit();

  return { bizId, campId };
};

function _ready(uid, name, plan) {
  window._ob2Uid   = uid;
  window._ob2Name  = name || '';
  window._ob2Plan  = plan || 'trial';
  window._ob2Ready = true;
  if (window._ob2StartConvo) window._ob2StartConvo();
}

if (isSignInWithEmailLink(auth, window.location.href)) {
  const email = localStorage.getItem('bb_trial_email') || prompt('Please confirm your email address:') || '';
  const name  = localStorage.getItem('bb_trial_name')  || '';
  localStorage.removeItem('bb_trial_email');
  localStorage.removeItem('bb_trial_name');
  if (email) {
    signInWithEmailLink(auth, email, window.location.href)
      .then(async result => {
        await setDoc(doc(db, 'users', result.user.uid), {
          plan: 'trial', displayName: name, email, createdAt: serverTimestamp()
        }, { merge: true });
        const clean = new URL(window.location.href);
        ['oobCode','apiKey','mode','lang'].forEach(p => clean.searchParams.delete(p));
        history.replaceState(null, '', clean.toString());
        _ready(result.user.uid, name, 'trial');
      })
      .catch(() => { window.location.href = 'BlastyBiz-Trial.html'; });
  } else {
    window.location.href = 'BlastyBiz-Trial.html';
  }
} else {
  onAuthStateChanged(auth, async user => {
    if (!user) { window.location.href = 'BlastyBiz-Trial.html'; return; }
    const urlP      = new URLSearchParams(window.location.search);
    const editBizId = urlP.get('bizId') || null;
    const isNew     = urlP.has('new');
    const userSnap  = await getDoc(doc(db, 'users', user.uid));
    const ud        = userSnap.exists() ? userSnap.data() : {};
    // Redirect already-onboarded users back to the app UNLESS they explicitly
    // chose to add a new business (?new=1) or edit an existing one (?bizId=...)
    if (ud.onboarded && ud.onboardingVersion && ud.activeBusiness && !isNew && !editBizId) {
      window.location.href = 'BlastyBiz.html';
      return;
    }
    // Return-visit: load existing biz data for pre-population
    if (editBizId) {
      window._ob2EditBizId = editBizId;
      try {
        const bizSnap = await getDoc(doc(db, 'users', user.uid, 'businesses', editBizId));
        if (bizSnap.exists()) {
          const d = bizSnap.data();
          window._ob2Prefill = {
            bizName:      d.name || d.businessName || '',
            ownerName:    d.ownerName    || '',
            role:         d.ownerRole   || '',
            email:        d.email        || '',
            phone:        d.phone       || '',
            locationType: d.locationType|| '',
            street:       (d.address && d.address.street) || d.street || '',
            city:         (d.address && d.address.city)   || d.city   || '',
            state:        (d.address && d.address.state)  || d.state  || '',
            zip:          (d.address && d.address.zip)    || d.zip    || '',
            website:      d.website     || '',
            story:        (d.aiContext && d.aiContext.story)     || d.story     || '',
            different:    (d.aiContext && d.aiContext.different) || d.different || '',
            awards:       (d.aiContext && d.aiContext.awards)    || d.awards    || '',
            customer:     (d.aiContext && d.aiContext.customer)  || d.customer  || '',
            other:        (d.aiContext && d.aiContext.other)     || d.otherInfo || '',
          };
        }
      } catch(e) { console.warn('[ob2 prefill]', e); }
    }
    // Load step overrides from Firestore (non-fatal)
    try {
      const ovSnap = await getDoc(doc(db, 'config', 'ob1Steps'));
      if (ovSnap.exists() && window._ob2ApplyOverrides) {
        window._ob2ApplyOverrides(ovSnap.data());
      }
    } catch(e) { /* use defaults if unavailable */ }
    const plan = ud.plan || 'trial';
    _ready(user.uid, user.displayName || '', plan);
  });
}
</script>

<script>
fetch('blastybiz-header.html')
  .then(r => r.text())
  .then(html => { document.getElementById('header__inject').innerHTML = html; });
</script>
