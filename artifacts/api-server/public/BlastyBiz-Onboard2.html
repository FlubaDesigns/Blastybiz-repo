<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <meta name="description" content="Set up your BlastyBiz business profile."/>
  <link rel="stylesheet" href="global-style.css?v=1784522100075"/>
  <title>BlastyBiz — Your Business</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700&display=swap" rel="stylesheet"/>
  <script src="blastybiz-menu.js?v=3"></script>
  <style>

    .pb-page {
      min-height: 100vh;
      padding-top: var(--main-offset, 55px);
      display: flex;
      align-items: flex-start;
    }
    .pb-layout {
      display: flex;
      flex-direction: row;
      width: 100%;
      max-width: 860px;
      margin: 0 auto;
      padding: 44px 24px 80px;
      gap: 36px;
      align-items: flex-start;
    }

    .pb-chat {
      flex: 1;
      min-width: 0;
      order: 1;
    }
    .pb-logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 30px;
      color: var(--green);
      letter-spacing: 2px;
      margin-bottom: 2px;
    }
    .pb-tagline {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 28px;
    }
    .pb-thread {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .bubble-blasty {
      align-self: flex-end;
      background: var(--panel, #111);
      border: 1.5px solid var(--border, #222);
      border-radius: 18px 4px 18px 18px;
      padding: 13px 16px;
      max-width: 88%;
      font-size: 15px;
      line-height: 1.65;
      color: var(--light, #fff);
      animation: bb-in .38s ease both;
    }
    .bubble-user {
      align-self: flex-start;
      background: var(--panel, #111);
      border: 1.5px solid var(--border, #222);
      border-radius: 4px 18px 18px 18px;
      padding: 13px 16px;
      max-width: 88%;
      width: 100%;
      box-sizing: border-box;
      animation: bb-in .38s ease both;
    }
    .bubble-user.locked {
      background: var(--green);
      border-color: var(--green);
      color: #000;
      font-weight: 700;
      font-size: 15px;
      padding: 12px 16px;
    }
    @keyframes bb-in {
      from { opacity: 0; transform: translateY(9px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .bubble-input {
      display: block;
      width: 100%;
      box-sizing: border-box;
      background: var(--panel, #111);
      border: 1.5px solid var(--border, #222);
      border-radius: 8px;
      padding: 11px 14px;
      font-size: 15px;
      color: var(--light, #fff);
      font-family: 'DM Sans', sans-serif;
      outline: none;
      transition: border-color .18s;
    }
    .bubble-input:focus { border-color: var(--green); }
    .bubble-input::placeholder { color: var(--muted, #555); }

    .bubble-hint {
      font-size: 12px;
      color: var(--muted, #555);
      margin-top: 7px;
    }
    .bubble-action-btn {
      display: block;
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      background: var(--green);
      color: #000;
      font-weight: 700;
      font-size: 14px;
      border: none;
      border-radius: 9px;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: opacity .18s, transform .1s;
    }
    .bubble-action-btn:hover  { opacity: .88; }
    .bubble-action-btn:active { transform: scale(.98); }
    .bubble-action-btn:disabled { opacity: .42; cursor: not-allowed; }

    .pb-err {
      font-size: 13px;
      color: #e57373;
      margin-top: 7px;
      display: none;
    }

    /* ── Toggle switch ──────────────────────────────────────────── */
    .toggle-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 11px;
      padding: 9px 12px;
      background: rgba(255,255,255,.04);
      border-radius: 8px;
    }
    .toggle-label {
      font-size: 13px;
      color: var(--muted, #888);
      flex: 1;
      line-height: 1.4;
    }
    .toggle-switch {
      position: relative;
      width: 42px;
      height: 24px;
      flex-shrink: 0;
    }
    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
      position: absolute;
    }
    .toggle-slider {
      position: absolute;
      inset: 0;
      background: #333;
      border-radius: 24px;
      cursor: pointer;
      transition: background .2s;
    }
    .toggle-slider::before {
      content: '';
      position: absolute;
      width: 18px;
      height: 18px;
      left: 3px;
      top: 3px;
      background: white;
      border-radius: 50%;
      transition: transform .2s;
    }
    .toggle-switch input:checked + .toggle-slider { background: var(--green); }
    .toggle-switch input:checked + .toggle-slider::before { transform: translateX(18px); }

    /* ── Blasty zone (right — desktop) ──────────────────────────── */
    .pb-blasty-zone {
      flex-shrink: 0;
      width: 190px;
      order: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: sticky;
      top: calc(var(--main-offset, 55px) + 20px);
    }
    .pb-blasty { width: 160px; }
    #blasty-svg { width: 100%; height: auto; overflow: visible; }
    .pb-blasty-caption {
      font-size: 12px;
      color: var(--muted, #666);
      margin-top: 10px;
      text-align: center;
      font-style: italic;
      min-height: 18px;
      transition: opacity .3s;
    }

    /* ── Blasty animations ──────────────────────────────────────── */
    #blasty-body {
      transform-box: fill-box;
      transform-origin: bottom center;
      animation: b-float 3.2s ease-in-out infinite;
    }
    @keyframes b-float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-9px); }
    }
    .flame {
      transform-box: fill-box;
      transform-origin: top center;
      animation: b-flame-pulse 0.55s ease-in-out infinite;
    }
    @keyframes b-flame-pulse {
      0%, 100% { transform: scaleY(1) scaleX(1); }
      50%       { transform: scaleY(1.2) scaleX(0.88); }
    }
    .pb-blasty.s-wave #blasty-body {
      animation: b-wave 0.7s ease-in-out 3, b-float 3.2s ease-in-out infinite 2.1s;
    }
    @keyframes b-wave {
      0%, 100% { transform: rotate(0deg) translateY(0); }
      30%       { transform: rotate(-14deg) translateY(-4px); }
      70%       { transform: rotate(10deg) translateY(-2px); }
    }
    .pb-blasty.s-happy #blasty-body {
      animation: b-nod .38s ease-in-out 2, b-float 3.2s ease-in-out infinite .76s;
    }
    @keyframes b-nod {
      0%, 100% { transform: translateY(0) scale(1); }
      45%       { transform: translateY(-16px) scale(1.08); }
    }
    .pb-blasty.s-ask .pupil-group-l { transform: translateX(-3px); }
    .pb-blasty.s-ask .pupil-group-r { transform: translateX(-3px); }
    .pb-blasty.s-ask #blasty-body {
      animation: b-float-lean 3.2s ease-in-out infinite;
    }
    @keyframes b-float-lean {
      0%, 100% { transform: translateY(0) rotate(-6deg); }
      50%       { transform: translateY(-8px) rotate(-6deg); }
    }
    .pb-blasty.s-working #blasty-body {
      animation: b-work 1.1s ease-in-out infinite;
    }
    @keyframes b-work {
      0%, 100% { transform: translateY(0) rotate(-3deg); }
      50%       { transform: translateY(-5px) rotate(3deg); }
    }
    .pb-blasty.s-celebrate #blasty-body {
      animation: b-celebrate .42s ease-in-out 4;
    }
    @keyframes b-celebrate {
      0%, 100% { transform: translateY(0) scale(1) rotate(0deg); }
      28%       { transform: translateY(-22px) scale(1.12) rotate(-5deg); }
      72%       { transform: translateY(-16px) scale(1.12) rotate(5deg); }
    }
    .pb-blasty.s-celebrate .confetti {
      animation: confetti-burst 1.4s ease-out forwards;
    }
    @keyframes confetti-burst {
      0%   { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(60px) scale(1.5); }
    }

    /* ── Choice buttons ─────────────────────────────────────────── */
    .ob2-choices {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 4px;
    }
    .ob2-choice-btn {
      width: 100%;
      padding: 13px 16px;
      background: var(--panel, #111);
      border: 1.5px solid var(--border, #333);
      border-radius: 10px;
      color: var(--light, #fff);
      font-size: 15px;
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      transition: border-color .18s, background .18s, transform .1s;
    }
    .ob2-choice-btn:hover   { border-color: var(--green); background: rgba(0,200,83,.06); }
    .ob2-choice-btn:active  { transform: scale(.98); }
    .ob2-choice-btn.selected {
      border-color: var(--green);
      background: rgba(0,200,83,.14);
      color: var(--green);
      font-weight: 700;
    }

    /* ── Tablet (580 – 859px) ───────────────────────────────────── */
    @media (max-width: 859px) {
      .pb-layout {
        flex-direction: column;
        max-width: 600px;
        padding: 28px 24px 80px;
        gap: 0;
      }
      .pb-blasty-zone {
        width: 100%;
        order: -1;
        flex-direction: row;
        justify-content: center;
        align-items: flex-end;
        position: static;
        padding-bottom: 20px;
        gap: 14px;
      }
      .pb-blasty { width: 110px; }
      .pb-blasty-caption {
        font-size: 13px;
        text-align: left;
        margin-top: 0;
        max-width: 180px;
      }
    }

    /* ── Mobile (< 580px) ───────────────────────────────────────── */
    @media (max-width: 579px) {
      .pb-layout {
        padding: 16px 14px 60px;
      }
      .pb-blasty-zone {
        padding-bottom: 14px;
        gap: 10px;
      }
      .pb-blasty { width: 88px; }
      .pb-logo    { display: none; }
      .pb-tagline { margin-bottom: 14px; font-size: 13px; }
      .pb-blasty-caption { font-size: 12px; max-width: 160px; }
      .bubble-blasty,
      .bubble-user { max-width: 96%; font-size: 14px; }
    }
  </style>
</head>

<!-- ── Conversation engine ────────────────────────────────────────── -->
<script>
(function() {
  const answers = {};
  const toggles = { ynMentionAddress: true, ynMentionPhone: true, ynMentionWebsite: true };
  let step = 0;

  const STEPS = [
    {
      mood: 's-wave',
      blastyMsgFn: () => 'Great' + (window._ob2Name ? ', ' + window._ob2Name : '') + '! First — what\'s the name of your business?',
      inputType: 'text',
      key: 'bizName',
      placeholder: "e.g. Mike's Auto Repair",
      hint: 'This is how customers will find you everywhere',
      validate: v => v.trim().length >= 1 ? null : 'Please enter your business name.'
    },
    {
      mood: 's-ask',
      blastyMsgFn: a => 'Nice! Where is ' + a.bizName + ' located?',
      inputType: 'text',
      key: 'address',
      placeholder: 'e.g. 123 Main St, Springfield, IL',
      hint: 'Street address, city, and state',
      validate: v => v.trim().length >= 2 ? null : 'Please enter an address.',
      toggle: { stateKey: 'ynMentionAddress', label: 'Mention address in marketing copy' }
    },
    {
      mood: 's-happy',
      blastyMsgFn: a => 'Perfect. What\'s the best phone number for ' + a.bizName + '?',
      inputType: 'tel',
      key: 'phone',
      placeholder: '(555) 867-5309',
      hint: 'Customers can call or text this number',
      validate: v => v.trim().length >= 7 ? null : 'Please enter a phone number.',
      toggle: { stateKey: 'ynMentionPhone', label: 'Include phone number in marketing copy' }
    },
    {
      mood: 's-working',
      blastyMsgFn: a => 'Excellent! Does ' + a.bizName + ' have a website? I\'ll make sure it shows up everywhere.',
      inputType: 'url',
      key: 'website',
      placeholder: 'e.g. https://qrgear.com',
      hint: 'Leave blank if you don\'t have one yet — no worries!',
      validate: () => null,
      toggle: { stateKey: 'ynMentionWebsite', label: 'Include website in marketing copy' }
    },
    {
      mood: 's-happy',
      blastyMsgFn: a => 'Almost there! Is ' + a.bizName + ' a physical location, online only, or both?',
      inputType: 'choice',
      key: 'locationType',
      choices: [
        { value: 'brick', label: '🏪  Physical Location' },
        { value: 'online', label: '🌐  Online Only' },
        { value: 'both', label: '🏪🌐  Both' }
      ],
      validate: v => v ? null : 'Please choose one.'
    }
  ];

  const MOOD_CAPTIONS = {
    's-wave':      'Hey there! 👋',
    's-ask':       'Tell me more...',
    's-happy':     'Looking good! 🎉',
    's-working':   'On it...',
    's-celebrate': 'Let\'s blast! 🚀'
  };

  function setMood(mood) {
    document.getElementById('pb-blasty').className = 'pb-blasty ' + mood;
    const cap = document.getElementById('pb-blasty-caption');
    if (cap) cap.textContent = MOOD_CAPTIONS[mood] || '';
  }

  function addBlastyBubble(text) {
    const thread = document.getElementById('pb-thread');
    const el = document.createElement('div');
    el.className = 'bubble-blasty';
    el.textContent = text;
    thread.appendChild(el);
    setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 60);
    return el;
  }

  function addUserBubble(id) {
    const thread = document.getElementById('pb-thread');
    const el = document.createElement('div');
    el.className = 'bubble-user';
    if (id) el.id = id;
    thread.appendChild(el);
    return el;
  }

  function lockBubble(el, text) {
    el.className = 'bubble-user locked';
    el.innerHTML = '';
    el.textContent = text;
  }

  function renderInput(s) {
    const bubble = addUserBubble('ob2-current-bubble');
    let html = '';

    if (s.inputType === 'choice') {
      html += '<div class="ob2-choices" id="ob2-choices">';
      s.choices.forEach(c => {
        html += '<button type="button" class="ob2-choice-btn" data-val="' + c.value + '" onclick="window._ob2PickChoice(this)">' + c.label + '</button>';
      });
      html += '</div>';
      html += '<input type="hidden" id="ob2-input" value=""/>';
    } else {
      html += '<input id="ob2-input" type="' + s.inputType + '" class="bubble-input" placeholder="' + (s.placeholder || '') + '" autocomplete="off"/>';
      if (s.hint) html += '<div class="bubble-hint">' + s.hint + '</div>';
      if (s.toggle) {
        html += '<div class="toggle-row">'
              + '<span class="toggle-label">' + s.toggle.label + '</span>'
              + '<label class="toggle-switch">'
              + '<input type="checkbox" id="ob2-toggle"' + (toggles[s.toggle.stateKey] ? ' checked' : '')
              + ' onchange="window._ob2ToggleChange(\'' + s.toggle.stateKey + '\',this.checked)"/>'
              + '<span class="toggle-slider"></span>'
              + '</label>'
              + '</div>';
      }
      html += '<button type="button" class="bubble-action-btn" id="ob2-btn" onclick="window._ob2Continue()">Continue →</button>';
    }

    html += '<div class="pb-err" id="ob2-err"></div>';
    bubble.innerHTML = html;

    const inp = document.getElementById('ob2-input');
    if (inp && s.inputType !== 'choice') {
      inp.focus();
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') window._ob2Continue(); });
    }
    setTimeout(() => bubble.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 80);
  }

  function showStep() {
    if (step >= STEPS.length) { finish(); return; }
    const s = STEPS[step];
    setMood(s.mood);
    const delay = step === 0 ? 700 : 440;
    setTimeout(() => {
      const msg = s.blastyMsgFn ? s.blastyMsgFn(answers) : s.blastyMsg;
      addBlastyBubble(msg);
      setTimeout(() => renderInput(s), 320);
    }, delay);
  }

  window._ob2ToggleChange = function(stateKey, checked) {
    toggles[stateKey] = checked;
  };

  window._ob2PickChoice = function(btn) {
    document.querySelectorAll('.ob2-choice-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    document.getElementById('ob2-input').value = btn.dataset.val;
    const errEl = document.getElementById('ob2-err');
    if (errEl) errEl.style.display = 'none';
    setTimeout(() => window._ob2Continue(), 220);
  };

  window._ob2Continue = function() {
    const s = STEPS[step];
    const inp = document.getElementById('ob2-input');
    const val = inp ? inp.value : '';
    const errEl = document.getElementById('ob2-err');
    if (s.validate) {
      const err = s.validate(val);
      if (err) { errEl.textContent = err; errEl.style.display = 'block'; return; }
    }
    answers[s.key] = val.trim();
    const bubble = document.getElementById('ob2-current-bubble');
    if (bubble) lockBubble(bubble, val.trim());
    step++;
    setTimeout(showStep, 380);
  };

  async function finish() {
    setMood('s-celebrate');
    setTimeout(() => {
      addBlastyBubble("You're all set! Saving your info now — let's get blasting! 🚀");
    }, 440);
    try {
      await window._ob2Save(answers, toggles);
      setTimeout(() => { window.location.href = 'BlastyBiz.html'; }, 2000);
    } catch (e) {
      console.error('[ob2 save]', e);
      addBlastyBubble('Hmm, something went wrong saving. Try refreshing the page.');
    }
  }

  window._ob2StartConvo = function() { showStep(); };
  if (window._ob2Ready) window._ob2StartConvo();
})();
</script>

<script type="module">
import { auth } from './firebase-init-v2.js';
import {

} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import {
  getFirestore, doc, setDoc, collection, getDocs, serverTimestamp
} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
import { getApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';

const db = getFirestore(getApp());

window._ob2Save = async function(answers, toggles) {
  const bizRef = doc(collection(db, 'users', window._ob2Uid, 'businesses'));
  await setDoc(bizRef, {
    name:               answers.bizName     || '',
    phone:              answers.phone       || '',
    address:            answers.address     || '',
    website:            answers.website     || '',
    locationType:       answers.locationType || '',
    ynMentionAddress:   toggles.ynMentionAddress  ? 'yes' : 'no',
    ynMentionPhone:     toggles.ynMentionPhone    ? 'yes' : 'no',
    ynMentionWebsite:   toggles.ynMentionWebsite  ? 'yes' : 'no',
    ynMentionName:      'no',
    ynMentionRole:      'no',
    ynMentionEmail:     'yes',
    createdAt:          serverTimestamp()
  });
  await setDoc(doc(db, 'users', window._ob2Uid), { onboarded: false }, { merge: true });
};

function _ready(uid, name) {
  window._ob2Uid   = uid;
  window._ob2Name  = name || '';
  window._ob2Ready = true;
  if (window._ob2StartConvo) window._ob2StartConvo();
}

if (isSignInWithEmailLink(auth, window.location.href)) {
  const email = localStorage.getItem('bb_trial_email') || prompt('Please confirm your email address:') || '';
  const name  = localStorage.getItem('bb_trial_name')  || '';
  localStorage.removeItem('bb_trial_email');
  localStorage.removeItem('bb_trial_name');
  if (email) {
    signInWithEmailLink(auth, email, window.location.href)
      .then(async result => {
        await setDoc(doc(db, 'users', result.user.uid), {
          plan: 'trial', displayName: name, email, createdAt: serverTimestamp()
        }, { merge: true });
        const clean = new URL(window.location.href);
        ['oobCode','apiKey','mode','lang'].forEach(p => clean.searchParams.delete(p));
        history.replaceState(null, '', clean.toString());
        _ready(result.user.uid, name);
      })
      .catch(() => { window.location.href = 'BlastyBiz-Trial.html'; });
  } else {
    window.location.href = 'BlastyBiz-Trial.html';
  }
} else {
  onAuthStateChanged(auth, async user => {
    if (!user) { window.location.href = 'BlastyBiz-Trial.html'; return; }
    const snap = await getDocs(collection(db, 'users', user.uid, 'businesses'));
    if (!snap.empty) { window.location.href = 'BlastyBiz.html'; return; }
    _ready(user.uid, user.displayName || '');
  });
}
</script>

<script>
fetch('blastybiz-header.html')
  .then(r => r.text())
  .then(html => { document.getElementById('header__inject').innerHTML = html; });
</script>
</body>
