<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="stylesheet" href="global-style.css?v=1784605380874"/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet"/>
<title>BlastyBiz — Set Up Your Business</title>
<script type="module" src="./auth-guard.js"></script>
<style>
html,body{height:100%;overflow:hidden;margin:0;background:#0d1a0d}
.chat-wrap{display:flex;flex-direction:column;height:100vh;max-width:540px;margin:0 auto;width:100%}
.chat-header{padding:14px 18px 10px;border-bottom:1px solid #1e3320;flex-shrink:0;display:flex;align-items:center;gap:10px}
.chat-logo{font-family:'Bebas Neue',sans-serif;font-size:22px;color:#00C853;letter-spacing:1px}
.chat-step-label{font-size:11px;color:#4caf50;letter-spacing:2px;text-transform:uppercase;margin-top:2px}
.progress-bar{height:3px;background:#1e3320;flex-shrink:0}
.progress-fill{height:3px;background:#00C853;transition:width .5s ease;width:0%}
.chat-messages{flex:1;overflow-y:auto;padding:16px 16px 8px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:84%;padding:11px 15px;border-radius:18px;font-size:15px;line-height:1.55;word-wrap:break-word;animation:fadeUp .25s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.msg-ai{background:#162b19;color:#e0f0e3;border-bottom-left-radius:4px;align-self:flex-start}
.msg-user{background:#00C853;color:#0a1a0c;border-bottom-right-radius:4px;align-self:flex-end;font-weight:600}
.typing{display:flex;align-items:center;gap:5px;background:#162b19;padding:11px 15px;border-radius:18px;border-bottom-left-radius:4px;align-self:flex-start}
.typing span{width:7px;height:7px;background:#4caf50;border-radius:50%;animation:blink 1.2s ease-in-out infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.chat-footer{padding:10px 14px 20px;border-top:1px solid #1e3320;flex-shrink:0;background:#0d1a0d}
.chat-options{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chat-opt-btn{background:#1a2e1d;border:1.5px solid #2e5c34;color:#e0f0e3;padding:10px 16px;border-radius:22px;font-size:14px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s}
.chat-opt-btn:hover,.chat-opt-btn:active{background:#00C853;color:#0a1a0c;border-color:#00C853;font-weight:700}
.chat-input-row{display:flex;gap:8px;align-items:center}
#chat-input{flex:1;background:#162b19;border:1.5px solid #2e5c34;color:#e0f0e3;padding:12px 16px;border-radius:26px;font-size:15px;font-family:'DM Sans',sans-serif;outline:none;transition:border-color .15s}
#chat-input:focus{border-color:#00C853}
#chat-input::placeholder{color:#4a7a52}
#chat-input:disabled{opacity:.5}
#send-btn{background:#00C853;border:none;color:#0a1a0c;width:46px;height:46px;border-radius:50%;font-size:22px;cursor:pointer;flex-shrink:0;font-weight:900;line-height:1;transition:opacity .15s}
#send-btn:disabled{opacity:.4;cursor:default}
.skip-row{text-align:center;margin-top:8px;min-height:20px}
.btn-skip{background:none;border:none;color:#4a7a52;font-size:13px;cursor:pointer;text-decoration:underline;font-family:'DM Sans',sans-serif}
.btn-skip:hover{color:#4caf50}
.msg-saving{text-align:center;color:#4caf50;font-size:13px;margin-top:4px;animation:fadeUp .3s ease}
</style>
</head>
<body>

<div class="chat-wrap">
  <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
  <div class="chat-header">
    <div>
      <div class="chat-logo">BlastyBiz</div>
      <div class="chat-step-label" id="step-label">Getting Started</div>
    </div>
  </div>
  <div class="chat-messages" id="chat-messages"></div>
  <div class="chat-footer">
    <div class="chat-options" id="chat-options"></div>
    <div class="chat-input-row">
      <input type="text" id="chat-input" placeholder="Type here…" autocomplete="off"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}"/>
      <button id="send-btn" onclick="sendMessage()">›</button>
    </div>
    <div class="skip-row" id="skip-row">
      <button class="btn-skip" id="skip-btn" onclick="skipStep()" style="display:none">Skip this one →</button>
    </div>
  </div>
</div>

<script>
const CF_BASE = 'https://us-central1-blastybiz-9523e.cloudfunctions.net';

// ── State ────────────────────────────────────────────────────────────────────
let phase = 'scripted';
let scriptedIdx = 0;
let waiting = false;
window.currentUser = null;

const col = {
  ownerName:'', email:'', bizName:'',
  locationType:'physical', city:'', state:'',
  phone:'', website:'', tone:'friendly'
};
let aiHistory = [];

// ── Helpers ──────────────────────────────────────────────────────────────────
const firstName = () => (col.ownerName||'').split(' ')[0] || 'there';
const $  = id   => document.getElementById(id);
const msgWrap   = () => $('chat-messages');

function addMsg(role, text) {
  const d = document.createElement('div');
  d.className = 'msg msg-' + role;
  d.textContent = text;
  msgWrap().appendChild(d);
  msgWrap().scrollTop = msgWrap().scrollHeight;
}

function showTyping() {
  const d = document.createElement('div');
  d.className = 'typing'; d.id = 'typing-dot';
  d.innerHTML = '<span></span><span></span><span></span>';
  msgWrap().appendChild(d);
  msgWrap().scrollTop = msgWrap().scrollHeight;
}
function hideTyping() { $('typing-dot')?.remove(); }

function showOpts(options) {
  const el = $('chat-options');
  el.innerHTML = '';
  options.forEach(o => {
    const b = document.createElement('button');
    b.className = 'chat-opt-btn';
    b.textContent = o.label;
    b.onclick = () => pickOpt(o.value, o.label);
    el.appendChild(b);
  });
  setInputRow(false);
}
function clearOpts() { $('chat-options').innerHTML = ''; setInputRow(true); }
function setInputRow(show) { document.querySelector('.chat-input-row').style.display = show ? 'flex' : 'none'; }
function setSkip(show) { $('skip-btn').style.display = show ? 'inline' : 'none'; }
function setProgress(pct) { $('progress-fill').style.width = pct + '%'; }
function setLabel(t) { $('step-label').textContent = t || ''; }

function setWaiting(w) {
  waiting = w;
  $('send-btn').disabled = w;
  $('chat-input').disabled = w;
  if (!w) $('chat-input').focus();
}

// ── Scripted Steps ────────────────────────────────────────────────────────────
const STEPS = [
  {
    msg: () => "Hey! Before we blast you everywhere, let's get you set up. 🚀\n\nWhat's your name?",
    field: 'ownerName', label: 'Getting Started',
    validate: v => v.trim().length > 1,
  },
  {
    msg: () => `Nice to meet you, ${firstName()}! What's your email address?`,
    field: 'email', label: 'Contact Info', type: 'email',
    validate: v => v.includes('@') && v.includes('.'),
  },
  {
    msg: () => `Hello ${firstName()}! What business would you like to start marketing?`,
    field: 'bizName', label: 'Your Business',
    validate: v => v.trim().length > 1,
  },
  {
    msg: () => `${col.bizName} — love it! Is it a physical location, online only, or both?`,
    field: 'locationType', label: 'Location', type: 'buttons',
    options: [
      {label:'📍 Has a Location', value:'physical'},
      {label:'🌐 Online Only',    value:'online'},
      {label:'🌍 Both',          value:'both'},
    ],
  },
  {
    msg: () => col.locationType === 'online' ? null : `What city and state is ${col.bizName} in?`,
    field: 'cityState', label: 'Location', placeholder: 'e.g. Naples, FL',
    skip: () => col.locationType === 'online',
    validate: v => v.trim().length > 2,
  },
  {
    msg: () => `What's the best phone number for customers?`,
    field: 'phone', label: 'Contact Info', type: 'tel', placeholder: '239-555-0100',
    validate: v => v.replace(/\D/g,'').length >= 10,
  },
  {
    msg: () => `Got a website? (Skip if you don't have one yet)`,
    field: 'website', label: 'Contact Info', optional: true, placeholder: 'www.mybusiness.com',
  },
  {
    msg: () => `Almost there! How should ${col.bizName}'s listings sound to customers?`,
    field: 'tone', label: 'Tone', type: 'buttons',
    options: [
      {label:'😊 Friendly',    value:'friendly'},
      {label:'👔 Professional', value:'professional'},
      {label:'🔥 Bold',        value:'bold'},
      {label:'🤝 Community',   value:'community'},
    ],
  },
];

function advanceScripted() {
  while (scriptedIdx < STEPS.length) {
    const s = STEPS[scriptedIdx];
    if (s.skip && s.skip()) { scriptedIdx++; continue; }
    const m = typeof s.msg === 'function' ? s.msg() : s.msg;
    if (m === null) { scriptedIdx++; continue; }
    break;
  }
  if (scriptedIdx >= STEPS.length) { startAIPhase(); return; }

  const step  = STEPS[scriptedIdx];
  const msg   = typeof step.msg === 'function' ? step.msg() : step.msg;
  const delay = scriptedIdx === 0 ? 400 : 0;
  const pct   = Math.round(((scriptedIdx + 1) / (STEPS.length + 3)) * 70);

  setTimeout(() => {
    showTyping();
    setTimeout(() => {
      hideTyping();
      addMsg('ai', msg);
      setProgress(pct);
      setLabel(step.label || 'Setup');
      if (step.type === 'buttons') {
        showOpts(step.options);
        setSkip(false);
      } else {
        clearOpts();
        const inp = $('chat-input');
        inp.value = '';
        inp.placeholder = step.placeholder || 'Type here…';
        inp.type = step.type === 'email' ? 'email' : step.type === 'tel' ? 'tel' : 'text';
        setSkip(!!step.optional);
        inp.focus();
      }
    }, 550);
  }, delay);
}

function pickOpt(value, label) {
  col[STEPS[scriptedIdx].field] = value;
  addMsg('user', label);
  clearOpts(); setSkip(false);
  scriptedIdx++;
  advanceScripted();
}

function skipStep() {
  const step = STEPS[scriptedIdx];
  if (!step?.optional) return;
  col[step.field] = '';
  addMsg('user', '(skipped)');
  setSkip(false);
  scriptedIdx++;
  advanceScripted();
}

// ── Send Handler ──────────────────────────────────────────────────────────────
function sendMessage() {
  if (waiting) return;
  const inp = $('chat-input');
  const val = inp.value.trim();

  if (phase === 'scripted') {
    const step = STEPS[scriptedIdx];
    if (!val) { if (step?.optional) skipStep(); return; }
    if (step?.validate && !step.validate(val)) {
      inp.style.borderColor = '#ff5252';
      inp.focus();
      setTimeout(() => { inp.style.borderColor = ''; }, 1500);
      return;
    }
    if (step?.field === 'cityState') {
      const p = val.split(',').map(s => s.trim());
      col.city = p[0] || val;
      col.state = p[1] || '';
    } else if (step?.field) {
      col[step.field] = val;
    }
    addMsg('user', val);
    inp.value = '';
    setSkip(false);
    scriptedIdx++;
    advanceScripted();

  } else if (phase === 'ai') {
    if (!val) return;
    addMsg('user', val);
    inp.value = '';
    aiHistory.push({role:'user', content:val});
    callChatOnboard();
  }
}

// ── AI Phase ──────────────────────────────────────────────────────────────────
function startAIPhase() {
  phase = 'ai';
  setLabel('Tell Us About You');
  setProgress(75);

  const opening = `Alright, ${firstName()}! Now tell me about ${col.bizName}. What do you do, and how would you describe it to someone who's never heard of you before?`;

  showTyping();
  setTimeout(() => {
    hideTyping();
    addMsg('ai', opening);
    aiHistory.push({role:'assistant', content: opening});
    clearOpts();
    const inp = $('chat-input');
    inp.type = 'text';
    inp.placeholder = 'Tell me about your business…';
    setSkip(false);
    inp.focus();
  }, 900);
}

async function callChatOnboard() {
  if (!window.currentUser) return;
  setWaiting(true);
  showTyping();
  try {
    const token = await window.currentUser.getIdToken();
    const resp  = await fetch(`${CF_BASE}/chatOnboard`, {
      method: 'POST',
      headers: {'Content-Type':'application/json','Authorization':'Bearer '+token},
      body: JSON.stringify({
        conversationHistory: aiHistory,
        collectedData: {
          ownerName: col.ownerName, email: col.email, bizName: col.bizName,
          locationType: col.locationType, city: col.city, state: col.state,
          phone: col.phone, website: col.website, tone: col.tone,
        }
      })
    });
    hideTyping();
    if (!resp.ok) throw new Error('AI error ' + resp.status);
    const data = await resp.json();

    addMsg('ai', data.message);
    aiHistory.push({role:'assistant', content: data.message});

    if (data.done) {
      phase = 'done';
      setProgress(95);
      setLabel('Saving Your Profile');
      setInputRow(false);
      setSkip(false);
      setTimeout(() => saveProfile(data), 1200);
    } else {
      setWaiting(false);
    }
  } catch(e) {
    hideTyping();
    addMsg('ai', "Sorry, I hit a snag — try again?");
    setWaiting(false);
  }
}

// ── Save Profile ──────────────────────────────────────────────────────────────
async function saveProfile(aiData) {
  const days = ['Mon','Tue','Wed','Thu','Fri','Sat'];
  const profileData = {
    businessName:  col.bizName,
    ownerName:     col.ownerName,
    email:         col.email,
    phone:         col.phone,
    website:       col.website,
    locationType:  col.locationType,
    city:          col.city,
    state:         col.state,
    address:       col.locationType !== 'online' && col.city ? `${col.city}, ${col.state}`.trim().replace(/,\s*$/,'') : '',
    region:        col.locationType === 'online' ? 'Online' : '',
    tone:          col.tone,
    days,
    openTime:      '09:00',
    closeTime:     '17:00',
    hours:         `${days.join(', ')} 9am–5pm`,
    category:      '',
    platformCats:  {},
    onboarded:     true,
    globalMemory:  aiData.globalMemory  || '',
    description:   aiData.description   || '',
  };

  try {
    const token = await window.currentUser.getIdToken();
    const resp  = await fetch(`${CF_BASE}/createBusiness`, {
      method: 'POST',
      headers: {'Content-Type':'application/json','Authorization':'Bearer '+token},
      body: JSON.stringify({profileData})
    });
    if (!resp.ok) {
      const err = await resp.json().catch(()=>({}));
      throw new Error(err.error || 'Save failed ' + resp.status);
    }
    setProgress(100);
    setLabel('All Set! 🎉');
    addMsg('ai', `You're all set, ${firstName()}! Let's go create your first campaign and blast ${col.bizName} everywhere. 🚀`);
    setTimeout(() => { window.location.href = 'BlastyBiz.html?firstrun=1'; }, 2200);
  } catch(e) {
    addMsg('ai', `Oops — something went wrong saving: ${e.message}. Tap the send button to try again.`);
    setWaiting(false);
    setInputRow(true);
    phase = 'ai';
  }
}
</script>

<script type="module">
import { auth, db } from './firebase-init-v2.js';
import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { collection, getDocs } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    setTimeout(() => { if (!auth.currentUser) window.location.href = 'BlastyBiz-Login.html'; }, 1500);
    return;
  }
  window.currentUser = user;
  window._blastyUser = user;

  const isNew = new URLSearchParams(window.location.search).get('new') === '1';
  if (!isNew) {
    try {
      const snap = await getDocs(collection(db, 'users', user.uid, 'businesses'));
      if (snap.docs.some(d => d.data().onboarded === true)) {
        window.location.href = 'BlastyBiz-Dashboard.html?from=login';
        return;
      }
    } catch(e) { /* non-fatal */ }
  }

  if (!col.email     && user.email)       col.email     = user.email;
  if (!col.ownerName && user.displayName) col.ownerName = user.displayName;

  advanceScripted();
});
</script>

</body>
</html>
