<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <meta name="description" content="Try BlastyBiz free — no credit card, no password. Say hi to Blasty and get your magic link in seconds."/>
  <link rel="stylesheet" href="global-style.css?v=1784518514421"/>
  <title>BlastyBiz — Try Free</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700&display=swap" rel="stylesheet"/>
  <script src="blastybiz-menu.js?v=3"></script>
  <style>

    /* ── Page shell ──────────────────────────────────────────────── */
    .pb-page {
      min-height: 100vh;
      padding-top: var(--main-offset, 55px);
      display: flex;
      align-items: flex-start;
    }

    .pb-layout {
      display: flex;
      flex-direction: row;
      width: 100%;
      max-width: 860px;
      margin: 0 auto;
      padding: 44px 24px 80px;
      gap: 36px;
      align-items: flex-start;
    }

    /* ── Chat column (left) ──────────────────────────────────────── */
    .pb-chat {
      flex: 1;
      min-width: 0;
      order: 1;
    }

    .pb-logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 30px;
      color: var(--green);
      letter-spacing: 2px;
      margin-bottom: 2px;
    }
    .pb-tagline {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 28px;
      letter-spacing: .4px;
    }

    /* ── Thread ──────────────────────────────────────────────────── */
    .pb-thread {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Blasty's bubble — right-aligned, tail points right toward Blasty */
    .bubble-blasty {
      align-self: flex-end;
      background: #0f1f11;
      border: 1px solid #213d24;
      color: #d8eed9;
      border-radius: 18px 4px 18px 18px;
      padding: 13px 17px;
      max-width: 84%;
      font-size: 15px;
      line-height: 1.6;
      animation: bb-in .28s ease both;
    }

    /* User's bubble — left-aligned, tail points left toward user */
    .bubble-user {
      align-self: flex-start;
      background: #000;
      border: 1.5px solid var(--border);
      border-radius: 4px 18px 18px 18px;
      padding: 14px 16px;
      min-width: 230px;
      max-width: 90%;
      animation: bb-in .28s ease .18s both;
    }

    /* Locked answer — replaces input, shows what they typed */
    .bubble-user.locked {
      background: var(--green);
      border-color: var(--green);
      color: #000;
      font-weight: 700;
      font-size: 15px;
      min-width: 0;
      padding: 12px 16px;
    }

    @keyframes bb-in {
      from { opacity: 0; transform: translateY(9px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Input inside user bubble */
    .bubble-input {
      display: block;
      width: 100%;
      box-sizing: border-box;
      background: var(--panel);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 11px 14px;
      font-size: 15px;
      color: var(--light);
      font-family: 'DM Sans', sans-serif;
      outline: none;
      transition: border-color .18s;
    }
    .bubble-input:focus { border-color: var(--green); }
    .bubble-input::placeholder { color: var(--muted); }

    .bubble-hint {
      font-size: 12px;
      color: var(--muted);
      margin-top: 7px;
    }

    /* Continue / Send button inside bubble */
    .bubble-action-btn {
      display: block;
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      background: var(--green);
      color: #000;
      font-weight: 700;
      font-size: 14px;
      border: none;
      border-radius: 9px;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: opacity .18s, transform .1s;
    }
    .bubble-action-btn:hover  { opacity: .88; }
    .bubble-action-btn:active { transform: scale(.98); }
    .bubble-action-btn:disabled { opacity: .42; cursor: not-allowed; }

    /* Error text */
    .pb-err {
      font-size: 13px;
      color: #e57373;
      margin-top: 7px;
      display: none;
    }

    /* Final success bubble from Blasty */
    .bubble-success {
      align-self: flex-end;
      background: var(--green);
      color: #000;
      border-radius: 18px 4px 18px 18px;
      padding: 14px 18px;
      max-width: 88%;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.65;
      animation: bb-in .38s ease both;
    }

    /* Already-have-account link */
    .pb-already {
      margin-top: 32px;
      font-size: 13px;
      color: var(--muted);
    }
    .pb-already a {
      color: var(--green);
      text-decoration: none;
      font-weight: 600;
    }

    /* ── Blasty zone (right) ─────────────────────────────────────── */
    .pb-blasty-zone {
      flex-shrink: 0;
      width: 190px;
      order: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: sticky;
      top: calc(var(--main-offset, 55px) + 20px);
    }

    .pb-blasty {
      width: 170px;
      height: 210px;
    }

    #blasty-svg { width: 100%; height: 100%; overflow: visible; }

    /* ── Blasty animations ───────────────────────────────────────── */

    /* Idle float — always on #blasty-body */
    #blasty-body {
      animation: b-float 3.2s ease-in-out infinite;
    }
    @keyframes b-float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-9px); }
    }

    /* s-wave: right arm waves */
    .pb-blasty.s-wave .arm-r {
      transform-origin: 168px 88px;
      animation: arm-wave .55s ease-in-out 3;
    }
    @keyframes arm-wave {
      0%, 100% { transform: rotate(0deg); }
      50%       { transform: rotate(-48deg); }
    }

    /* s-happy: bounce nod */
    .pb-blasty.s-happy #blasty-body {
      animation: b-nod .38s ease-in-out 2, b-float 3.2s ease-in-out infinite .76s;
    }
    @keyframes b-nod {
      0%, 100% { transform: translateY(0) scale(1); }
      45%       { transform: translateY(-14px) scale(1.07); }
    }

    /* s-ask: pupils shift left (looking at the input) */
    .pb-blasty.s-ask .pupil-group-l { transform: translateX(-3px); }
    .pb-blasty.s-ask .pupil-group-r { transform: translateX(-3px); }
    .pb-blasty.s-ask #blasty-body {
      animation: b-float 3.2s ease-in-out infinite;
    }

    /* s-working: rocking while sending */
    .pb-blasty.s-working #blasty-body {
      animation: b-work 1.1s ease-in-out infinite;
    }
    @keyframes b-work {
      0%, 100% { transform: translateY(0) rotate(-3deg); }
      50%       { transform: translateY(-5px) rotate(3deg); }
    }
    .pb-blasty.s-working .pupil-group-l,
    .pb-blasty.s-working .pupil-group-r {
      animation: look-down .35s ease forwards;
    }
    @keyframes look-down { to { transform: translateY(4px); } }

    /* s-celebrate: big bounce + confetti */
    .pb-blasty.s-celebrate #blasty-body {
      animation: b-celebrate .42s ease-in-out 4;
    }
    @keyframes b-celebrate {
      0%, 100% { transform: translateY(0) scale(1) rotate(0deg); }
      28%       { transform: translateY(-20px) scale(1.12) rotate(-5deg); }
      72%       { transform: translateY(-15px) scale(1.12) rotate(5deg); }
    }
    .pb-blasty.s-celebrate .confetti {
      animation: confetti-burst 1.4s ease-out forwards;
    }
    @keyframes confetti-burst {
      0%   { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(60px) scale(1.5); }
    }

    /* ── Mobile ──────────────────────────────────────────────────── */
    @media (max-width: 620px) {
      .pb-layout {
        flex-direction: column;
        padding: 20px 16px 60px;
        gap: 0;
      }
      .pb-blasty-zone {
        width: 100%;
        order: -1;
        flex-direction: row;
        justify-content: flex-end;
        align-items: center;
        position: static;
        padding-bottom: 10px;
        gap: 12px;
      }
      .pb-blasty { width: 96px; height: 118px; }
      .pb-logo   { display: none; }
      .pb-tagline { margin-bottom: 16px; }
    }
  </style>
</head>
<body class="has-site-header">
<div id="header__inject"></div>

<div class="pb-page">
  <div class="pb-layout">

    <!-- ── Chat thread (left) ──────────────────────────────────── -->
    <div class="pb-chat">
      <div class="pb-logo">BlastyBiz</div>
      <div class="pb-tagline">AI-adapted marketing copy for every platform</div>
      <div class="pb-thread" id="pb-thread"></div>
      <div class="pb-already">Already have an account? <a href="BlastyBiz-Login.html">Sign in →</a></div>
    </div>

    <!-- ── Blasty character (right) ────────────────────────────── -->
    <div class="pb-blasty-zone">
      <div class="pb-blasty s-wave" id="pb-blasty">
        <svg id="blasty-svg" viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">

          <!-- Confetti (revealed on s-celebrate) -->
          <g class="confetti" opacity="0">
            <circle cx="28"  cy="28"  r="6" fill="#00c853"/>
            <circle cx="172" cy="18"  r="5" fill="#ffe000"/>
            <circle cx="100" cy="8"   r="4" fill="#ff5252"/>
            <rect   x="52"   y="12"   width="9" height="9" rx="2" fill="#00b0ff"  transform="rotate(30,56,16)"/>
            <rect   x="138"  y="22"   width="8" height="8" rx="2" fill="#ff6d00"  transform="rotate(45,142,26)"/>
            <circle cx="62"  cy="4"   r="5" fill="#e040fb"/>
            <rect   x="108"  y="6"    width="9" height="9" rx="2" fill="#aafc08"  transform="rotate(20,112,10)"/>
          </g>

          <!-- Shadow -->
          <ellipse cx="100" cy="236" rx="54" ry="7" fill="rgba(0,200,83,0.12)"/>

          <!-- Whole character group — floats via CSS -->
          <g id="blasty-body">

            <!-- Left arm -->
            <g class="arm-l">
              <rect x="6" y="90" width="24" height="62" rx="12" fill="#0d1f0f"/>
            </g>

            <!-- Right arm -->
            <g class="arm-r">
              <rect x="170" y="90" width="24" height="62" rx="12" fill="#0d1f0f"/>
            </g>

            <!-- Body -->
            <rect x="30" y="108" width="140" height="118" rx="28" fill="#0d1f0f"/>

            <!-- Head -->
            <circle cx="100" cy="92" r="64" fill="#0d1f0f"/>

            <!-- Head gleam -->
            <ellipse cx="72" cy="52" rx="24" ry="15" fill="#183820" opacity="0.6"/>

            <!-- Left eye white -->
            <ellipse cx="76" cy="86" rx="19" ry="20" fill="white"/>

            <g class="pupil-group-l" style="transition: transform .3s ease">
              <circle cx="77" cy="87" r="11" fill="#050f06"/>

            <!-- Right eye white -->

            <!-- Mouth — smile -->

            <!-- Lightning bolt emblem on body -->
            <text x="100" y="192" text-anchor="middle"

          </g><!-- /#blasty-body -->
        </svg>
      </div>
    </div>

  </div><!-- /.pb-layout -->
</div><!-- /.pb-page -->

<!-- ── Conversation engine ────────────────────────────────────────── -->
<script>
(function() {
  const answers = {};
  let step = 0;

  const STEPS = [
    {
      mood: 's-wave',
      blastyMsg: "Hey! I'm Blasty. I help local businesses show up everywhere online. Let's get you started — what's your name?",
      inputType: 'text',
      inputTarget: 'preboard-name',
      placeholder: 'Your name…',
      hint: 'Press Enter or tap Continue',
      key: 'name',
      validate: v => v.trim().length >= 1 ? null : 'Please enter your name.'
    },
    {
      mood: 's-happy',
      blastyMsgFn: a => `Nice to meet you, ${a.name}! I was wondering — could you give me your email address? That's where I'll send your access link.`,
      inputType: 'email',
      inputTarget: 'preboard-email',
      placeholder: 'you@example.com',
      hint: 'No password ever — just click the link',
      key: 'email',
      validate: v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim()) ? null : 'Please enter a valid email address.'
    },
    {
      mood: 's-ask',
      blastyMsgFn: a => `Perfect, ${a.name}. Hit the button and I'll send your link right now.`,
      inputType: 'send',
      inputTarget: 'preboard-send',
      key: null
    }
  ];

  function setMood(mood) {
    document.getElementById('pb-blasty').className = 'pb-blasty ' + mood;
  }

  function addBlastyBubble(text, extraClass) {
    const thread = document.getElementById('pb-thread');
    const el = document.createElement('div');
    el.className = 'bubble-blasty' + (extraClass ? ' ' + extraClass : '');
    el.textContent = text;
    thread.appendChild(el);
    el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    return el;
  }

  function addUserBubble(id) {
    const thread = document.getElementById('pb-thread');
    const el = document.createElement('div');
    el.className = 'bubble-user';
    if (id) el.id = id;
    thread.appendChild(el);
    return el;
  }

  function lockBubble(el, text) {
    el.className = 'bubble-user locked';
    el.innerHTML = '';
    el.textContent = text;
  }

  function showStep() {
    if (step >= STEPS.length) return;
    const s = STEPS[step];

    setMood(s.mood);

    const delay = step === 0 ? 650 : 420;
    setTimeout(() => {
      const msg = s.blastyMsg || s.blastyMsgFn(answers);
      addBlastyBubble(msg);

      setTimeout(() => {
        renderInput(s);
      }, 300);
    }, delay);
  }

  function renderInput(s) {
    const bubble = addUserBubble('pb-user-' + (s.key || 'send'));

    if (s.inputType === 'text' || s.inputType === 'email') {
      const inp = document.createElement('input');
      inp.type = s.inputType;
      inp.className = 'bubble-input';
      inp.placeholder = s.placeholder;
      inp.setAttribute('data-guidance-target', s.inputTarget);
      inp.setAttribute('autocomplete', s.inputType === 'email' ? 'email' : 'given-name');
      bubble.appendChild(inp);

      if (s.hint) {
        const hint = document.createElement('div');
        hint.className = 'bubble-hint';
        hint.textContent = s.hint;
        bubble.appendChild(hint);
      }

      const err = document.createElement('div');
      err.className = 'pb-err';
      bubble.appendChild(err);

      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'bubble-action-btn';
      btn.textContent = 'Continue →';
      bubble.appendChild(btn);

      setTimeout(() => inp.focus(), 120);

      const submit = () => {
        const val = inp.value.trim();
        const validErr = s.validate ? s.validate(val) : null;
        if (validErr) { err.textContent = validErr; err.style.display = 'block'; inp.focus(); return; }
        err.style.display = 'none';
        answers[s.key] = val;
        lockBubble(bubble, val);
        step++;
        showStep();
      };

      inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); submit(); } });
      btn.addEventListener('click', submit);

    } else if (s.inputType === 'send') {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'bubble-action-btn';
      btn.setAttribute('data-guidance-target', s.inputTarget);
      btn.textContent = 'Send My Free Link →';
      bubble.appendChild(btn);

      const err = document.createElement('div');
      err.className = 'pb-err';
      bubble.appendChild(err);

      btn.addEventListener('click', async () => {
        if (!window._sendTrialLink) {
          err.textContent = 'Still loading — please try again.';
          err.style.display = 'block';
          return;
        }
        btn.disabled = true;
        btn.textContent = 'Sending…';
        err.style.display = 'none';
        setMood('s-working');

        try {
          await window._sendTrialLink(answers.name, answers.email);
          setMood('s-celebrate');
          lockBubble(bubble, '✓ Link sent!');
          setTimeout(() => {
            addBlastyBubble(
              `You're all set, ${answers.name}! 📬 Check your inbox — I'll be waiting for you on the other side.`,
              'bubble-success'
            );
          }, 640);
        } catch(e) {
          err.textContent = e.message || 'Something went wrong. Please try again.';
          err.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Send My Free Link →';
          setMood('s-ask');
        }
      });
    }

    setTimeout(() => bubble.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 120);
  }

  // Kick off
  showStep();
})();
</script>

<!-- ── Firebase (module) ──────────────────────────────────────────── -->
<script type="module">
import { auth } from './firebase-init-v2.js';
import {
  sendSignInLinkToEmail,
  onAuthStateChanged
} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

onAuthStateChanged(auth, user => {
  if (user) window.location.href = 'BlastyBiz.html';
});

window._sendTrialLink = async function(name, email) {
  const actionCodeSettings = {
    url: 'https://blastybiz-9523e.web.app/BlastyBiz.html?bbmode=trial',
    handleCodeInApp: true,
  };
  await sendSignInLinkToEmail(auth, email, actionCodeSettings);
  window.localStorage.setItem('bb_trial_email', email);
  window.localStorage.setItem('bb_trial_name', name);
};
</script>

<script>
fetch('blastybiz-header.html')
  .then(r => r.text())
  .then(html => { document.getElementById('header__inject').innerHTML = html; });
</script>
</body>
</html>
