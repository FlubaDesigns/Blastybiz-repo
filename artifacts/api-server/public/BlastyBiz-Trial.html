<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <meta name="description" content="Try BlastyBiz free — no credit card, no password. Say hi to Blasty and get your magic link in seconds."/>
  <link rel="stylesheet" href="global-style.css?v=1784608375366"/>
  <title>BlastyBiz — Try Free</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700&display=swap" rel="stylesheet"/>
  <script src="blastybiz-menu.js?v=3"></script>
  <style>

    /* ── Page shell ──────────────────────────────────────────────── */
    .pb-page {
      min-height: 100vh;
      padding-top: var(--main-offset, 55px);
      display: flex;
      align-items: flex-start;
    }

    .pb-layout {
      display: flex;
      flex-direction: row;
      width: 100%;
      max-width: 860px;
      margin: 0 auto;
      padding: 44px 24px 80px;
      gap: 36px;
      align-items: flex-start;
    }

    /* ── Chat column (left) ──────────────────────────────────────── */
    .pb-chat {
      flex: 1;
      min-width: 0;
      order: 1;
    }

    .pb-logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 30px;
      color: var(--green);
      letter-spacing: 2px;
      margin-bottom: 2px;
    }
    .pb-tagline {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 28px;
      letter-spacing: .4px;
    }

    /* ── Thread ──────────────────────────────────────────────────── */
    .pb-thread {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Blasty's bubble — right-aligned, tail points right toward Blasty */
    .bubble-mascot {
      align-self: flex-end;
      background: #0f1f11;
      border: 1px solid #213d24;
      color: #d8eed9;
      border-radius: 18px 4px 18px 18px;
      padding: 13px 17px;
      max-width: 84%;
      font-size: 15px;
      line-height: 1.6;
      animation: bb-in .28s ease both;
    }

    /* User's bubble — left-aligned, tail points left toward user */
    .bubble-user {
      align-self: flex-start;
      background: #000;
      border: 1.5px solid var(--border);
      border-radius: 4px 18px 18px 18px;
      padding: 14px 16px;
      min-width: 230px;
      max-width: 90%;
      animation: bb-in .28s ease .18s both;
    }

    /* Locked answer — replaces input, shows what they typed */
    .bubble-user.locked {
      background: var(--green);
      border-color: var(--green);
      color: #000;
      font-weight: 700;
      font-size: 15px;
      min-width: 0;
      padding: 12px 16px;
    }

    @keyframes bb-in {
      from { opacity: 0; transform: translateY(9px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Input inside user bubble */
    .bubble-input {
      display: block;
      width: 100%;
      box-sizing: border-box;
      background: var(--panel);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 11px 14px;
      font-size: 15px;
      color: var(--light);
      font-family: 'DM Sans', sans-serif;
      outline: none;
      transition: border-color .18s;
    }
    .bubble-input:focus { border-color: var(--green); }
    .bubble-input::placeholder { color: var(--muted); }

    .bubble-hint {
      font-size: 12px;
      color: var(--muted);
      margin-top: 7px;
    }

    /* Continue / Send button inside bubble */
    .bubble-action-btn {
      display: block;
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      background: var(--green);
      color: #000;
      font-weight: 700;
      font-size: 14px;
      border: none;
      border-radius: 9px;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: opacity .18s, transform .1s;
    }
    .bubble-action-btn:hover  { opacity: .88; }
    .bubble-action-btn:active { transform: scale(.98); }
    .bubble-action-btn:disabled { opacity: .42; cursor: not-allowed; }

    /* Error text */
    .pb-err {
      font-size: 13px;
      color: #e57373;
      margin-top: 7px;
      display: none;
    }

    /* Final success bubble from Blasty */
    .bubble-success {
      align-self: flex-end;
      background: var(--green);
      color: #000;
      border-radius: 18px 4px 18px 18px;
      padding: 14px 18px;
      max-width: 88%;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.65;
      animation: bb-in .38s ease both;
    }

    /* Already-have-account link */
    .pb-already {
      margin-top: 32px;
      font-size: 13px;
      color: var(--muted);
    }
    .pb-already a {
      color: var(--green);
      text-decoration: none;
      font-weight: 600;
    }

    /* ── Blasty zone (right) ─────────────────────────────────────── */
    .pb-mascot-zone {
      flex-shrink: 0;
      width: 190px;
      order: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: sticky;
      top: calc(var(--main-offset, 55px) + 20px);
    }

    .pb-mascot {
      width: 160px;
    }

    #mascot-svg { width: 100%; height: auto; overflow: visible; }

    /* ── Blasty animations ───────────────────────────────────────── */

    /* Idle float — always on #mascot-body */
    #mascot-body {
      transform-box: fill-box;
      transform-origin: bottom center;
      animation: b-float 3.2s ease-in-out infinite;
    }
    @keyframes b-float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-9px); }
    }

    /* Flame always pulses */
    .flame {
      transform-box: fill-box;
      transform-origin: top center;
      animation: b-flame-pulse 0.55s ease-in-out infinite;
    }
    @keyframes b-flame-pulse {
      0%, 100% { transform: scaleY(1) scaleX(1); }
      50%       { transform: scaleY(1.2) scaleX(0.88); }
    }

    /* s-wave: rocket tilts side-to-side (friendly greeting) */
    .pb-mascot.s-wave #mascot-body {
      animation: b-wave 0.7s ease-in-out 3, b-float 3.2s ease-in-out infinite 2.1s;
    }
    @keyframes b-wave {
      0%, 100% { transform: rotate(0deg) translateY(0); }
      30%       { transform: rotate(-14deg) translateY(-4px); }
      70%       { transform: rotate(10deg) translateY(-2px); }
    }

    /* s-happy: enthusiastic bounce */
    .pb-mascot.s-happy #mascot-body {
      animation: b-nod .38s ease-in-out 2, b-float 3.2s ease-in-out infinite .76s;
    }
    @keyframes b-nod {
      0%, 100% { transform: translateY(0) scale(1); }
      45%       { transform: translateY(-16px) scale(1.08); }
    }

    /* s-ask: lean toward the inputs, pupils shift left */
    .pb-mascot.s-ask .pupil-group-l { transform: translateX(-3px); }
    .pb-mascot.s-ask .pupil-group-r { transform: translateX(-3px); }
    .pb-mascot.s-ask #mascot-body {
      animation: b-float-lean 3.2s ease-in-out infinite;
    }
    @keyframes b-float-lean {
      0%, 100% { transform: translateY(0) rotate(-6deg); }
      50%       { transform: translateY(-8px) rotate(-6deg); }
    }

    /* s-working: engine firing hard — vibrate + big flame */
    .pb-mascot.s-working #mascot-body {
      animation: b-work 1.1s ease-in-out infinite;
    }
    @keyframes b-work {
      0%, 100% { transform: translateY(0) rotate(-3deg); }
      50%       { transform: translateY(-5px) rotate(3deg); }
    }
    .pb-mascot.s-working .flame {
      animation: b-flame-big 0.4s ease-in-out infinite;
    }
    @keyframes b-flame-big {
      0%, 100% { transform: scaleY(1.4) scaleX(1.1); }
      50%       { transform: scaleY(1.9) scaleX(0.8); }
    }
    .pb-mascot.s-working .pupil-group-l,
    .pb-mascot.s-working .pupil-group-r {
      animation: look-down .35s ease forwards;
    }
    @keyframes look-down { to { transform: translateY(4px); } }

    /* Mouth variants */
    .mouth-working, .mouth-celebrate, .mouth-ask { opacity: 0 !important; }

    /* Arms */
    .mascot-arm { transition: opacity .25s ease; }
    .pb-mascot.s-wave .mascot-arm-wave { opacity: 1 !important; }

    /* s-celebrate: launch bounce + confetti */
    .pb-mascot.s-celebrate #mascot-body {
      animation: b-celebrate .42s ease-in-out 4;
    }
    @keyframes b-celebrate {
      0%, 100% { transform: translateY(0) scale(1) rotate(0deg); }
      28%       { transform: translateY(-24px) scale(1.12) rotate(-6deg); }
      72%       { transform: translateY(-18px) scale(1.12) rotate(6deg); }
    }
    .pb-mascot.s-celebrate .confetti > g {
      transform-box: fill-box;
      transform-origin: center;
      animation: confetti-burst 1.4s ease-out forwards;
    }
    @keyframes confetti-burst {
      0%   { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(70px) scale(1.6); }
    }

    /* ── Mobile ──────────────────────────────────────────────────── */
    @media (max-width: 620px) {
      .pb-layout {
        flex-direction: column;
        padding: 20px 16px 60px;
        gap: 0;
      }
      .pb-mascot-zone {
        width: 100%;
        order: -1;
        flex-direction: row;
        justify-content: flex-end;
        align-items: center;
        position: static;
        padding-bottom: 10px;
        gap: 12px;
      }
      .pb-mascot { width: 56px; }
      .pb-logo   { display: none; }
      .pb-tagline { margin-bottom: 16px; }
    }
  </style>
</head>

<!-- ── Conversation engine ────────────────────────────────────────── -->
<script>
(function() {
  const answers = {};
  let step = 0;

  const STEPS = [
    {
      mood: 's-wave',
      blastyMsg: "Hey! I'm Blasty. I help local businesses show up everywhere online. Let's get you started — what's your name?",
      inputType: 'text',
      inputTarget: 'preboard-name',
      placeholder: 'Your name…',
      hint: 'Press Enter or tap Continue',
      key: 'name',
      validate: v => v.trim().length >= 1 ? null : 'Please enter your name.'
    },
    {
      mood: 's-happy',
      blastyMsgFn: a => `Nice to meet you, ${a.name}! I was wondering — could you give me your email address? That's where I'll send your access link.`,
      inputType: 'email',
      inputTarget: 'preboard-email',
      placeholder: 'you@example.com',
      hint: 'No password ever — just click the link',
      key: 'email',
      validate: v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim()) ? null : 'Please enter a valid email address.'
    },
    {
      mood: 's-ask',
      blastyMsgFn: a => `Perfect, ${a.name}. Hit the button and I'll send your link right now.`,
      inputType: 'send',
      inputTarget: 'preboard-send',
      key: null
    }
  ];

  function setMood(mood) {
    document.getElementById('pb-mascot').className = 'pb-mascot ' + mood;
  }

  function addMascotBubble(text, extraClass) {
    const thread = document.getElementById('pb-thread');
    const el = document.createElement('div');
    el.className = 'bubble-mascot' + (extraClass ? ' ' + extraClass : '');
    el.textContent = text;
    thread.appendChild(el);
    el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    return el;
  }

  function addUserBubble(id) {
    const thread = document.getElementById('pb-thread');
    const el = document.createElement('div');
    el.className = 'bubble-user';
    if (id) el.id = id;
    thread.appendChild(el);
    return el;
  }

  function lockBubble(el, text) {
    el.className = 'bubble-user locked';
    el.innerHTML = '';
    el.textContent = text;
  }

  function showStep() {
    if (step >= STEPS.length) return;
    const s = STEPS[step];

    setMood(s.mood);

    const delay = step === 0 ? 650 : 420;
    setTimeout(() => {
      const msg = s.blastyMsg || s.blastyMsgFn(answers);
      addMascotBubble(msg);

      setTimeout(() => {
        renderInput(s);
      }, 300);
    }, delay);
  }

  function renderInput(s) {
    const bubble = addUserBubble('pb-user-' + (s.key || 'send'));

    if (s.inputType === 'text' || s.inputType === 'email') {
      const inp = document.createElement('input');
      inp.type = s.inputType;
      inp.className = 'bubble-input';
      inp.placeholder = s.placeholder;
      inp.setAttribute('data-guidance-target', s.inputTarget);
      inp.setAttribute('autocomplete', s.inputType === 'email' ? 'email' : 'given-name');
      bubble.appendChild(inp);

      if (s.hint) {
        const hint = document.createElement('div');
        hint.className = 'bubble-hint';
        hint.textContent = s.hint;
        bubble.appendChild(hint);
      }

      const err = document.createElement('div');
      err.className = 'pb-err';
      bubble.appendChild(err);

      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'bubble-action-btn';
      btn.textContent = 'Continue →';
      bubble.appendChild(btn);

      setTimeout(() => inp.focus(), 120);

      const submit = () => {
        const val = inp.value.trim();
        const validErr = s.validate ? s.validate(val) : null;
        if (validErr) { err.textContent = validErr; err.style.display = 'block'; inp.focus(); return; }
        err.style.display = 'none';
        answers[s.key] = val;
        lockBubble(bubble, val);
        step++;
        showStep();
      };

      inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); submit(); } });
      btn.addEventListener('click', submit);

    } else if (s.inputType === 'send') {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'bubble-action-btn';
      btn.setAttribute('data-guidance-target', s.inputTarget);
      btn.textContent = 'Send My Free Link →';
      bubble.appendChild(btn);

      const err = document.createElement('div');
      err.className = 'pb-err';
      bubble.appendChild(err);

      btn.addEventListener('click', async () => {
        if (!window._sendTrialLink) {
          err.textContent = 'Still loading — please try again.';
          err.style.display = 'block';
          return;
        }
        btn.disabled = true;
        btn.textContent = 'Sending…';
        err.style.display = 'none';
        setMood('s-working');

        try {
          await window._sendTrialLink(answers.name, answers.email);
          setMood('s-celebrate');
          lockBubble(bubble, '✓ Link sent!');
          setTimeout(() => {
            addMascotBubble(
              `You're all set, ${answers.name}! 📬 Check your inbox — I'll be waiting for you on the other side.`,
              'bubble-success'
            );
          }, 640);
        } catch(e) {
          err.textContent = e.message || 'Something went wrong. Please try again.';
          err.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Send My Free Link →';
          setMood('s-ask');
        }
      });
    }

    setTimeout(() => bubble.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 120);
  }

  // Kick off
  showStep();
})();
</script>

<!-- ── Firebase (module) ──────────────────────────────────────────── -->
<script type="module">
import { auth, db } from './firebase-init-v2.js';
import {
  sendSignInLinkToEmail,
  onAuthStateChanged
} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

onAuthStateChanged(auth, async user => {
  if (!user) return;
  try {
    const snap = await getDoc(doc(db, 'users', user.uid));
    const ud = snap.exists() ? snap.data() : {};
    if (ud.onboarded && ud.onboardingVersion && ud.activeBusiness) {
      window.location.href = 'BlastyBiz.html';
    } else {
      window.location.href = 'BlastyBiz-Onboard2.html';
    }
  } catch(e) {
    window.location.href = 'BlastyBiz-Onboard2.html';
  }
});

window._sendTrialLink = async function(name, email) {
  const actionCodeSettings = {
    url: 'https://blastybiz-9523e.web.app/BlastyBiz-Onboard2.html',
    handleCodeInApp: true,
  };
  await sendSignInLinkToEmail(auth, email, actionCodeSettings);
  window.localStorage.setItem('bb_trial_email', email);
  window.localStorage.setItem('bb_trial_name', name);
};
</script>

<script>
fetch('blastybiz-header.html')
  .then(r => r.text())
  .then(html => { document.getElementById('header__inject').innerHTML = html; });
</script>
