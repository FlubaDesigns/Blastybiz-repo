name: Release checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blastybiz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install functions dependencies
        run: npm ci
        working-directory: functions
      - name: Run release checks
        # Newly added endpoints cannot be live before their first deployment.
        # The Authorization Engine verifies live endpoints after backend deploy.
        run: |
          SKIP_CF_ENDPOINT_CHECK=1 node scripts/check-release.cjs
          node scripts/check-cf-endpoints.cjs --self-test
      - name: Review regression checks
        run: |
          node scripts/test-review-regressions.cjs
          node scripts/test-photo-regressions.cjs
          node scripts/test-setup-regressions.cjs
          node scripts/test-pass6-regressions.cjs
          node scripts/sync-schedule.cjs --check
          node scripts/sync-platforms.cjs --check
          node scripts/sync-business-form.cjs --check
          node scripts/test-name-parts.cjs
          node scripts/test-pass7-regressions.cjs
          node scripts/test-pass7-corrections.cjs
          node scripts/test-pass8-regressions.cjs
          node scripts/test-pass8-corrections.cjs
          node scripts/test-pass9-regressions.cjs
          node scripts/test-pass9-corrections.cjs
          node scripts/test-pass10-regressions.cjs
          node scripts/test-pass10-corrections.cjs
          node scripts/test-pass11-lifecycle.cjs
          node scripts/test-pass11-corrections.cjs
          node scripts/test-audit2-repairs.cjs
          node scripts/test-audit2-corrections.cjs
          node scripts/test-retirement-guards.cjs
          node scripts/test-backend-audit.cjs
          node scripts/test-backend-review.cjs
          python3 scripts/test-backup-identity.py
          node scripts/test-backup-verification.cjs
      - name: Real photo decoding and encoding
        run: |
          npm install --prefix "$RUNNER_TEMP/blasty-photos" --no-audit --no-fund @napi-rs/canvas@0.1.80
          CANVAS_PATH="$RUNNER_TEMP/blasty-photos/node_modules/@napi-rs/canvas" node scripts/test-image-preparation.cjs
      - name: Ad controls and gesture DOM checks
        run: |
          npm install --prefix "$RUNNER_TEMP/blasty-dom" --no-audit --no-fund jsdom@26.1.0
          JSDOM_PATH="$RUNNER_TEMP/blasty-dom/node_modules/jsdom" node scripts/test-pass10-ui.cjs
          JSDOM_PATH="$RUNNER_TEMP/blasty-dom/node_modules/jsdom" node scripts/test-pass11-ui.cjs
          JSDOM_PATH="$RUNNER_TEMP/blasty-dom/node_modules/jsdom" node scripts/test-pass11-status.cjs
          JSDOM_PATH="$RUNNER_TEMP/blasty-dom/node_modules/jsdom" node scripts/test-audit2-ui.cjs
          JSDOM_PATH="$RUNNER_TEMP/blasty-dom/node_modules/jsdom" node scripts/test-backend-review-ui.cjs
          JSDOM_PATH="$RUNNER_TEMP/blasty-dom/node_modules/jsdom" node scripts/test-personal-seller.cjs
          JSDOM_PATH="$RUNNER_TEMP/blasty-dom/node_modules/jsdom" node scripts/test-signup-submit.cjs
          JSDOM_PATH="$RUNNER_TEMP/blasty-dom/node_modules/jsdom" node scripts/test-original-flow-ui.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Actual Firestore authorization boundary tests
        run: |
          npm install --prefix "$RUNNER_TEMP/blasty-rules" --no-audit --no-fund @firebase/rules-unit-testing@4.0.1 firebase@11.10.0 firebase-tools@14.17.0
          RULES_TEST_PATH="$RUNNER_TEMP/blasty-rules/node_modules/@firebase/rules-unit-testing" FIREBASE_CLIENT_PATH="$RUNNER_TEMP/blasty-rules/node_modules/firebase/firestore" "$RUNNER_TEMP/blasty-rules/node_modules/.bin/firebase" emulators:exec --only firestore,storage --project demo-blastybiz-audit2 --config firebase.audit2.json 'node scripts/test-audit2-rules.cjs && node scripts/test-backend-storage.cjs && node scripts/test-backend-deletion-emulator.cjs && node scripts/test-backend-review-emulator.cjs'

# Production deployment uses Fluba's existing Authorization Engine workflow:
# FlubaDesigns/fluba-designs/.github/workflows/blastybiz-release.yml.
# Keep this workflow as the exact-source check gate; no second credential path.
