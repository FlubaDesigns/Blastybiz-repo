name: Release checks and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blastybiz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install functions dependencies
        run: npm ci
        working-directory: functions
      - name: Run release checks
        # Newly added endpoints cannot be live before their first deployment.
        # The Authorization Engine verifies live endpoints after backend deploy.
        run: |
          SKIP_CF_ENDPOINT_CHECK=1 node scripts/check-release.cjs
          node scripts/check-cf-endpoints.cjs --self-test
      - name: Review regression checks
        run: |
          node scripts/test-review-regressions.cjs
          node scripts/test-photo-regressions.cjs
          node scripts/test-setup-regressions.cjs
          node scripts/test-pass6-regressions.cjs
          node scripts/sync-schedule.cjs --check
          node scripts/sync-platforms.cjs --check
          node scripts/test-pass7-regressions.cjs
          node scripts/test-pass7-corrections.cjs
          node scripts/test-pass8-regressions.cjs
          node scripts/test-pass8-corrections.cjs
          node scripts/test-pass9-regressions.cjs
          node scripts/test-pass9-corrections.cjs
          node scripts/test-pass10-regressions.cjs
          node scripts/test-pass10-corrections.cjs
      - name: Ad controls and gesture DOM checks
        run: |
          npm install --prefix "$RUNNER_TEMP/blasty-dom" --no-audit --no-fund jsdom@26.1.0
          JSDOM_PATH="$RUNNER_TEMP/blasty-dom/node_modules/jsdom" node scripts/test-pass10-ui.cjs

  deploy:
    needs: check-release
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require deployment credential
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo '::error::FIREBASE_TOKEN repository secret is missing. Main is updated but production deployment is blocked.'
            exit 1
          fi
      - name: Install functions dependencies
        run: npm ci
        working-directory: functions
      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.29.0
      - name: Deploy rules and indexes
        run: firebase deploy --project blastybiz-9523e --non-interactive --only firestore:rules,firestore:indexes,storage
      - name: Deploy reviewed backend
        run: firebase deploy --project blastybiz-9523e --non-interactive --only functions:adminRetryJob,functions:adminMarkManualFollowup,functions:adminListActivityLogs,functions:dispatchPublishJob,functions:jobFailedTrigger,functions:jobCompletedTrigger,functions:approvePendingPost,functions:chatCampaign,functions:deleteBusiness,functions:manageAd,functions:approveDraft,functions:businessCreatedTrigger,functions:createBusiness,functions:deleteCampaign,functions:createCheckoutSession,functions:squareWebhook,functions:scheduledPostingCheck,functions:scheduledDraftPreview,functions:draftAction,functions:adaptListing,functions:generateEnrichmentQuestions,functions:suggestCategory,functions:previewAds,functions:extractBizContext,functions:resolveCategories,functions:suggestPlatforms,functions:scoreFact
      - name: Review and apply non-publishing platform migration
        run: |
          export NODE_PATH="$(npm root -g)"
          node scripts/migrate-platform-config.cjs --project=blastybiz-9523e
          node scripts/migrate-platform-config.cjs --project=blastybiz-9523e --apply
      - name: Identify deployed source
        run: node -e 'require("fs").writeFileSync("public/release.json", JSON.stringify({commit:process.env.GITHUB_SHA, deployedAt:new Date().toISOString()}))'
      - name: Deploy website
        run: firebase deploy --project blastybiz-9523e --non-interactive --only hosting
      - name: Verify public release
        run: node scripts/verify-live-release.cjs
