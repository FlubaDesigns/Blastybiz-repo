name: Release checks and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blastybiz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install functions dependencies
        run: npm ci
        working-directory: functions
      - name: Run release checks
        run: node scripts/check-release.cjs
      - name: Review regression checks
        run: |
          node scripts/test-review-regressions.cjs
          node scripts/test-photo-regressions.cjs
          node scripts/test-setup-regressions.cjs

  deploy:
    needs: check-release
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require deployment credential
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo '::error::FIREBASE_TOKEN repository secret is missing. Main is updated but production deployment is blocked.'
            exit 1
          fi
      - name: Install functions dependencies
        run: npm ci
        working-directory: functions
      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.29.0
      - name: Deploy reviewed backend, rules, and indexes
        run: firebase deploy --project blastybiz-9523e --non-interactive --only firestore:rules,firestore:indexes,storage,functions:adminRetryJob,functions:adminListActivityLogs,functions:dispatchPublishJob,functions:jobFailedTrigger,functions:jobCompletedTrigger
      - name: Identify deployed source
        run: node -e 'require("fs").writeFileSync("public/release.json", JSON.stringify({commit:process.env.GITHUB_SHA, deployedAt:new Date().toISOString()}))'
      - name: Deploy website
        run: firebase deploy --project blastybiz-9523e --non-interactive --only hosting
      - name: Verify public release
        run: node scripts/verify-live-release.cjs
