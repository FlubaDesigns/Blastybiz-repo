name: Release checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install functions dependencies
        run: npm ci
        working-directory: functions

      - name: Run release checks
        run: node scripts/check-release.cjs
